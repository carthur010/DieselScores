    el.innerHTML = `<div class="layer-in"><div class="layer-top"><button class="circ" data-menu="settings" aria-label="Settings">${IC.gear}</button><span class="sp"></span><button class="circ" data-close="edit" aria-label="Done">${IC.check}</button></div>${body}</div>
      <label class="searchbar">${IC.search}<input id="eq" type="search" placeholder="Teams, Leagues, and More" value="${esc(editQuery)}" autocomplete="off" aria-label="Search teams and leagues"></label>`;
    const inp = el.querySelector("#eq");
    inp.addEventListener("input", () => { editQuery = inp.value.trim(); runSearch(); });
  }
  function runSearch() {
    clearTimeout(searchTimer);
    if (!editQuery) { editResults = []; renderEdit(); focusSearch(); return; }
    renderEdit(); focusSearch();
    searchTimer = setTimeout(async () => {
      const seq = ++searchSeq;
      try {
        const j = await (await fetch("https://site.api.espn.com/apis/common/v3/search?type=team&limit=40&query=" + encodeURIComponent(editQuery))).json();
        if (seq !== searchSeq) return;
        const seen = new Set();
        editResults = (j.items || []).map(i => {
          const lgId = LG_BY_SLUG[(i.sport || "") + "/" + (i.league || i.defaultLeagueSlug || "")];
          if (!lgId || !i.abbreviation) return null;
          return { lg: lgId, id: i.id, abbr: i.abbreviation, name: i.displayName || i.name || "", logo: i.logos?.[0]?.href || "", color: hexColor(i.color) };
        }).filter(t => t && !seen.has(t.lg + t.id) && seen.add(t.lg + t.id)).slice(0, 25);
      } catch { editResults = []; }
      renderEdit(); focusSearch();
    }, 250);
  }
  function focusSearch() { const i = document.getElementById("eq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  function openEdit(focus) { editQuery = ""; editResults = []; renderEdit(); openLayer("edit"); ensureMeta([...state.favs]).then(renderSheet); if (focus) setTimeout(focusSearch, 60); }
  // drag to reorder leagues
  let drag = null;
  document.getElementById("edit").addEventListener("pointerdown", e => {
    const hd = e.target.closest(".handle"); if (!hd) return;
    const r = hd.closest(".lrow");
    drag = { row: r, list: r.parentElement };
    r.classList.add("dragging");
    hd.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  document.getElementById("edit").addEventListener("pointermove", e => {
    if (!drag) return;
    const rows = [...drag.list.children], i = rows.indexOf(drag.row), y = e.clientY;
    const prev = rows[i - 1], next = rows[i + 1];
    if (prev) { const b = prev.getBoundingClientRect(); if (y < b.top + b.height / 2) { drag.list.insertBefore(drag.row, prev); return; } }
    if (next) { const b = next.getBoundingClientRect(); if (y > b.top + b.height / 2) drag.list.insertBefore(next, drag.row); }
  });
  const endDrag = () => {
    if (!drag) return;
    drag.row.classList.remove("dragging");
    state.favLeagues = [...drag.list.querySelectorAll(".lrow")].map(r => r.dataset.lg).filter(Boolean);
    store.set("favLeagues", state.favLeagues);
    drag = null;
    render();
  };
  document.getElementById("edit").addEventListener("pointerup", endDrag);
  document.getElementById("edit").addEventListener("pointercancel", endDrag);

  // ---------- Settings ----------
  async function askPermission() { try { if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); } catch {} }
  function applyPalette() { const p = store.get("palette2", "green"); if (p === "green") delete document.documentElement.dataset.palette; else document.documentElement.dataset.palette = p; }
  applyPalette();
  function opt(group, val, label, on) { return `<button class="opt ${on ? "on" : ""}" data-set="${group}" data-val="${val}">${esc(label)}</button>`; }
  function renderSettings() {
    const el = document.getElementById("settings");
    const p = store.get("palette2", "green");
    const groups = [["team", "My teams", "Games with teams you follow"], ["watched", "Games you're watching", "Tap the bell on a game card to add it"], ["all", "All games", "Anything that turns interesting, any team"]];
    el.innerHTML = `<div class="layer-in"><div class="layer-top"><span class="sp"></span><button class="circ" data-close="settings" aria-label="Done">${IC.check}</button></div>
      <h2>Settings</h2>
      <div class="set"><b>Open to</b><small>What you see when the app opens</small><div class="opts">${opt("home2", "home", "Home", state.view === "home")}${opt("home2", "live", "Live Now", state.view === "live")}${opt("home2", "teams", "My Teams", state.view === "teams")}</div></div>
      <div class="set"><b>Layout</b><small>Expanded is the big scoreboard look. Compact fits more games on screen.</small><div class="opts">${opt("layout2", "expanded", "Expanded", store.get("layout2", "expanded") === "expanded")}${opt("layout2", "compact", "Compact", store.get("layout2", "expanded") === "compact")}</div></div>
      <div class="set"><b>Color</b><small>Background tint</small><div class="opts">${opt("palette2", "green", "Field Green", p === "green")}${opt("palette2", "red", "Brick Red", p === "red")}${opt("palette2", "navy", "Navy", p === "navy")}</div></div>
      <h2>Alerts</h2>
      ${groups.map(([g, l, s]) => `<div class="set"><b>${esc(l)}</b><small>${esc(s)}</small><div class="opts">${ALERT_EVENTS[g].map(([ev, name]) => `<button class="opt ${state.alertPrefs[g][ev] ? "on" : ""}" data-alert-group="${g}" data-alert-ev="${ev}">${esc(name)}</button>`).join("")}</div></div>`).join("")}
      <div class="set"><b>Test alerts</b><small>${esc(notifyStatus())}. Alerts work while Scores is open.</small><div class="opts"><button class="opt" data-test-alert>Send test</button></div></div>
      <h2>Versions</h2>
      <div class="set"><div class="opts"><a class="opt" href="../">Live app</a><a class="opt" href="../beta/">Classic beta</a></div></div>
    </div>`;
  }
  function openSettings() { renderSettings(); openLayer("settings"); }

  // ---------- events ----------
  const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  document.addEventListener("click", async e => {
    const t = e.target;
    const app = t.closest("a[data-app]");
    if (app && IS_MOBILE) {
      e.preventDefault();
      const web = app.href; let left = false; const gone = () => { left = true; };
      document.addEventListener("visibilitychange", () => { if (document.hidden) gone(); }, { once: true });
      window.addEventListener("pagehide", gone, { once: true }); window.addEventListener("blur", gone, { once: true });
      setTimeout(() => { if (!left && !document.hidden) window.location.href = web; }, 1400);
      window.location.href = app.dataset.app; return;
    }
    if (t.closest("#menubtn")) { document.getElementById("menu").hidden ? openMenu() : closeMenu(); return; }
    if (t.closest("#scrim")) { closeMenu(); return; }
    const m = t.closest("[data-menu]");
    if (m) { closeMenu(); const a = m.dataset.menu; if (a === "settings") openSettings(); else if (a === "edit") openEdit(false); else if (a === "search") openEdit(true); return; }
    const v = t.closest("[data-view]"); if (v) { setView(v.dataset.view); return; }
    const d = t.closest("[data-day]"); if (d) { setDay(d.dataset.day); return; }
    const c = t.closest("[data-close]"); if (c) { closeLayer(c.dataset.close); if (c.dataset.close === "edit") render(); return; }
    const w = t.closest("[data-watchgame]"); if (w) { toggleWatch(w.dataset.watchgame); return; }
    const gt = t.closest("[data-gtab]"); if (gt) { state.gameTab = gt.dataset.gtab; const g = findGame(openGameKey); const lg = LG[openGameKey.split(":")[0]]; const y = document.getElementById("game").scrollTop; document.getElementById("game").innerHTML = gameShell(g, lastSummary, lg); document.getElementById("game").scrollTop = y; return; }
    const sh = t.closest("[data-share]");
    if (sh) {
      const g = findGame(sh.dataset.share); if (!g) return;
      const text = `${g.teams[0].abbr} ${g.teams[0].score ?? ""}, ${g.teams[1].abbr} ${g.teams[1].score ?? ""} · ${statusText(g)}`;
      try { if (navigator.share) await navigator.share({ title: "Scores", text, url: g.link || location.href }); else { await navigator.clipboard.writeText(text + " " + (g.link || "")); toast("Copied", text, "", "", false); } } catch {}
      return;
    }
    const gm = t.closest("[data-game]"); if (gm) { openGame(gm.dataset.game); return; }
    const fd = t.closest("[data-fold]");
    if (fd) { const id = fd.dataset.fold; state.closed.has(id) ? state.closed.delete(id) : state.closed.add(id); render(); return; }
    const cf = t.closest("[data-cardfav]");
    if (cf) {
      let meta = null; try { meta = JSON.parse(cf.dataset.cardfav); } catch {}
      if (meta) { const k = favKey(LG[meta.lg], meta.abbr); toggleFav(k, meta); toast(state.favs.has(k) ? "Following" : "Unfollowed", meta.name, "", "", false); const y = document.getElementById("game").scrollTop; document.getElementById("game").innerHTML = gameShell(findGame(openGameKey), lastSummary, LG[openGameKey.split(":")[0]]); document.getElementById("game").scrollTop = y; }
      return;
    }
    const dt = t.closest("[data-date-tog]"); if (dt) { const k = dt.dataset.dateTog; state.closedDates.has(k) ? state.closedDates.delete(k) : state.closedDates.add(k); renderUpcoming(); return; }
    const lf = t.closest("[data-lfav]");
    if (lf) { const id = lf.dataset.lfav; state.favLeagues = state.favLeagues.includes(id) ? state.favLeagues.filter(x => x !== id) : [...state.favLeagues, id]; store.set("favLeagues", state.favLeagues); renderEdit(); render(); return; }
    const tf = t.closest("[data-tfav]"); if (tf) { toggleFav(tf.dataset.tfav); return; }
    const tr = t.closest("[data-tres]");
    if (tr) { const x = editResults[+tr.dataset.tres]; if (x) toggleFav(keyFor(x), { lg: x.lg, id: x.id, name: x.name, logo: x.logo, color: x.color, abbr: x.abbr }); return; }
    const s = t.closest("[data-set]");
    if (s) {
      const key = s.dataset.set, val = s.dataset.val;
      if (key === "home2") { state.view = val; store.set("home2", val); render(); }
      if (key === "palette2") { store.set("palette2", val); applyPalette(); }
      if (key === "layout2") { store.set("layout2", val); render(); }
      renderSettings(); return;
    }
    const ag = t.closest("[data-alert-group]");
    if (ag) { const g = ag.dataset.alertGroup, ev = ag.dataset.alertEv; state.alertPrefs[g][ev] = !state.alertPrefs[g][ev]; store.set("alertPrefs", state.alertPrefs); if (state.alertPrefs[g][ev]) askPermission(); renderSettings(); return; }
    if (t.closest("[data-test-alert]")) { toast("Test alert", "In-app alerts are working.", "", "", false); await askPermission(); if ("Notification" in window && Notification.permission === "granted") notify("Test alert", "Phone notifications are working too.", "", "", false, "test"); renderSettings(); return; }
  });
  document.addEventListener("change", e => {
    if (e.target.id === "datepick" && e.target.value) { const [y, m, d] = e.target.value.split("-").map(Number); setDate(new Date(y, m - 1, d)); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); ["game", "edit", "settings"].forEach(closeLayer); } });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && state.day === "today" && state.updatedAt && Date.now() - state.updatedAt > 25000) loadAll();
  });
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});

  loadAll();
})();
</script>
</body>
</html>
