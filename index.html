  // =====================================================================
  // Rendering: page
  // =====================================================================
  function renderDates() {
    const nav = document.getElementById("dates");
    const days = [];
    for (let i = -3; i <= 3; i++) days.push(addDays(state.date, i));
    nav.innerHTML = days.map(d => `<button class="d ${sameDay(d, state.date) ? "on" : ""}">${esc(dayLabel(d))}</button>`).join("") +
      `<label class="iconbtn" title="Pick a date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><input type="date" id="datepick" aria-label="Pick a date" value="${isoDate(state.date)}"></label>`;
    nav.querySelectorAll("button.d").forEach((b, i) => b.onclick = () => setDate(days[i]));
    nav.querySelector("#datepick").addEventListener("change", e => {
      const [y, m, d] = e.target.value.split("-").map(Number);
      if (y) setDate(new Date(y, m - 1, d));
    });
    const on = nav.querySelector(".on");
    if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function poolFor(tab, games) {
    switch (tab) {
      case "live": return games.filter(g => g.state === "in");
      case "all": case "mine": return games;
      case "teams": return games.filter(g => g.fav);
      case "close": return games.filter(g => g.close);
      case "cfb25": return games.filter(g => g.lg.id === "ncaaf" && g.teams.some(t => t.rank));
      case "p4": return games.filter(g => g.lg.id === "ncaaf" && g.p4);
      default: return games.filter(g => g.lg.id === tab);
    }
  }
  function specialsFor(tab) {
    const all = allSpecial();
    if (tab === "all" || tab === "live") return all.filter(e => e.state === "in");
    if (LG[tab]?.kind) return all.filter(e => e.lg.id === tab);
    return [];
  }

  function renderTabs(games) {
    const el = document.getElementById("tabs");
    const counts = {};
    games.forEach(g => counts[g.lg.id] = (counts[g.lg.id] || 0) + 1);
    allSpecial().forEach(e => counts[e.lg.id] = (counts[e.lg.id] || 0) + 1);
    const liveN = games.filter(g => g.state === "in").length + allSpecial().filter(e => e.state === "in").length;
    const closeN = games.filter(g => g.close).length;
    const chips = [
      { id: "live", label: "Live", n: liveN, hot: liveN > 0, cls: "livechip" },
      { id: "all", label: "All" },
      { id: "teams", label: "My Teams", n: games.filter(g => g.fav).length || null },
      { id: "mine", label: "My Leagues" },
      { id: "upcoming", label: "Upcoming" },
      { id: "close", label: "Close games", n: closeN, hot: closeN > 0 },
    ];
    const cfb = games.filter(g => g.lg.id === "ncaaf");
    LEAGUES.filter(lg => (MAIN_TABS.includes(lg.id) && counts[lg.id] > 0) || state.tab === lg.id).forEach(lg => {
      chips.push({ id: lg.id, label: lg.short || lg.name, n: counts[lg.id] || 0 });
      if (lg.id === "ncaaf") {
        chips.push({ id: "cfb25", label: "CFB Top 25", n: cfb.filter(g => g.teams.some(t => t.rank)).length });
        chips.push({ id: "p4", label: "Power 4", n: cfb.filter(g => g.p4).length });
      }
    });
    if (["cfb25", "p4"].includes(state.tab) && !chips.some(c => c.id === state.tab))
      chips.push({ id: state.tab, label: state.tab === "p4" ? "Power 4" : "CFB Top 25", n: 0 });
    el.innerHTML = chips.map(c =>
      `<button class="chip ${c.cls || ""} ${state.tab === c.id ? "on" : ""} ${c.hot ? "hot" : ""}" role="tab" aria-selected="${state.tab === c.id}" data-id="${c.id}">${esc(c.label)}${c.n != null ? `<span class="n">${c.n}</span>` : ""}</button>`).join("");
    el.querySelectorAll("button").forEach(b => b.onclick = () => { state.tab = b.dataset.id; store.set("tab2", state.tab); render(); });
  }

  // ---- Upcoming: the next three days for your leagues and teams
  function upcomingIds() {
    const teamLgs = [...state.favs].map(k => state.favMeta[k]?.lg || k.split(":")[0]).filter(id => LG[id] && !LG[id].kind);
    return [...new Set(state.favLeagues.filter(id => LG[id] && !LG[id].kind).concat(teamLgs))];
  }
  async function loadUpcoming() {
    const ids = upcomingIds(), key = ids.join(",") + "|" + ymd(startOfDay(new Date()));
    if (state.upcoming.loading || (state.upcoming.key === key && Date.now() - state.upcoming.at < 10 * 60e3)) return;
    state.upcoming.loading = true;
    const dates = [1, 2, 3].map(n => addDays(startOfDay(new Date()), n));
    const days = await Promise.all(dates.map(async d => {
      const lists = await Promise.allSettled(ids.map(async id => {
        const lg = LG[id];
        const r = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(d) + (lg.extra || ""), { cache: "no-store" });
        if (!r.ok) return [];
        let games = ((await r.json()).events || []).map(ev => normalize(ev, lg));
        if (lg.topFlight && games.length) { const set = await loadTopFlight(lg.topFlight); if (set) games = games.filter(g => g.teams.some(t => set.has(t.id))); }
        return games;
      }));
      return { date: d, games: lists.flatMap(x => x.status === "fulfilled" ? x.value : []) };
    }));
    state.upcoming = { key, at: Date.now(), days, loading: false };
    if (state.tab === "upcoming") render();
  }
  function upcomingHTML() {
    const up = state.upcoming;
    if (!up.days?.length) return '<div class="skel"></div><div class="skel"></div>';
    const order = upcomingIds();
    let html = `<div class="mine-bar"><span>Next 3 days · your teams, then your leagues</span><button class="chip" data-edit-leagues>Edit leagues</button></div>`;
    up.days.forEach(({ date, games }) => {
      games = games.map(g => ({ ...g, fav: g.teams.some(t => isFavTeam(g.lg, t.abbr)) }));
      if (!games.length) return;
      const byTime = (x, y) => new Date(x.date) - new Date(y.date);
      const mine = games.filter(g => g.fav).sort((x, y) => gameRank(x) - gameRank(y) || byTime(x, y));
      let body = "";
      if (mine.length) body += state.view === "league" ? `<h3 class="up-lg">My Teams</h3><div class="grid">${mine.map(card).join("")}</div>`
        : `<h3 class="up-lg">My Teams</h3>${timeline(mine)}`;
      order.forEach(id => {
        const list = games.filter(g => g.lg.id === id && !g.fav).sort(byTime);
        if (!list.length) return;
        body += state.view === "league" ? `<h3 class="up-lg">${esc(LG[id].name)}</h3><div class="grid">${list.map(card).join("")}</div>` : timeline(list);
      });
      html += block("up-" + ymd(date), date.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }), countLabel(games.length), body);
    });
    if (!up.days.some(d => d.games.length)) html += `<div class="block empty">Nothing scheduled in the next three days for your leagues.</div>`;
    return html;
  }

  function render() {
    document.querySelectorAll("[data-view]").forEach(b => { const on = b.dataset.view === state.view; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    renderDates();
    const games = allGames();
    renderTabs(games);
    const main = document.getElementById("main");
    const liveN = games.filter(g => g.state === "in").length;
    document.getElementById("livebug").hidden = liveN === 0;
    document.getElementById("liven").textContent = liveN;

    if (LEAGUES.every(lg => state.data[lg.id]?.error)) {
      main.innerHTML = `<div class="block err">Couldn't reach the scores feed. Check your internet connection, then tap refresh.</div>`;
      return;
    }

    const tab = state.tab;
    const pool = poolFor(tab, games);
    let html = "";

    // Your teams strip: today's games plus the next game for everyone else
    if (["live", "all", "mine"].includes(tab)) {
      const mine = games.filter(g => g.fav).sort((a, b) => ({ in: 0, pre: 1, post: 2 }[a.state] - { in: 0, pre: 1, post: 2 }[b.state]) || gameRank(a) - gameRank(b));
      const playing = new Set(mine.flatMap(g => g.teams.map(t => favKey(g.lg, t.abbr))));
      const nexts = isToday() ? [...state.favs].filter(k => !playing.has(k) && state.next[k]?.date)
        .sort((a, b) => favRank(a) - favRank(b)) : [];
      html += `<div class="mystrip" aria-label="Your teams">${mine.map(stripChip).join("")}${nexts.map(nextChip).join("")}<button class="ms add" data-open-sheet>${state.favs.size ? "+ Teams" : "+ Follow teams"}</button></div>`;
    }

    // Worth A Watch: always at the top of Live and All. Only games that earned it:
    // playoffs, close and late, overtime/extra innings, an upset brewing, or a Top 25 clash in progress.
    // Every close game and every playoff game makes it, your teams included. No filler.
    let shown = new Set();
    if (["live", "all"].includes(tab)) {
      const earned = g => g.state === "in" && (g.close || g.playoff || g.reasons.some(r => /Overtime|Extra|Upset|Top 25/.test(r)));
      const must = games.filter(g => earned(g) && (g.close || g.playoff)).sort((x, y) => y.hype - x.hype);
      const other = games.filter(g => earned(g) && !g.close && !g.playoff).sort((x, y) => y.hype - x.hype);
      const picks = must.concat(other.slice(0, Math.max(0, 6 - must.length)));
      if (picks.length) {
        if (tab === "live") shown = new Set(picks.map(g => g.id));
        html += block("worth", "Worth A Watch", countLabel(picks.length),
          `<div class="feat">${picks.map(featured).join("")}</div>`);
      }
    }

    document.getElementById("dates").hidden = tab === "upcoming";
    if (tab === "upcoming") {
      main.innerHTML = upcomingHTML();
      loadUpcoming();
      return;
    }

    // My Teams: today's games for teams you follow, then everyone's next game
    if (tab === "teams") {
      const ORD = { in: 0, pre: 1, post: 2 };
      const mine = games.filter(g => g.fav).sort((a, b) => (ORD[a.state] - ORD[b.state]) || gameRank(a) - gameRank(b));
      html += `<div class="mine-bar"><span>Following ${state.favs.size} team${state.favs.size === 1 ? "" : "s"}</span><button class="chip" data-open-sheet>Edit teams</button></div>`;
      if (mine.length) {
        const liveN = mine.filter(g => g.state === "in").length;
        html += block("myteams", isToday() ? "Today" : dayLabel(state.date), liveN ? `${liveN} Live · ${mine.length} Total` : countLabel(mine.length),
          state.view === "league" ? `<div class="grid">${mine.map(card).join("")}</div>` : timeline(mine));
      } else {
        html += `<div class="block empty">None of your teams play ${isToday() ? "today" : "on " + esc(dayLabel(state.date))}.</div>`;
      }
      const playing = new Set(mine.flatMap(g => g.teams.map(t => favKey(g.lg, t.abbr))));
      const ups = [...state.favs].filter(k => !playing.has(k)).map(k => ({ k, m: state.favMeta[k], n: state.next[k] }))
        .filter(x => x.m).sort((a, b) => favRank(a.k) - favRank(b.k));
      if (ups.length) {
        html += block("upnextteams", "Up Next", "", `<div class="nxt">${ups.map(({ k, m, n }) => `<div class="nxt-row" ${n?.id ? `data-game="${esc(m.lg)}:${esc(n.id)}" role="button" tabindex="0"` : ""}>
            ${m.logo ? `<img src="${esc(m.logo)}" alt="">` : "<span></span>"}
            <span class="nm">${esc(m.name || m.abbr)}<small>${esc(LG[m.lg]?.short || LG[m.lg]?.name || "")}</small></span>
            <span class="when">${n?.date ? `${esc(n.opp)}<small>${esc(whenLabel(n.date))}${n.place ? " · " + esc(n.place) : ""}</small>` : n?.none ? "<small>No games scheduled</small>" : "<small>Checking…</small>"}</span>
          </div>`).join("")}</div>`);
      }
      if (state.updatedAt) html += `<p class="updated">Updated ${state.updatedAt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" })}${isToday() ? " · refreshes automatically" : ""}</p>`;
      main.innerHTML = html;
      return;
    }

    // My Leagues: your leagues first, in your order, then everything else
    if (tab === "mine") {
      const order = state.favLeagues.filter(id => LG[id]).concat(LEAGUES.map(l => l.id).filter(id => !state.favLeagues.includes(id)));
      const off = [];
      html += `<div class="mine-bar"><span>Your leagues first, in your order</span><button class="chip" data-edit-leagues>Edit order</button></div>`;
      let dividerDone = false;
      order.forEach(id => {
        const lg = LG[id], isFav = state.favLeagues.includes(id);
        let section = "";
        if (lg.kind) {
          section = allSpecial().filter(e => e.lg.id === id).map(e => BLOCK[e.kind] ? BLOCK[e.kind](e) : "").join("");
        } else {
          const list = games.filter(g => g.lg.id === id).sort((x, y) => ({ in: 0, pre: 1, post: 2 }[x.state] - { in: 0, pre: 1, post: 2 }[y.state]) || new Date(x.date) - new Date(y.date));
          if (list.length) {
            const liveN = list.filter(g => g.state === "in").length;
            section = block("m-" + id, lg.name, liveN ? `${liveN} Live · ${list.length} Total` : countLabel(list.length),
              state.view === "league" ? `<div class="grid">${list.map(card).join("")}</div>` : timeline(list));
          }
        }
        if (!section) { if (isFav) off.push(lg.short || lg.name); return; }
        if (!isFav && !dividerDone) { html += `<h3 class="mine-div">Other leagues</h3>`; dividerDone = true; }
        html += section;
      });
      if (off.length) html += `<p class="quiet">No games ${isToday() ? "today" : "this day"}: ${esc(off.join(", "))}</p>`;
      if (state.updatedAt) html += `<p class="updated">Updated ${state.updatedAt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" })}${isToday() ? " · refreshes automatically" : ""}</p>`;
      main.innerHTML = html;
      return;
    }

    // Golf: on its own tab it leads; on All and Live it only shows while a round is in progress, below the games
    const golfBelow = ["all", "live"].includes(tab);
    if (!golfBelow) specialsFor(tab).forEach(e => { html += BLOCK[e.kind](e); });

    // The feed
    const quiet = [];
    TEAM_LEAGUES.forEach(lg => { if (!pool.some(g => g.lg.id === lg.id) && !state.data[lg.id]?.error && !state.data[lg.id]?.events?.length) quiet.push(lg.short || lg.name); });
    const feed = pool.filter(g => !shown.has(g.id));
    if (feed.length && state.view === "league" && tab === "live") {
      // Live tab, By League: one "You Are Looking Live" section with a card grid per league inside
      const parts = TEAM_LEAGUES.map(lg => {
        const list = feed.filter(g => g.lg.id === lg.id).sort((x, y) => new Date(x.date) - new Date(y.date));
        if (!list.length) return "";
        return `<div class="tl-group"><div class="tl-head"><span class="tl-badge">${esc(lg.short || lg.name)}</span>
          <span class="crumb">${esc(lg.sport)} <span>› ${esc(lg.name)}</span></span></div>
          <div class="grid">${list.map(card).join("")}</div></div>`;
      }).join("");
      html += block("feed", "You Are Looking Live", countLabel(feed.length), parts);
    } else if (feed.length && state.view === "league") {
      TEAM_LEAGUES.forEach(lg => {
        const list = feed.filter(g => g.lg.id === lg.id).sort((x, y) => ({ in: 0, pre: 1, post: 2 }[x.state] - { in: 0, pre: 1, post: 2 }[y.state]) || new Date(x.date) - new Date(y.date));
        if (!list.length) return;
        const liveN = list.filter(g => g.state === "in").length;
        html += block(lg.id, lg.name, liveN ? `${liveN} Live · ${list.length} Total` : countLabel(list.length), `<div class="grid">${list.map(card).join("")}</div>`);
      });
    } else if (feed.length) {
      const live = feed.filter(g => g.state === "in").length;
      const title = tab === "live" ? "You Are Looking Live" : tab === "close" ? "Close Games" : dayLabel(state.date);
      html += block("feed", title, live && tab !== "live" ? `${live} Live · ${feed.length} Total` : countLabel(feed.length), timeline(feed));
    } else if (tab === "live" && !shown.size) {
      const upcoming = games.filter(g => g.state === "pre").sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 8);
      html += `<div class="block empty">Nothing live right now.${upcoming.length ? " Here's what's up next." : ""}</div>`;
      if (upcoming.length) html += block("upnext", "Up Next", countLabel(upcoming.length), state.view === "league" ? `<div class="grid">${upcoming.map(card).join("")}</div>` : timeline(upcoming));
    } else if (tab === "close") {
      html += `<div class="block empty">No close games right now. Games show up here late with a tight score: under 5:00 in the 4th or 3rd, the 7th inning or later in baseball, or the 85th minute in soccer.</div>`;
    } else if (!specialsFor(tab).length) {
      html += `<div class="block empty">No games on ${esc(dayLabel(state.date))}.</div>`;
    }
    if (golfBelow) specialsFor(tab).forEach(e => { html += BLOCK[e.kind](e); });
    if (tab === "all" && quiet.length) html += `<p class="quiet">Off ${isToday() ? "today" : "this day"}: ${esc(quiet.join(", "))}</p>`;
    if (state.updatedAt) html += `<p class="updated">Updated ${state.updatedAt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" })}${isToday() ? " · refreshes automatically" : ""}</p>`;
    main.innerHTML = html;
  }

  // =====================================================================
  // Team search sheet
  // =====================================================================
  let results = [], searchTimer = null, searchSeq = 0;
  const LG_BY_SLUG = Object.fromEntries(TEAM_LEAGUES.map(l => [l.path, l.id]));
  function openSheet() {
    document.getElementById("sheet").hidden = false;
    setTimeout(() => document.getElementById("q").focus(), 50);
    renderSheet();
    ensureMeta([...state.favs]).then(() => { renderSheet(); loadSuggestions(); });
  }
  // Sheets opened from Settings return to Settings when closed
  let fromSettings = false;
  function backToSettings() { if (fromSettings) { fromSettings = false; openSettings(); } }
  function closeSheet() { const el = document.getElementById("sheet"); if (el.hidden) return; el.hidden = true; backToSettings(); }
  function closeLeagues() { const el = document.getElementById("lsheet"); if (el.hidden) return; el.hidden = true; backToSettings(); }
  function resRow(t, i, list) {
    const k = keyFor(t), on = state.favs.has(k), drag = list === "f";
    return `<div class="res-row ${drag ? "drag" : ""}" ${drag ? `data-k="${esc(k)}"` : ""}>${t.logo ? `<img src="${esc(t.logo)}" alt="">` : "<span></span>"}
      <span class="nm">${esc(t.name)}<small>${esc(LG[t.lg].short || LG[t.lg].name)}</small></span>
      <button class="follow ${on ? "on" : ""}" data-list="${list}" data-i="${i}">${on ? "Following" : "Follow"}</button>${drag ? `<span class="handle" role="button" aria-label="Drag to reorder ${esc(t.name)}" title="Drag to reorder">${HANDLE}</span>` : ""}</div>`;
  }
  // Suggestions: teams near the ones you follow, then popular picks
  const NEARBY = [
    [/New York|Brooklyn|New Jersey|\bNY\b/i, ["New York Yankees", "New York Giants", "New York Jets", "Brooklyn Nets", "New York Liberty", "New York Islanders", "New Jersey Devils", "New York City FC", "New York Red Bulls", "St. John's Red Storm"]],
    [/San Francisco|San Jose|Oakland|Golden State|Bay Area|Stanford|California/i, ["Golden State Warriors", "San Francisco 49ers", "San Francisco Giants", "San Jose Sharks", "Golden State Valkyries", "San Jose Earthquakes", "Stanford Cardinal", "California Golden Bears"]],
    [/Sacramento/i, ["Sacramento Kings", "Golden State Warriors", "San Francisco 49ers", "San Francisco Giants", "Sacramento State Hornets"]],
    [/Los Angeles|LA |Anaheim|UCLA|USC/i, ["Los Angeles Lakers", "Los Angeles Dodgers", "Los Angeles Rams", "LA Clippers", "Los Angeles Kings", "LAFC", "LA Galaxy"]],
    [/Boston|New England/i, ["Boston Celtics", "Boston Red Sox", "New England Patriots", "Boston Bruins"]],
    [/Chicago/i, ["Chicago Bulls", "Chicago Cubs", "Chicago Bears", "Chicago Blackhawks", "Chicago White Sox"]],
    [/Philadelphia/i, ["Philadelphia Eagles", "Philadelphia 76ers", "Philadelphia Phillies", "Philadelphia Flyers"]],
    [/Arsenal|Chelsea|Tottenham|West Ham|Fulham|Crystal Palace|Brentford/i, ["Chelsea", "Tottenham Hotspur", "Arsenal Women", "Crystal Palace"]],
  ];
  const POPULAR = ["Los Angeles Lakers", "New York Yankees", "Kansas City Chiefs", "Los Angeles Dodgers", "Golden State Warriors", "Dallas Cowboys", "Real Madrid", "Manchester City", "Liverpool", "Barcelona", "Duke Blue Devils", "Boston Celtics"];
  let sugg = [], suggKey = "";
  const suggCache = store.get("suggCache", {});
  function suggestNames() {
    const names = [...state.favs].map(k => state.favMeta[k]?.name || "").filter(Boolean);
    const followed = new Set(names.map(n => n.toLowerCase()));
    const out = [];
    NEARBY.forEach(([re, list]) => { if (names.some(n => re.test(n))) list.forEach(n => out.push(n)); });
    POPULAR.forEach(n => out.push(n));
    return [...new Set(out)].filter(n => !followed.has(n.toLowerCase())).slice(0, 8);
  }
  async function loadSuggestions() {
    const names = suggestNames(), key = names.join("|");
    if (key === suggKey) return drawSuggest();
    suggKey = key;
    const found = await Promise.all(names.map(async n => {
      if (suggCache[n]) return suggCache[n];
      try {
        const j = await (await fetch("https://site.api.espn.com/apis/common/v3/search?type=team&limit=8&query=" + encodeURIComponent(n))).json();
        const items = (j.items || []).map(i => ({ i, lgId: LG_BY_SLUG[(i.sport || "") + "/" + (i.league || i.defaultLeagueSlug || "")] })).filter(x => x.lgId && x.i.abbreviation);
        const hit = items.find(x => (x.i.displayName || "").toLowerCase() === n.toLowerCase()) || items[0];
        if (!hit) return null;
        const t = { lg: hit.lgId, id: hit.i.id, abbr: hit.i.abbreviation, name: hit.i.displayName || n, short: hit.i.name || "", logo: hit.i.logos?.[0]?.href || "", color: hexColor(hit.i.color) };
        suggCache[n] = t; store.set("suggCache", suggCache);
        return t;
      } catch { return null; }
    }));
    sugg = found.filter(t => t && !state.favs.has(keyFor(t))).slice(0, 5);
    drawSuggest();
  }
  function drawSuggest() {
    const el = document.getElementById("suggest");
    const show = !document.getElementById("q").value.trim() && sugg.length;
    el.innerHTML = show ? `<h3>Suggested</h3><div class="res">${sugg.map((t, i) => resRow(t, i, "s")).join("")}</div>` : "";
  }
  function drawResults() {
    const el = document.getElementById("results");
    const q = document.getElementById("q").value.trim();
    if (!q) { el.innerHTML = '<p class="hint">Type a team, city or school. Covers the NFL, MLB, NBA, WNBA, NHL, college football and hoops, and the major soccer leagues.</p>'; return; }
    el.innerHTML = results.length ? results.map((t, i) => resRow(t, i, "r")).join("") : '<p class="hint">No teams match that.</p>';
  }
  function search() {
    clearTimeout(searchTimer);
    const q = document.getElementById("q").value.trim();
    drawSuggest();
    if (!q) { results = []; drawResults(); return; }
    searchTimer = setTimeout(async () => {
      const seq = ++searchSeq;
      document.getElementById("results").innerHTML = '<p class="hint">Searching…</p>';
      try {
        const j = await (await fetch("https://site.api.espn.com/apis/common/v3/search?type=team&limit=40&query=" + encodeURIComponent(q))).json();
        if (seq !== searchSeq) return;
        const seen = new Set();
        results = (j.items || []).map(i => {
          const lgId = LG_BY_SLUG[(i.sport || "") + "/" + (i.league || i.defaultLeagueSlug || "")];
          if (!lgId || !i.abbreviation) return null;
          return { lg: lgId, id: i.id, abbr: i.abbreviation, name: i.displayName || i.name || "", short: i.name || "",
            logo: i.logos?.[0]?.href || "", color: hexColor(i.color) };
        }).filter(t => t && !seen.has(t.lg + t.id) && seen.add(t.lg + t.id)).slice(0, 25);
      } catch { results = []; }
      drawResults();
    }, 250);
  }
  let following = [];
  function renderSheet() {
    following = [...state.favs].map(k => {
      const m = state.favMeta[k];
      return m ? { lg: m.lg, id: m.id, abbr: m.abbr || k.split(":")[1], name: m.name, short: "", logo: m.logo, color: m.color }
        : { lg: DEFAULT_META[k] || k.split(":")[0], id: null, abbr: k.split(":")[1], name: k.split(":")[1], short: "", logo: "", color: "" };
    }).filter(t => LG[t.lg]);
    document.getElementById("following").innerHTML = following.length ? following.map((t, i) => resRow(t, i, "f")).join("") : '<p class="hint">Not following anyone yet.</p>';
    drawResults();
    drawSuggest();
  }

  // =====================================================================
  // Events
  // =====================================================================
  function setDate(d) {
    state.date = startOfDay(d);
    state.data = {};
    primed = false;
    document.getElementById("main").innerHTML = '<div class="skel"></div><div class="skel"></div>';
    renderDates();
    loadAll();
  }

  document.getElementById("main").addEventListener("click", e => {
    const row = e.target.closest(".t[data-href]");
    if (row && !e.target.closest("a, button")) { window.open(row.dataset.href, "_blank", "noopener"); return; }
    const fav = e.target.closest("[data-fav]");
    if (fav) {
      let meta = null;
      try { meta = JSON.parse(fav.dataset.meta || "null"); } catch {}
      toggleFav(fav.dataset.fav, meta);
      return;
    }
    if (e.target.closest("[data-open-sheet]")) { openSheet(); return; }
    const tog = e.target.closest("[data-tog]");
    if (tog) {
      const id = tog.dataset.tog;
      state.closed.has(id) ? state.closed.delete(id) : state.closed.add(id);
      render();
    }
  });
  document.getElementById("sheet").addEventListener("click", e => {
    if (e.target.id === "sheet") return closeSheet();
    const b = e.target.closest(".follow");
    if (!b) return;
    const t = (b.dataset.list === "r" ? results : b.dataset.list === "s" ? sugg : following)[+b.dataset.i];
    if (!t) return;
    toggleFav(keyFor(t), { lg: t.lg, id: t.id, name: t.name, logo: t.logo, color: t.color, abbr: t.abbr });
  });
  document.getElementById("sheet-x").onclick = closeSheet;
  let tdrag = null;
  const folEl = document.getElementById("following");
  folEl.addEventListener("pointerdown", e => {
    const hd = e.target.closest(".handle"); if (!hd) return;
    tdrag = { row: hd.closest(".res-row") };
    tdrag.row.classList.add("dragging");
    try { hd.setPointerCapture(e.pointerId); } catch {}
    e.preventDefault();
  });
  folEl.addEventListener("pointermove", e => {
    if (!tdrag) return;
    const rows = [...folEl.querySelectorAll(".res-row")], i = rows.indexOf(tdrag.row), y = e.clientY;
    const prev = rows[i - 1], next = rows[i + 1];
    if (prev) { const b = prev.getBoundingClientRect(); if (y < b.top + b.height / 2) { folEl.insertBefore(tdrag.row, prev); return; } }
    if (next) { const b = next.getBoundingClientRect(); if (y > b.top + b.height / 2) folEl.insertBefore(next, tdrag.row); }
  });
  const endTDrag = () => {
    if (!tdrag) return;
    tdrag.row.classList.remove("dragging"); tdrag = null;
    const order = [...folEl.querySelectorAll(".res-row")].map(r => r.dataset.k).filter(Boolean);
    const rest = [...state.favs].filter(k => !order.includes(k));
    const next = order.concat(rest);
    if (next.join() !== [...state.favs].join()) { state.favs = new Set(next); store.set("favs", next); renderSheet(); render(); }
  };
  folEl.addEventListener("pointerup", endTDrag);
  folEl.addEventListener("pointercancel", endTDrag);
  // ---- Watch buttons: on phones try the app first, fall back to the website
  const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  document.addEventListener("click", e => {
    const a = e.target.closest("a[data-app]");
    if (!a || !IS_MOBILE) return;
    e.preventDefault();
    const web = a.href, appUrl = a.dataset.app;
    let left = false;
    const gone = () => { left = true; };
    document.addEventListener("visibilitychange", () => { if (document.hidden) gone(); }, { once: true });
    window.addEventListener("pagehide", gone, { once: true });
    window.addEventListener("blur", gone, { once: true });
    setTimeout(() => { if (!left && !document.hidden) window.location.href = web; }, 1400);
    window.location.href = appUrl;
  });
  // ---- League order editor (drag the handle to reorder)
  const HANDLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>';
  function renderLeagueSheet() {
    const favs = state.favLeagues.filter(id => LG[id]);
    document.getElementById("lfav").innerHTML = favs.length ? favs.map((id, i) => `<div class="lrow drag" data-lg="${id}">
        <span class="lnum">${i + 1}</span><span class="nm">${esc(LG[id].name)}</span>
        <button class="follow on" data-ltoggle="${id}">Remove</button>
        <span class="handle" role="button" aria-label="Drag to reorder ${esc(LG[id].name)}" title="Drag to reorder">${HANDLE}</span></div>`).join("") : '<p class="hint">No leagues picked yet.</p>';
    document.getElementById("lrest").innerHTML = LEAGUES.filter(l => !favs.includes(l.id)).map(l => `<div class="lrow drag">
        <span class="lnum"></span><span class="nm">${esc(l.name)}</span>
        <button class="follow" data-ltoggle="${l.id}">Add</button><span></span></div>`).join("");
  }
  function saveLeagues() { store.set("favLeagues", state.favLeagues); renderLeagueSheet(); render(); }
  let ldrag = null;
  const lfav = document.getElementById("lfav");
  lfav.addEventListener("pointerdown", e => {
    const hd = e.target.closest(".handle"); if (!hd) return;
    const row = hd.closest(".lrow");
    ldrag = { row };
    row.classList.add("dragging");
    try { hd.setPointerCapture(e.pointerId); } catch {}
    e.preventDefault();
  });
  lfav.addEventListener("pointermove", e => {
    if (!ldrag) return;
    const rows = [...lfav.querySelectorAll(".lrow")], i = rows.indexOf(ldrag.row), y = e.clientY;
    const prev = rows[i - 1], next = rows[i + 1];
    if (prev) { const b = prev.getBoundingClientRect(); if (y < b.top + b.height / 2) { lfav.insertBefore(ldrag.row, prev); return; } }

  function applyTheme() {
    const pal = store.get("palette", "red");
    if (pal === "green" || pal === "navy") document.documentElement.dataset.palette = pal; else delete document.documentElement.dataset.palette;
    const t = store.get("theme", "system");
    if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  }
  applyTheme();
  async function askPermission() {
    try { if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); } catch {}
  }
  async function setAlerts(on) {
    state.alerts = on;
    store.set("alerts", on);
    if (on) {
      try { if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); } catch {}
      toast("Alerts on", "You'll get a heads-up when a game turns close, goes to overtime, or an upset starts brewing.", "Works while Scores is open");
    }
  }
  function segRow(label, key, value, options, hint) {
    return `<div class="set-row"><div class="set-lbl">${esc(label)}${hint ? `<small>${esc(hint)}</small>` : ""}</div>
      <div class="seg set-seg">${options.map(([v, l]) => `<button data-set="${key}" data-val="${v}" class="${String(value) === String(v) ? "on" : ""}">${esc(l)}</button>`).join("")}</div></div>`;
  }
  function alertGroup(group, label, hint) {
    const prefs = state.alertPrefs[group];
    return `<div class="set-row set-col"><div class="set-lbl">${esc(label)}<small>${esc(hint)}</small></div>
      <div class="toggles">${ALERT_EVENTS[group].map(([ev, name]) => `<button class="chip ${prefs[ev] ? "on" : ""}" data-alert-group="${group}" data-alert-ev="${ev}" aria-pressed="${!!prefs[ev]}">${esc(name)}</button>`).join("")}</div></div>`;
  }
  let setOpen = store.get("setOpen", { display: false, alerts: false });
  function setSection(id, title, sub, body) {
    const open = !!setOpen[id];
    return `<div class="set-sec ${open ? "open" : ""}"><button class="set-sec-h" data-set-sec="${id}" aria-expanded="${open}"><span>${esc(title)}<small>${esc(sub)}</small></span>${CHEV}</button>${open ? `<div class="set-sec-b">${body}</div>` : ""}</div>`;
  }
  function renderSettings() {
    const teams = state.favs.size, leagues = state.favLeagues.length;
    const on = Object.values(state.alertPrefs).reduce((n, g) => n + Object.values(g).filter(Boolean).length, 0);
    document.getElementById("settings-body").innerHTML =
      `<div class="set-row"><div class="set-lbl">My Teams<small>Following ${teams} team${teams === 1 ? "" : "s"}</small></div><button class="chip" data-set-open="teams">Edit</button></div>` +
      `<div class="set-row"><div class="set-lbl">My Leagues<small>${leagues} league${leagues === 1 ? "" : "s"} in your order</small></div><button class="chip" data-set-open="leagues">Edit order</button></div>` +
      setSection("display", "Layout & Display", "Open to, layout, color, appearance, odds",
        segRow("Open to", "home", store.get("home", "live"), [["live", "Live"], ["all", "All"], ["teams", "My Teams"], ["mine", "My Leagues"], ["upcoming", "Upcoming"]], "The tab you see when the app opens") +
        segRow("Layout", "view", state.view, [["time", "By Time"], ["league", "By League"]]) +
        segRow("Color", "palette", store.get("palette", "red"), [["red", "Red"], ["navy", "Navy"], ["green", "Green"]]) +
        segRow("Appearance", "theme", store.get("theme", "system"), [["system", "Auto"], ["light", "Light"], ["dark", "Dark"]]) +
        segRow("Betting odds", "odds", state.showOdds ? "on" : "off", [["on", "Show"], ["off", "Hide"]], "Lines on game cards and in Gamecast")) +
      setSection("alerts", "Alerts", `${on} alert${on === 1 ? "" : "s"} on`,
        alertGroup("team", "My teams", "Games with teams you follow") +
        alertGroup("watched", "Games you're watching", "Tap the bell on any game to add it") +
        alertGroup("all", "All games", "Anything that turns interesting, any team") +
        `<div class="set-row"><div class="set-lbl">Test alerts<small>${esc(notifyStatus())}. Alerts work while Scores is open.</small></div><button class="chip" data-test-alert>Send test</button></div>`) +
      `<button class="set-done" data-set-done>Done</button>` +
      `<p class="hint set-foot">${location.pathname.includes("/beta") ? `You're on the beta. <a href="../">Open the live app</a>` : `Want to try new features early? <a href="beta/">Open the beta</a>`}</p>`;
  }
  function openSettings() { renderSettings(); document.getElementById("ssheet").hidden = false; }
  document.getElementById("settingsbtn").onclick = openSettings;
  document.getElementById("ssheet-x").onclick = () => { document.getElementById("ssheet").hidden = true; };
  document.getElementById("ssheet").addEventListener("click", async e => {
    if (e.target.id === "ssheet") { document.getElementById("ssheet").hidden = true; return; }
    const b = e.target.closest("[data-set]");
    if (b) {
      const key = b.dataset.set, val = b.dataset.val;
      if (key === "home") { store.set("home", val); state.tab = val; }
      if (key === "view") { state.view = val; store.set("view3", val); }
      if (key === "theme") { store.set("theme", val); applyTheme(); }
      if (key === "palette") { store.set("palette", val); applyTheme(); }
      if (key === "odds") { state.showOdds = val === "on"; store.set("showOdds", state.showOdds); }

      renderSettings(); render();
      return;
    }
    const ab = e.target.closest("[data-alert-group]");
    if (ab) {
      const grp = ab.dataset.alertGroup, ev = ab.dataset.alertEv;
      state.alertPrefs[grp][ev] = !state.alertPrefs[grp][ev];
      store.set("alertPrefs", state.alertPrefs);
      if (state.alertPrefs[grp][ev]) askPermission();
      renderSettings();
      return;
    }
    if (e.target.closest("[data-test-alert]")) {
      toast("Test alert", "In-app alerts are working.", "", "", false);
      await askPermission();
      if ("Notification" in window && Notification.permission === "granted") notify("Test alert", "Phone notifications are working too.", "", "", false, "test");
      renderSettings();
      return;
    }
    const sec = e.target.closest("[data-set-sec]");
    if (sec) { const k = sec.dataset.setSec; setOpen[k] = !setOpen[k]; store.set("setOpen", setOpen); renderSettings(); return; }
    if (e.target.closest("[data-set-done]")) { document.getElementById("ssheet").hidden = true; return; }
    const o = e.target.closest("[data-set-open]");
    if (o) {
      document.getElementById("ssheet").hidden = true;
      fromSettings = true;
      if (o.dataset.setOpen === "teams") openSheet();
      else { renderLeagueSheet(); document.getElementById("lsheet").hidden = false; }
    }
  });
  // Page scroll lock (iOS ignores overflow:hidden alone, so pin the body in place)
  const LOCKERS = ["sheet", "ssheet", "lsheet", "gsheet"].map(id => document.getElementById(id));
  let lockY = 0, isLocked = false;
  function syncLock() {
    const want = LOCKERS.some(el => !el.hidden);
    if (want === isLocked) return;
    isLocked = want;
    const b = document.body, h = document.documentElement;
    if (want) {
      lockY = window.scrollY;
      b.style.top = -lockY + "px";
      b.classList.add("locked"); h.classList.add("locked");
    } else {
      b.classList.remove("locked"); h.classList.remove("locked");
      b.style.top = "";
      window.scrollTo(0, lockY);
    }
  }
  const lockObs = new MutationObserver(syncLock);
  LOCKERS.forEach(el => lockObs.observe(el, { attributes: true, attributeFilter: ["hidden"] }));
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && isToday() && state.updatedAt && Date.now() - state.updatedAt > 25000) loadAll();
  });
  // GitHub Pages lets browsers keep the page for ~10 minutes. Check for a newer build and jump to it.
  async function checkForUpdate() {
    if (!location.protocol.startsWith("http")) return;
    try {
      const mine = document.querySelector('meta[name="build"]')?.content;
      const html = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
      const latest = (html.match(/<meta name="build" content="(\d+)">/) || [])[1];
      if (mine && latest && latest !== mine) location.replace(location.pathname + "?v=" + latest + location.hash);
    } catch {}
  }
  checkForUpdate();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  renderDates();
  loadAll();
})();
</script>
</body>
</html>
