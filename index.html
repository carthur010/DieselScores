<style>
/* Layout: date strip on top, Apple-style "My Teams" scoreboard rows, then CBS-style collapsible two-column league grids */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --line: #dfe5e2;
  --fg: #111816;
  --muted: #66736e;
  --dim: #a3aeaa;
  --accent: #0b7a52;
  --accent-soft: #e2f2ea;
  --live: #d6263b;
  --star: #e0a400;
  /* Apple devices use their built-in SF Pro (Apple's license doesn't allow hosting the files);
     everything else falls back to Barlow from Google Fonts. */
  --display: -apple-system, BlinkMacSystemFont, "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b110f; --surface: #121a17; --line: #22302b; --fg: #eef3f1;
    --muted: #8d9b96; --dim: #4c5a55; --accent: #3fcf8e; --accent-soft: #15302a;
    --live: #ff5468; --star: #ffc933; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b110f; --surface: #121a17; --line: #22302b; --fg: #eef3f1;
  --muted: #8d9b96; --dim: #4c5a55; --accent: #3fcf8e; --accent-soft: #15302a;
  --live: #ff5468; --star: #ffc933; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; }

/* Header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-block: 14px 6px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: .01em; line-height: 1; }
.brand span { color: var(--accent); }
.livecount {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--live);
  border: 1px solid color-mix(in srgb, var(--live) 40%, transparent); border-radius: 99px; padding: 3px 9px;
}
.livecount[hidden] { display: none !important; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); position: relative; }
.iconbtn:hover { background: var(--surface); color: var(--fg); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn input[type=date] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.dates { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.dates::-webkit-scrollbar { display: none; }
.dates button {
  flex: 0 0 auto; padding: 10px 12px 12px; font-weight: 600; color: var(--muted); white-space: nowrap;
  border-bottom: 3px solid transparent;
}
.dates button.on { color: var(--fg); border-color: var(--accent); }
.dates button:hover { color: var(--fg); }

.leagues { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 10px; margin-inline: -16px; padding-inline: 16px; }
.leagues::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { opacity: .6; margin-left: 4px; font-weight: 500; }
.chip.hot:not(.on) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.hot .n { opacity: 1; font-weight: 700; }

main { padding-block: 16px 48px; display: grid; gap: 18px; }
.updated { font-size: 12px; color: var(--muted); text-align: right; }

/* Sections */
section.block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.bhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet-card > .bhead { flex: 0 0 auto; }
.sheet-card .bhead .tog { width: 40px; height: 40px; }
.set-sec { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.set-sec-h { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; text-align: left; font-weight: 700; font-size: 16px; }
.set-sec-h span { display: grid; gap: 2px; }
.set-sec-h small { font-weight: 500; font-size: 12px; color: var(--muted); }
.set-sec-h svg { width: 18px; height: 18px; color: var(--muted); transform: rotate(180deg); transition: transform .15s; flex: 0 0 auto; }
.set-sec.open .set-sec-h svg { transform: none; }
.set-sec-b { padding: 0 14px 10px; display: grid; gap: 12px; }
.set-sec-b .set-row:last-child { border-bottom: 0; }
.set-done { width: 100%; height: 46px; border-radius: 12px; background: var(--accent); color: var(--bg); font-weight: 700; font-size: 16px; margin-top: 6px; }
.bhead h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: .01em; }
.bhead .meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bhead h2 { white-space: nowrap; }
.bhead .tog { margin-left: auto; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: var(--bg); color: var(--muted); }
.bhead .tog svg { width: 16px; height: 16px; transition: transform .2s; }
section.closed .tog svg { transform: rotate(180deg); }
section.closed .bbody { display: none; }
section.closed .bhead { border-bottom: 0; }
.star-ico { color: var(--star); width: 20px; height: 20px; }

/* Apple-style featured rows */
.feat { padding: 4px 16px; }
.f { padding-block: 16px; border-bottom: 1px solid var(--line); }
.f:last-child { border-bottom: 0; }
.f-lg { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; min-height: 15px; }
.f-grid { display: grid; grid-template-columns: minmax(70px, 1fr) minmax(52px, auto) minmax(96px, 1.2fr) minmax(52px, auto) minmax(70px, 1fr); align-items: center; gap: 6px; }
.f-team { display: grid; justify-items: center; gap: 4px; position: relative; text-align: center; min-width: 0; }
.f-team img { width: 52px; height: 52px; object-fit: contain; }
.f-team .nm { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.f-team.fav .nm { color: var(--fg); }
.f-sc { font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 1; text-align: center; }
.f-sc.lose { color: var(--dim); }
.f-sc.rec { font-family: var(--body); font-size: 14px; font-weight: 500; color: var(--muted); }
.f-mid { text-align: center; display: grid; gap: 4px; }
.f-mid .s { font-size: 17px; font-weight: 700; }
.f-mid .s.live { color: var(--live); }
.f-mid .sub { font-size: 12px; color: var(--muted); }
.f-act { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.f-link { font-size: 12px; color: var(--accent); font-weight: 600; }
.f-link:hover { text-decoration: underline; }

/* Star buttons */
.star { width: 24px; height: 24px; display: grid; place-items: center; color: var(--dim); flex: 0 0 auto; border-radius: 6px; }
.star svg { width: 15px; height: 15px; }
.star.on { color: var(--star); }
.star:hover { color: var(--star); }
.f-team .star { position: absolute; top: -4px; left: 0; }
.f-team.home .star { left: auto; right: 0; }

/* CBS-style compact grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.g { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
.g-top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.g-top .st { color: var(--muted); }
.lgtag { font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.g-top .st.live { color: var(--live); }
.g-top .st.final { color: var(--fg); }
.g-top .net { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
.close {
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px;
}
.row { display: grid; grid-template-columns: 24px 30px 1fr auto; align-items: center; gap: 8px; min-height: 34px; }
.row img { width: 28px; height: 28px; object-fit: contain; }
.row .who { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.row .ab { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .01em; }
.row .rk { font-size: 12px; color: var(--muted); }
.row .rc { font-size: 13px; color: var(--muted); white-space: nowrap; }
.row .poss { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); align-self: center; }
.row .sc { font-family: var(--display); font-weight: 700; font-size: 24px; min-width: 2ch; text-align: right; }
.row.lose .ab, .row.lose .sc { color: var(--muted); }
.row .odds { font-size: 13px; color: var(--muted); }
.g-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-height: 18px; }
.g-foot .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-foot a { color: var(--accent); font-weight: 600; white-space: nowrap; }
.g-foot a:hover { text-decoration: underline; }
.diamond { width: 26px; height: 22px; flex: 0 0 auto; }
.diamond rect { fill: none; stroke: var(--dim); stroke-width: 1.5; }
.diamond rect.on { fill: var(--accent); stroke: var(--accent); }
.outs { display: inline-flex; gap: 3px; }
.outs i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--dim); }
.outs i.on { background: var(--fg); border-color: var(--fg); }

/* Your teams strip */
.mystrip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.mystrip::-webkit-scrollbar { display: none; }
.ms { flex: 0 0 auto; display: grid; grid-template-columns: auto auto; column-gap: 10px; row-gap: 2px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.ms.live { border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
.ms-t { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.ms-t img { width: 18px; height: 18px; object-fit: contain; }
.ms-t b { font-family: var(--display); font-size: 17px; font-weight: 700; }
.ms-t em { font-style: normal; font-family: var(--display); font-size: 17px; font-weight: 700; margin-left: auto; padding-left: 6px; }
.ms-t.lose b, .ms-t.lose em { color: var(--muted); }
.ms-s { grid-column: 2; grid-row: 1 / span 2; font-size: 12px; font-weight: 600; color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line); align-self: stretch; display: grid; align-items: center; white-space: nowrap; }
.ms.live .ms-s { color: var(--live); }
.ms .ms-t:nth-child(2) { grid-row: 2; }
.ms .ms-t:nth-child(1) { grid-row: 1; }
.f-why { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.why { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 5px; }
.why.hot { color: var(--live); background: color-mix(in srgb, var(--live) 12%, transparent); }

/* Where to watch */
.wslot { margin-left: auto; min-width: 0; display: flex; justify-content: flex-end; }
.tap { cursor: pointer; }
.g.tap:hover, .f.tap:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.g-foot .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.watch {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; min-width: 0;
  font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap; text-transform: none; letter-spacing: 0;
}
.watch b { font-weight: 700; }
.watch span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.watch i { font-style: normal; font-weight: 700; opacity: .7; }
.watch:hover { background: var(--accent); color: var(--bg); }
.watch:hover span { color: inherit; }
.g-top .net { margin-left: 0; max-width: 100%; }
.t-watch { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-left: 32px; min-width: 0; }
.f-mid .watch { justify-self: center; }

/* View toggle */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 7px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--bg); }

/* Sofascore-style timeline */
.tl-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px; }
.tl-badge { min-width: 38px; height: 38px; padding-inline: 6px; white-space: nowrap; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .02em; flex: 0 0 auto; max-width: 92px; overflow: hidden; }
.tl-head .crumb { font-weight: 700; font-size: 15px; }
.tl-head .crumb span { color: var(--muted); font-weight: 500; }
.tl-group { border-bottom: 6px solid var(--bg); }
.tl-group:last-child { border-bottom: 0; }
.t { display: grid; grid-template-columns: 76px 1fr auto 28px; align-items: center; gap: 10px; padding: 10px 16px; }
.t + .t { border-top: 1px solid var(--line); }
.t-time { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.t-time .st { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-time .st.live { color: var(--live); }
.t-time .st.final { color: var(--fg); }
.t-teams { display: grid; gap: 6px; min-width: 0; }
.tt { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 16px; font-weight: 500; }
.tt img { width: 22px; height: 22px; object-fit: contain; flex: 0 0 auto; }
.tt .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt.lose { color: var(--muted); }
.tt .mini { width: 18px; height: 18px; }
.tt .mini svg { width: 13px; height: 13px; }
.tt .mini:not(.on) { opacity: .45; }
.t-sc { display: grid; gap: 6px; text-align: right; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 22px; }
.t-sc.live { color: var(--live); }
.t-sc .lose { color: var(--muted); }
.t-go { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); }
.t-go:hover { color: var(--accent); border-color: var(--accent); }
.t-go svg { width: 14px; height: 14px; }
.t.fav { background: color-mix(in srgb, var(--star) 4%, transparent); }

.empty, .err { padding: 22px 16px; color: var(--muted); text-align: center; }
.err { color: var(--live); }
.quiet { font-size: 13px; color: var(--muted); text-align: center; }
.skel { height: 96px; border-radius: 14px; background: linear-gradient(90deg, var(--surface), var(--line), var(--surface)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }

@media (max-width: 480px) {
  .f-team img { width: 42px; height: 42px; }
  .f-sc { font-size: 42px; }
  .f-grid { grid-template-columns: minmax(60px, 1fr) auto minmax(80px, 1.1fr) auto minmax(60px, 1fr); }
  .grid { grid-template-columns: 1fr; }
  .seg { order: 5; width: 100%; }
  .seg button { flex: 1; }
  .t { grid-template-columns: 64px 1fr auto 28px; gap: 8px; }
  .tt { font-size: 15px; }
  .g { border-right: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

[hidden] { display: none !important; }
:root { --surface-2: #f7f9f8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface-2: #17211d; } }
:root[data-theme="dark"] { --surface-2: #17211d; }
.iconbtn[aria-pressed="true"] { color: var(--accent); }
.bar .iconbtn { flex: 0 0 auto; }
.chip.livechip.hot:not(.on) { border-color: color-mix(in srgb, var(--live) 50%, var(--line)); color: var(--live); background: color-mix(in srgb, var(--live) 8%, var(--surface)); }
.ms.next { grid-template-columns: auto auto; }
.ms.next .ms-t.nx b { font-size: 14px; color: var(--muted); }
.ms.next .ms-s { display: grid; gap: 1px; align-content: center; font-size: 12px; color: var(--fg); }
.ms.next .ms-s em { font-style: normal; font-weight: 500; font-size: 11px; color: var(--muted); }
.ms.next .ms-s small { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.ms.mc { display: grid; grid-template-columns: none; gap: 5px; min-width: 190px; padding: 10px 12px; text-align: left; align-content: start; }
.mc-top { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.mc-top .st { color: var(--muted); }
.mc-top .st.live { color: var(--live); }
.mc-top .st.final { color: var(--fg); }
.mc-top small { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold, var(--accent)); }
.mc-row { display: flex; align-items: center; gap: 7px; }
.mc-row img, .mc-row > i { width: 20px; height: 20px; object-fit: contain; flex: 0 0 auto; }
.mc-row b { font-family: var(--display); font-stretch: condensed; font-size: 18px; font-weight: 700; }
.mc-row small { font-size: 12px; color: var(--muted); }
.mc-row em { font-style: normal; font-family: var(--display); font-stretch: condensed; font-size: 19px; font-weight: 700; margin-left: auto; padding-left: 12px; }
.mc-row.lose b, .mc-row.lose em { color: var(--muted); }
.mc-fav { color: var(--star); font-size: 11px; }
.mc-foot { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.ms.mc.live .mc-foot { color: var(--fg); }
.ms.add { display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-weight: 600; font-size: 13px; border-style: dashed; }
.ms.add:hover { color: var(--fg); }
.lb-wrap { overflow-x: auto; }
.lb { width: 100%; border-collapse: collapse; font-size: 14px; }
.lb th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lb td { padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lb td:nth-child(2) { white-space: normal; }

<script>
(() => {
  // =====================================================================
  // Config

  // reg = periods in regulation, label = period prefix for live clocks
  const LEAGUES = [
    { id: "nfl",    name: "NFL", sport: "Football", path: "football/nfl", reg: 4, label: "Q" },

    { id: "eflc",   name: "Carabao Cup", sport: "Soccer", path: "soccer/eng.league_cup", soccer: true, topFlight: "eng.1" },

    { id: "bund",   name: "Bundesliga", sport: "Soccer", path: "soccer/ger.1", soccer: true },
    { id: "ligue1", name: "Ligue 1", sport: "Soccer", path: "soccer/fra.1", soccer: true },
    { id: "ucl",    name: "Champions League", short: "UCL", sport: "Soccer", path: "soccer/uefa.champions", soccer: true },
    { id: "uel",    name: "Europa League", short: "UEL", sport: "Soccer", path: "soccer/uefa.europa", soccer: true },

    { id: "mls",    name: "MLS", sport: "Soccer", path: "soccer/usa.1", soccer: true },
    { id: "nwsl",   name: "NWSL", sport: "Soccer", path: "soccer/usa.nwsl", soccer: true },
    // Leaderboards and events
    { id: "pga",    name: "PGA Tour", short: "PGA", sport: "Golf", path: "golf/pga", kind: "golf" },
    { id: "lpga",   name: "LPGA", sport: "Golf", path: "golf/lpga", kind: "golf" },
  ];
  const LG = Object.fromEntries(LEAGUES.map(l => [l.id, l]));
  const TEAM_LEAGUES = LEAGUES.filter(l => !l.kind);
  const EVENT_LEAGUES = LEAGUES.filter(l => l.kind);
  const SEARCHABLE = ["nfl", "mlb", "nba", "wnba", "nhl", "epl", "wsl", "laliga", "seriea", "bund", "ligue1", "mls", "nwsl", "ncaaf", "ncaam", "ncaaw"];
  const SOCCER_HOME = ["epl", "wsl", "laliga", "seriea", "bund", "ligue1", "mls", "nwsl"];
  const P4_GROUPS = [1, 4, 5, 8];
  // Leagues that get their own tab. Everything else lives under All.
  const MAIN_TABS = ["nfl", "ncaaf", "mlb", "nba", "nhl", "epl", "pga"]; // ESPN conference ids: ACC, Big 12, Big Ten, SEC

  // "Close game" rules by sport. lastPeriod comes from the league's regulation length.
  const CLOSE = {
    Basketball: { minsLeft: 5, margin: 6 },
    Football:   { minsLeft: 5, margin: 8 },
    Hockey:     { minsLeft: 5, margin: 1 },
    Baseball:   { fromInning: 7, margin: 2 },
    Soccer:     { fromMinute: 85, margin: 1 },
  };

  // Where to watch. Your setup: YouTube TV + every streaming app. First match wins.
  const WATCH = [
    { re: /^(MSG|MSG ?2|MSGSN|MSG Sportsnet|MSG\+|YES|YES Network)$/i, app: "Gotham Sports", url: "https://gothamsports.com/" },
    { re: /^(ABC|CBS|NBC|FOX|CW|The CW|ESPN|ESPN2|ESPNU|ESPNEWS|SECN|SEC Network|SECN\+?|ACCN|ACC Network|BTN|Big Ten Network|FS1|FS2|TNT|TBS|truTV|NFL ?Net(work)?|NFLN|MLB ?Net(work)?|MLBN|NBA ?TV|NHL ?Net(work)?|CBSSN|CBS Sports Network|USA|USA Net(work)?|Golf|Golf Channel|Telemundo|Universo|Univision|UniMás|TUDN|Galavisión|ION|SNY|SportsNet NY)$/i, app: "YouTube TV", url: "https://tv.youtube.com/", scheme: "youtubetv://" },
    { re: /ESPN\+|ESPN Unlimited|ESPN App|ESPN Deportes\+/i, app: "ESPN app", url: "https://www.espn.com/watch/", scheme: "sportscenter://" },
    { re: /Peacock/i, app: "Peacock", url: "https://www.peacocktv.com/sports", scheme: "peacock://" },
    { re: /Paramount\+|Paramount Plus|CBS Sports Golazo/i, app: "Paramount+", url: "https://www.paramountplus.com/live-tv/", scheme: "paramountplus://" },
    { re: /Prime Video|Amazon|Prime/i, app: "Prime Video", url: "https://www.primevideo.com/", scheme: "aiv://" },
    { re: /Apple TV|MLS Season Pass|MLS Pass/i, app: "Apple TV", url: "https://tv.apple.com/", scheme: "videos://" },
    { re: /Netflix/i, app: "Netflix", url: "https://www.netflix.com/", scheme: "nflx://" },
    { re: /^(Max|HBO Max|truTV Max)$/i, app: "HBO Max", url: "https://play.hbomax.com/", scheme: "hbomax://" },
    { re: /Fox One|FOX One|Fox Nation/i, app: "Fox One", url: "https://www.foxone.com/" },
    { re: /DAZN/i, app: "DAZN", url: "https://www.dazn.com/" },
    { re: /NBA League Pass/i, app: "NBA League Pass", url: "https://www.nba.com/watch/league-pass-stream" },
    { re: /MLB\.?TV/i, app: "MLB.TV", url: "https://www.mlb.com/tv", scheme: "mlbatbat://" },
    { re: /Victory\+/i, app: "Victory+", url: "https://www.victoryplus.com/" },
    { re: /YouTube/i, app: "YouTube", url: "https://www.youtube.com/", scheme: "youtube://" },
  ];
  // Out-of-market regional games (you're in NYC) go to the league package
  const OUT_OF_MARKET = {
    nba: { app: "NBA League Pass", url: "https://www.nba.com/watch/league-pass-stream" },
    mlb: { app: "MLB.TV", url: "https://www.mlb.com/tv", scheme: "mlbatbat://" },
    nhl: { app: "ESPN app", url: "https://www.espn.com/watch/", scheme: "sportscenter://" },
  };
  // Soccer favorites are keyed "soccer:ABBR" so a club follows you across competitions
  const DEFAULT_FAVS = ["nba:NY", "nba:SAC", "nhl:NYR", "nhl:SJ", "mlb:NYM", "nfl:NYG", "soccer:ARS"];
  const DEFAULT_FAV_LEAGUES = ["nba", "nhl", "nfl", "ncaaf", "mlb", "epl", "ucl", "pga"];
  const DEFAULT_META = { "nba:NY": "nba", "nba:SAC": "nba", "nhl:NYR": "nhl", "nhl:SJ": "nhl", "mlb:NYM": "mlb", "nfl:NYG": "nfl", "soccer:ARS": "epl" };
  const API = "https://site.api.espn.com/apis/site/v2/sports/";

  // =====================================================================
  // Storage (best effort) and state
  // =====================================================================
  const store = {
    get(k, d) { try { const v = localStorage.getItem("scoreline:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("scoreline:" + k, JSON.stringify(v)); } catch {} }
  };

  const state = {
    date: startOfDay(new Date()),
    tab: store.get("home", "live"),
    view: store.get("view3", "league"),
    favs: new Set(store.get("favs", DEFAULT_FAVS)),
    favMeta: store.get("favMeta", {}),   // key -> { lg, id, name, logo, color }
    next: store.get("next", {}),         // key -> { t, date, opp, oppLogo, at, none }
    closed: new Set(),
    alerts: store.get("alerts", false),
    alertPrefs: (() => {
      const d = {
        team:    { start: true, half: true, close: true, ot: true, lead: false, final: true },
        watched: { start: true, half: true, close: true, ot: true, lead: true, final: true },
        all:     { close: !!store.get("alerts", false), ot: !!store.get("alerts", false), upset: !!store.get("alerts", false), playoff: false },
      };
      const saved = store.get("alertPrefs", null);
      return saved ? { team: { ...d.team, ...saved.team }, watched: { ...d.watched, ...saved.watched }, all: { ...d.all, ...saved.all } } : d;
    })(),
    watched: (() => { const w = store.get("watched", {}); const now = Date.now(); Object.keys(w).forEach(k => { if (now - w[k] > 2 * 864e5) delete w[k]; }); return w; })(),
    favLeagues: store.get("favLeagues", DEFAULT_FAV_LEAGUES),
    showOdds: store.get("showOdds", true),
    upcoming: { key: "", at: 0, days: [], loading: false },
    data: {},
    loading: false,
    updatedAt: null,
    timer: null,
  };

  // =====================================================================
  // Helpers
  // =====================================================================
  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ymd(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
  function isoDate(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function sameDay(a, b) { return ymd(a) === ymd(b); }
  function isToday() { return sameDay(state.date, new Date()); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function dayLabel(d) {
    if (sameDay(d, new Date())) return "Today";
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function timeLabel(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
  function whenLabel(iso) {
    const d = new Date(iso), days = (startOfDay(d) - startOfDay(new Date())) / 864e5;
    const day = days === 0 ? "Today" : days === 1 ? "Tomorrow" : days < 7 ? d.toLocaleDateString(undefined, { weekday: "short" }) : d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    return day + " " + timeLabel(iso);
  }
  function favKey(lg, abbr) { return (lg.soccer ? "soccer" : lg.id) + ":" + abbr; }
  function isFavTeam(lg, abbr) { return state.favs.has(favKey(lg, abbr)); }
  // Your team order (set by dragging in Your Teams). Lower = higher up.
  function favRank(k) { const i = [...state.favs].indexOf(k); return i < 0 ? 999 : i; }
  function gameRank(g) { return Math.min(...g.teams.map(t => favRank(favKey(g.lg, t.abbr)))); }
  function hexColor(c) { return c && /^[0-9a-f]{6}$/i.test(c) ? "#" + c : ""; }
  function clockSecs(c) { const [m, s] = String(c || "").split(":").map(Number); return isNaN(m) ? Infinity : m * 60 + (s || 0); }

  const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  const STAR_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>';
  const PLAY_BIG = '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" width="10" height="10"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const BOLT = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>';

  // =====================================================================
  // Normalize team-sport games
  // =====================================================================
  function normalize(ev, lg) {
    const comp = ev.competitions?.[0] || {};
    const st = ev.status || comp.status || {};
    const type = st.type || {};
    const teams = (comp.competitors || []).map(c => ({
      id: c.team?.id,
      abbr: c.team?.abbreviation || c.team?.shortDisplayName || "?",
      name: c.team?.shortDisplayName || c.team?.name || c.team?.displayName || "",
      full: c.team?.displayName || "",
      logo: c.team?.logo || c.team?.logos?.[0]?.href || "",
      color: hexColor(c.team?.color),
      score: c.score ?? "",
      winner: !!c.winner,
      homeAway: c.homeAway,
      record: c.records?.find(r => r.type === "total" || r.name === "overall")?.summary || c.records?.[0]?.summary || "",
      rank: c.curatedRank?.current && c.curatedRank.current <= 25 ? c.curatedRank.current : null,
    }));
    teams.sort((a, b) => (a.homeAway === "away" ? -1 : 1) - (b.homeAway === "away" ? -1 : 1));
    const gstate = type.state || "pre";
    const nets = [];
    (comp.geoBroadcasts || []).forEach(b => {
      const name = b.media?.shortName || b.media?.name;
      if (name) nets.push({ name, market: (b.market?.type || "national").toLowerCase() });
    });
    (comp.broadcasts || []).forEach(b => (b.names || []).forEach(name => {
      if (name && !nets.some(n => n.name === name)) nets.push({ name, market: (b.market || "national").toLowerCase() });
    }));
    const broadcast = nets.map(n => n.name).filter((v, i, a) => a.indexOf(v) === i).slice(0, 2).join(" / ");
    const odds = comp.odds?.[0];
    let status;
    if (gstate === "pre") {
      status = type.name === "STATUS_POSTPONED" ? "Postponed" : (type.completed ? type.shortDetail : timeLabel(ev.date));
    } else {
      status = type.shortDetail || type.detail || "";
      const p = st.period || 0, clk = st.displayClock;
      if (gstate === "in" && lg.label && clk && p && !/half|end|delay|susp|int/i.test(status)) {
        status = (p > lg.reg ? "OT" + (p - lg.reg > 1 ? p - lg.reg : "") : lg.label + p) + " " + clk;
      }
    }
    const g = {
      id: ev.id, lg, date: ev.date, state: gstate, status, teams, broadcast,
      link: ev.links?.find(l => (l.rel || []).includes("summary"))?.href || ev.links?.[0]?.href || "",
      watch: watchOptions(nets, lg),
      rankedClash: teams.length === 2 && teams.every(t => t.rank),
      note: comp.notes?.[0]?.headline || "",
      odds: odds ? { details: odds.details || "", ou: odds.overUnder } : null,
      sit: comp.situation || {}, period: st.period || 0, clock: st.displayClock || "",
      series: comp.series?.summary || "",
    };
    // Playoff game: postseason per ESPN, a series attached, or a playoff round in the game note
    g.playoff = ev.season?.type === 3 || !!comp.series ||
      /playoff|postseason|wild card|division series|championship series|world series|\bALCS\b|\bNLCS\b|\bALDS\b|\bNLDS\b|conference (semi)?finals?|stanley cup|nba finals|super bowl|cfp|bowl\b/i.test(g.note);
    g.close = isClose(g);
    Object.assign(g, interest(g));
    return g;
  }

  function isClose(g) {
    if (g.state !== "in" || g.teams.length !== 2) return false;
    const m = Math.abs((parseInt(g.teams[0].score) || 0) - (parseInt(g.teams[1].score) || 0));
    const p = g.period, r = CLOSE[g.lg.sport];
    if (!r) return false;
    if (g.lg.soccer) return m <= r.margin && (p > 2 || (parseInt(g.clock) || 0) >= r.fromMinute);
    if (g.lg.sport === "Baseball") return p >= r.fromInning && m <= r.margin;
    const last = g.lg.reg;
    if (p > last) return m <= r.margin; // overtime
    return p === last && clockSecs(g.clock) <= r.minsLeft * 60 && m <= r.margin;
  }

  // What makes a game worth flipping to
  function interest(g) {
    const reasons = [];
    let score = 0;
    const [a, h] = g.teams;
    if (!a || !h) return { hype: 0, reasons };
    const as = parseInt(a.score) || 0, hs = parseInt(h.score) || 0;
    const margin = Math.abs(as - hs);
    const reg = g.lg.soccer ? 2 : g.lg.reg;
    const secondHalf = g.lg.soccer ? g.period >= 2 : g.lg.sport === "Baseball" ? g.period >= 5 : g.period > reg / 2;
    const favAbbr = (g.odds?.details || "").match(/^([A-Z0-9&]{2,6})\s+-/)?.[1];
    if (g.state === "in") {
      score += 10;
      if (g.close) { score += 50; reasons.push("Close game"); }
      if (reg && g.period > reg) { score += 30; reasons.push(g.lg.sport === "Baseball" ? "Extra innings" : "Overtime"); }
      const leader = as > hs ? a : hs > as ? h : null;
      const favTeam = favAbbr ? g.teams.find(t => t.abbr === favAbbr) : null;
      const rankedFav = a.rank && !h.rank ? a : h.rank && !a.rank ? h : (a.rank && h.rank ? (a.rank < h.rank ? a : h) : null);
      const victim = favTeam || rankedFav;
      if (secondHalf && leader && victim && leader !== victim && margin > 0) {
        score += 40; reasons.push(victim.rank ? `Upset alert: No. ${victim.rank} trails` : "Upset alert");
      }
      if (g.rankedClash) { score += 20; reasons.push("Top 25 clash"); }
      if (g.playoff) { score += 25; reasons.push("Playoffs"); }
      if (!g.close && !reasons.length) score += Math.max(0, 15 - margin);
    } else if (g.state === "pre") {
      const mins = (new Date(g.date) - Date.now()) / 60000;
      if (mins <= 45 && mins > -15) { score += 8; reasons.push("Starting soon"); }
      if (g.rankedClash) { score += 6; reasons.push("Top 25 clash"); }
    }
    return { hype: score, reasons };
  }

  function watchOptions(nets, lg) {
    const out = [];
    const add = (o, net) => {
      const x = out.find(x => x.app === o.app);
      if (x) { if (!x.nets.includes(net)) x.nets.push(net); }
      else out.push({ app: o.app, url: o.url, scheme: o.scheme || "", nets: [net] });
    };
    nets.forEach(n => {
      const name = n.name.trim();
      const hit = WATCH.find(w => w.re.test(name));
      if (hit) return add(hit, name);
      if ((n.market === "home" || n.market === "away") && OUT_OF_MARKET[lg.id]) add(OUT_OF_MARKET[lg.id], name);
    });
    out.sort((a, b) => (b.app === "YouTube TV") - (a.app === "YouTube TV"));
    return out;
  }

  function watchPill(g) {
    if (g.state === "post" || !g.watch?.length) return g.broadcast && g.state !== "post" ? `<span class="net">${esc(g.broadcast)}</span>` : "";
    const [w, ...rest] = g.watch;
    const title = `${w.app}: ${w.nets.join(", ")}` + (rest.length ? ` · Also on ${rest.map(x => `${x.app} (${x.nets.join(", ")})`).join(", ")}` : "");
    return `<a class="watch" href="${esc(w.url)}" ${w.scheme ? `data-app="${esc(w.scheme)}"` : ""} target="_blank" rel="noopener" title="${esc(title)}">${PLAY}<b>${esc(w.app)}</b>${w.nets[0].toLowerCase() === w.app.toLowerCase() ? "" : `<span>${esc(w.nets[0])}</span>`}${rest.length ? `<i>+${rest.length}</i>` : ""}</a>`;
  }

  // =====================================================================
  // Normalize leaderboards and events
  // =====================================================================
  function evState(ev) { return (ev.status || ev.competitions?.[0]?.status || {}).type || {}; }
  function str(v) { return v == null ? "" : typeof v === "object" ? (v.displayValue ?? v.value ?? "") : String(v); }

  function parseGolf(ev, lg) {
    const comp = ev.competitions?.[0] || {};
    const type = evState(ev);
    const rows = (comp.competitors || []).map((c, i) => {
      const ls = (c.linescores || []).filter(l => l && (l.value != null || l.displayValue));
      const today = ls.length ? ls[ls.length - 1] : null;
      const thruRaw = c.status?.thru ?? c.status?.hole;
      return {
        name: c.athlete?.displayName || c.athlete?.fullName || "",
        flag: c.athlete?.flag?.href || "",
        pos: c.status?.position?.displayName || c.position?.displayName || "",
        order: c.sortOrder ?? c.order ?? i + 1,
        total: str(c.score),
        today: today ? str(today.displayValue ?? today.value) : "",
        thru: thruRaw != null && thruRaw !== "" ? (+thruRaw >= 18 ? "F" : String(thruRaw)) : (c.status?.displayValue || ""),
      };
    }).filter(r => r.name).sort((a, b) => a.order - b.order);
    return { kind: "golf", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate,
      state: type.state || "pre", detail: type.detail || type.shortDetail || "", link: ev.links?.[0]?.href || "", rows };
  }

  function parseRace(ev, lg) {
    const sessions = (ev.competitions || []).map(c => ({
      abbr: c.type?.abbreviation || c.type?.text || "Session",
      date: c.date || ev.date,
      state: c.status?.type?.state || "pre",
      detail: c.status?.type?.shortDetail || "",
      top: (c.competitors || []).slice().sort((a, b) => (a.order || 99) - (b.order || 99)).slice(0, 3)
        .map(x => ({ name: x.athlete?.displayName || x.athlete?.shortName || "", flag: x.athlete?.flag?.href || "" })).filter(x => x.name),
    }));
    const type = evState(ev);
    const st = sessions.some(s => s.state === "in") ? "in" : (type.state || "pre");
    return { kind: "race", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", sessions };
  }

  function athleteRow(x) {
    return { name: x?.athlete?.displayName || x?.athlete?.shortName || x?.roster?.shortDisplayName || x?.team?.displayName || "",
      flag: x?.athlete?.flag?.href || "", winner: !!x?.winner,
      sets: (x?.linescores || []).map(l => l?.value).filter(v => v != null) };
  }

  function parseMma(ev, lg) {
    const fights = (ev.competitions || []).map(c => ({
      a: athleteRow(c.competitors?.[0]), b: athleteRow(c.competitors?.[1]),
      state: c.status?.type?.state || "pre", detail: c.status?.type?.shortDetail || c.status?.type?.detail || "",
      note: c.type?.abbreviation || c.note || "",
    })).filter(f => f.a.name && f.b.name);
    const type = evState(ev);
    const st = fights.some(f => f.state === "in") ? "in" : (type.state || "pre");
    return { kind: "mma", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", fights };
  }

  function parseTennis(ev, lg) {
    const comps = (ev.groupings || []).flatMap(gr => (gr.competitions || []).map(c => ({ c, group: gr.grouping?.displayName || "" })))
      .concat((ev.competitions || []).map(c => ({ c, group: "" })));
    const matches = comps.map(({ c, group }) => ({
      a: athleteRow(c.competitors?.[0]), b: athleteRow(c.competitors?.[1]),
      state: c.status?.type?.state || "pre", detail: c.status?.type?.shortDetail || "",
      round: c.round?.displayName || c.type?.text || group, date: c.date,
    })).filter(m => m.a.name && m.b.name);
    const ord = { in: 0, post: 1, pre: 2 };
    matches.sort((x, y) => (ord[x.state] - ord[y.state]) || (x.state === "post" ? new Date(y.date) - new Date(x.date) : new Date(x.date) - new Date(y.date)));
    const type = evState(ev);
    const st = matches.some(m => m.state === "in") ? "in" : (type.state || "pre");
    return { kind: "tennis", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", matches };
  }

  const PARSE = { golf: parseGolf, race: parseRace, mma: parseMma, tennis: parseTennis };

  // When viewing today, only keep events that are on now, starting soon, or just finished
  function relevant(e) {
    if (!isToday()) return true;
    const now = Date.now(), start = new Date(e.date).getTime();
    const end = e.end ? new Date(e.end).getTime() : start + 4 * 864e5;
    if (e.state === "in") return true;
    if (e.state === "pre") return start - now < 3 * 864e5;
    return now - end < 1.5 * 864e5;
  }

  // =====================================================================
  // Fetching
  // =====================================================================
  const topFlight = {};
  async function loadTopFlight(slug) {
    if (topFlight[slug]) return topFlight[slug];
    try {
      const j = await (await fetch(API + "soccer/" + slug + "/teams")).json();
      const ids = (j.sports?.[0]?.leagues?.[0]?.teams || []).map(t => t.team?.id).filter(Boolean);
      if (ids.length) topFlight[slug] = new Set(ids);
    } catch {}
    return topFlight[slug] || null;
  }

  async function loadLeague(lg) {
    if (lg.kind) {
      const url = API + lg.path + "/scoreboard" + (isToday() ? "" : "?dates=" + ymd(state.date));
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const special = (j.events || []).map(ev => { try { return PARSE[lg.kind](ev, lg); } catch { return null; } }).filter(Boolean).filter(relevant);
      return { events: [], special };
    }
    const r = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(state.date) + (lg.extra || ""), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    let games = (j.events || []).map(ev => normalize(ev, lg));
    // After midnight, last night's games are still on the previous day's scoreboard. Pull in the ones still being played.
    if (isToday() && new Date().getHours() < 8) {
      try {
        const ry = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(addDays(state.date, -1)) + (lg.extra || ""), { cache: "no-store" });
        if (ry.ok) {
          const have = new Set(games.map(g => g.id));
          ((await ry.json()).events || []).map(ev => normalize(ev, lg)).filter(g => !have.has(g.id) && g.state === "in").forEach(g => games.push(g));
        }
      } catch {}
    }
    if (lg.topFlight && games.length) {
      const set = await loadTopFlight(lg.topFlight);
      if (set) games = games.filter(g => g.teams.some(t => set.has(t.id)));
    }
    if (lg.id === "ncaaf" && games.length) {
      const p4 = new Set();
      await Promise.allSettled(P4_GROUPS.map(async gid => {
        const rr = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(state.date) + "&groups=" + gid + "&limit=100", { cache: "no-store" });
        if (rr.ok) ((await rr.json()).events || []).forEach(e => p4.add(e.id));
      }));
      games.forEach(g => g.p4 = p4.has(g.id));
    }
    return { events: games, special: [] };
  }

  async function loadAll() {
    if (state.loading) return;
    state.loading = true;
    document.getElementById("refresh").classList.add("spin");
    const results = await Promise.allSettled(LEAGUES.map(loadLeague));
    results.forEach((r, i) => {
      state.data[LEAGUES[i].id] = r.status === "fulfilled" ? r.value : { events: [], special: [], error: r.reason?.message || "failed" };
    });
    state.loading = false;
    state.updatedAt = new Date();
    document.getElementById("refresh").classList.remove("spin");
    if (isToday()) checkAlerts();
    render();
    schedule();
    refreshNext();
  }

  function schedule() {
    clearTimeout(state.timer);
    if (!isToday()) return;
    const anyLive = allGames().some(g => g.state === "in") || allSpecial().some(e => e.state === "in");
    state.timer = setTimeout(() => { if (!document.hidden) loadAll(); else schedule(); }, anyLive ? 30000 : 120000);
  }

  function allGames() { return TEAM_LEAGUES.flatMap(lg => state.data[lg.id]?.events || []).map(g => ({ ...g, fav: g.teams.some(t => isFavTeam(g.lg, t.abbr)) })); }
  function allSpecial() { return EVENT_LEAGUES.flatMap(lg => state.data[lg.id]?.special || []); }

  // =====================================================================
  // Team index, follow list, next game
  // =====================================================================
  const teamCache = {};
  // Team lists come from the standings feed (ESPN's /teams feed blocks other websites)
  async function loadTeams(lgId) {
    if (teamCache[lgId]) return teamCache[lgId];
    const cached = store.get("teams2:" + lgId, null);
    if (cached && Date.now() - cached.t < 7 * 864e5) return (teamCache[lgId] = cached.list);
    const lg = LG[lgId];
    try {
      const j = await (await fetch("https://site.api.espn.com/apis/v2/sports/" + lg.path + "/standings")).json();
      const list = [], seen = new Set();
      const walk = n => {
        (n.standings?.entries || []).forEach(e => {
          const t = e.team;
          if (!t || seen.has(t.id)) return;
          seen.add(t.id);
          list.push({ lg: lgId, id: t.id, abbr: t.abbreviation || "", name: t.displayName || t.name || "", short: t.shortDisplayName || "",
            logo: t.logos?.[0]?.href || "", color: hexColor(t.color) });
        });
        (n.children || []).forEach(walk);
      };
      walk(j);
      if (list.length && !lg.college) store.set("teams2:" + lgId, { t: Date.now(), list });
      return (teamCache[lgId] = list);
    } catch { return []; }
  }

  function keyFor(t) { return favKey(LG[t.lg], t.abbr); }

  async function ensureMeta(keys) {
    for (const k of keys) {
      if (state.favMeta[k]) continue;
      const [prefix, abbr] = [k.slice(0, k.indexOf(":")), k.slice(k.indexOf(":") + 1)];
      const candidates = prefix === "soccer" ? [DEFAULT_META[k] || "epl", ...SOCCER_HOME] : [prefix];
      for (const lgId of [...new Set(candidates)]) {
        if (!LG[lgId]) continue;
        const hit = (await loadTeams(lgId)).find(t => t.abbr === abbr);
        if (hit) { state.favMeta[k] = { lg: lgId, id: hit.id, name: hit.name, logo: hit.logo, color: hit.color, abbr }; break; }
      }
    }
    store.set("favMeta", state.favMeta);
  }

  function placeName(v) {
    const a = v?.address || {};
    const city = a.city || "", region = a.state ? a.state : (a.country && !/^(USA|United States)$/i.test(a.country) ? a.country : "");
    return [city, region].filter(Boolean).join(", ");
  }
  async function fetchNext(k) {
    const m = state.favMeta[k];
    if (!m) return;
    const lg = LG[m.lg];
    const parse = j => {
      const now = Date.now();
      const ev = (j.events || []).filter(e => new Date(e.date).getTime() > now - 4 * 3600e3)
        .filter(e => (e.competitions?.[0]?.status?.type?.state || "pre") !== "post")
        .sort((a, b) => new Date(a.date) - new Date(b.date))[0];
      if (!ev) return null;
      const cs = ev.competitions?.[0]?.competitors || [];
      const me = cs.find(c => String(c.team?.id || c.id) === String(m.id));
      const opp = cs.find(c => c !== me);
      return { date: ev.date, opp: opp?.team?.abbreviation || opp?.team?.shortDisplayName || "TBD",
        oppLogo: opp?.team?.logos?.[0]?.href || opp?.team?.logo || "", at: me?.homeAway === "away" ? "@" : "vs",
        place: placeName(ev.competitions?.[0]?.venue), id: String(ev.id || "") };
    };
    let found = null;
    try {
      found = parse(await (await fetch(API + lg.path + "/teams/" + m.id + "/schedule")).json());
      if (!found && !lg.soccer) found = parse(await (await fetch(API + lg.path + "/teams/" + m.id + "/schedule?seasontype=3")).json());
    } catch {}
    // The team schedule feed can lag. Confirm time and arena against that day's scoreboard.
    if (found?.id) {
      try {
        const r = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(new Date(found.date)) + (lg.extra || ""), { cache: "no-store" });
        const ev = r.ok ? ((await r.json()).events || []).find(e => String(e.id) === found.id) : null;
        if (ev) { found.date = ev.date || found.date; const pl = placeName(ev.competitions?.[0]?.venue); if (pl) found.place = pl; found.v = 2; }
      } catch {}
    }
    state.next[k] = found ? { t: Date.now(), ...found } : { t: Date.now(), none: true };
  }

  async function refreshNext() {
    if (!isToday()) return;
    const playing = new Set(allGames().flatMap(g => g.teams.map(t => favKey(g.lg, t.abbr))));
    const todo = [...state.favs].filter(k => !playing.has(k))
      .filter(k => { const c = state.next[k]; return !c || (c.date && c.v !== 2) || Date.now() - c.t > 3 * 3600e3 || (c.date && new Date(c.date) < Date.now() - 4 * 3600e3); });
    if (!todo.length) return;
    await ensureMeta(todo);
    await Promise.allSettled(todo.map(fetchNext));
    store.set("next", state.next);
    render();
  }

  function toggleFav(k, meta) {
    if (state.favs.has(k)) { state.favs.delete(k); }
    else {
      state.favs.add(k);
      if (meta) { state.favMeta[k] = meta; store.set("favMeta", state.favMeta); }
      delete state.next[k];
    }
    store.set("favs", [...state.favs]);
    render();
    renderSheet();
    refreshNext();
  }

  // =====================================================================
  // Alerts
  // =====================================================================
  // Alert events: start, half (halftime/intermission), close, ot, lead (lead change), upset, playoff (playoff game starts), final
  const ALERT_EVENTS = {
    team:    [["start", "Game start"], ["half", "Halftime"], ["close", "Close game"], ["ot", "Overtime"], ["lead", "Lead changes"], ["final", "Final score"]],
    watched: [["start", "Game start"], ["half", "Halftime"], ["close", "Close game"], ["ot", "Overtime"], ["lead", "Lead changes"], ["final", "Final score"]],
    all:     [["close", "Close games"], ["ot", "Overtime"], ["upset", "Upset alerts"], ["playoff", "Playoff games starting"]],
  };
  const seen = new Set();
  const snap = {};
  let primed = false;
  function gameKey(g) { return g.lg.id + ":" + g.id; }
  function isWatched(g) { return !!state.watched[gameKey(g)]; }
  function wants(g, ev) {
    const p = state.alertPrefs;
    return (g.fav && p.team[ev]) || (isWatched(g) && p.watched[ev]) || (!!p.all[ev]);
  }
  function leaderOf(g) {
    const [a, h] = g.teams; const as = +a?.score || 0, hs = +h?.score || 0;
    return as > hs ? a?.abbr : hs > as ? h?.abbr : null;
  }
  function checkAlerts() {
    allGames().forEach(g => {
      const prev = snap[g.id];
      const now = { state: g.state, leader: leaderOf(g), half: /halftime|^ht$|end of (the )?(1st|2nd)( period)?$/i.test(g.status) };
      snap[g.id] = now;
      if (!primed || !prev) {
        // first look: remember what's already happened so nothing old fires
        triggers(g).forEach(tr => seen.add(g.id + ":" + tr));
        return;
      }
      const events = [];
      if (prev.state === "pre" && g.state === "in") events.push(g.playoff ? "playoff" : "start", ...(g.playoff ? ["start"] : []));
      if (g.state === "in" && now.half && !prev.half) events.push("half");
      if (g.state === "in" && prev.leader && now.leader && prev.leader !== now.leader) events.push("lead");
      if (prev.state !== "post" && g.state === "post") events.push("final");
      if (g.state === "in") triggers(g).forEach(tr => { const k = g.id + ":" + tr; if (!seen.has(k)) { seen.add(k); events.push(tr); } });
      const fired = new Set();
      events.forEach(ev => {
        if (fired.has(ev) || !wants(g, ev)) return;
        if (ev === "playoff" && fired.has("start")) return;
        if (ev === "start" && fired.has("playoff")) return;
        fired.add(ev);
        fireEvent(g, ev);
      });
    });
    primed = true;
  }
  function triggers(g) {
    const out = [];
    if (g.close) out.push("close");
    (g.reasons || []).forEach(r => { if (/Overtime|Extra/.test(r)) out.push("ot"); if (/Upset/.test(r)) out.push("upset"); });
    return out;
  }
  function favName(g) {
    const t = g.teams.find(t => isFavTeam(g.lg, t.abbr));
    return t ? (t.name || t.abbr) : "";
  }
  function fireEvent(g, ev) {
    const [a, h] = g.teams;
    const who = g.fav ? favName(g) : `${a.abbr} at ${h.abbr}`;
    const line = `${a.abbr} ${a.score}, ${h.abbr} ${h.score}` + (g.state === "in" ? ` · ${g.status}` : "");
    const watch = g.watch?.[0] ? `Watch on ${g.watch[0].app}${g.watch[0].nets[0] && g.watch[0].nets[0] !== g.watch[0].app ? " (" + g.watch[0].nets[0] + ")" : ""}` : (g.lg.short || g.lg.name);
    const k = g.id + ":" + ev;
    switch (ev) {
      case "start": return notify(g.fav ? `${who} game is on` : `${who} is on`, `${a.name || a.abbr} at ${h.name || h.abbr}`, watch, g.link, false, k);
      case "playoff": return notify(`Playoffs: ${a.abbr} at ${h.abbr} is on`, g.note || g.series || `${a.name} at ${h.name}`, watch, g.link, false, k);
      case "half": return notify(`${who}: ${/end of/i.test(g.status) ? g.status : "Halftime"}`, line, watch, g.link, false, k);
      case "lead": return notify(`${who}: Lead change`, `${leaderOf(g)} leads · ${line}`, watch, g.link, false, k);
      case "close": return notify(`${g.fav || isWatched(g) ? who + ": " : ""}Close game`, line, watch, g.link, false, k);
      case "ot": return notify(`${g.fav || isWatched(g) ? who + ": " : ""}${g.lg.sport === "Baseball" ? "Extra innings" : "Overtime"}`, line, watch, g.link, false, k);
      case "upset": return notify(g.reasons.find(r => /Upset/.test(r)) || "Upset alert", line, watch, g.link, true, k);
      case "final": {
        const me = g.teams.find(t => isFavTeam(g.lg, t.abbr)), opp = g.teams.find(t => t !== me);
        const res = g.fav && me && opp ? ((+me.score) > (+opp.score) ? "W" : (+me.score) < (+opp.score) ? "L" : "T") : "";
        return notify(`${who} final${res ? ": " + res : ""}`, `${a.abbr} ${a.score}, ${h.abbr} ${h.score}`, g.lg.short || g.lg.name, g.link, res === "L", k);
      }
    }
  }
  function toggleWatch(key) {
    if (state.watched[key]) delete state.watched[key]; else state.watched[key] = Date.now();
    store.set("watched", state.watched);
    const g = findGame(key);
    if (state.watched[key]) {
      askPermission();
      toast("Alerts on for this game", g ? `${g.teams[0]?.abbr} at ${g.teams[1]?.abbr}` : "", "Change what you get in Settings", "", false);
    }
    render();
    if (openGameKey === key) repaintGame();
  }
  function notify(title, line, where, link, hot, tagKey) {
    toast(title, line, where, link, hot);
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        const opts = { body: [line, where].filter(Boolean).join("\n"), tag: tagKey, data: { url: link || location.href } };
        (navigator.serviceWorker?.getRegistration?.() || Promise.resolve(null))
          .then(reg => reg ? reg.showNotification(title, opts) : new Notification(title, opts))
          .catch(() => {});
      }
    } catch {}
  }
  function notifyStatus() {
    if (!("Notification" in window)) return /iPhone|iPad/.test(navigator.userAgent) ? "Add Scores to your home screen to allow notifications" : "This browser doesn't support notifications";
    if (Notification.permission === "granted") return "Notifications allowed";
    if (Notification.permission === "denied") return "Notifications are blocked in your phone's settings";
    return "Notifications not allowed yet";
  }
  function toast(title, line, sub, link, hot) {
    const box = document.getElementById("toasts");
    const el = document.createElement(link ? "a" : "div");
    el.className = "toast" + (hot ? " hot" : "");
    if (link) { el.href = link; el.target = "_blank"; el.rel = "noopener"; }
    el.innerHTML = `<b>${esc(title)}</b><span>${esc(line)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}`;
    box.prepend(el);
    setTimeout(() => el.remove(), 9000);
  }

  // =====================================================================
  // Rendering: pieces (V1 look)
  // =====================================================================
  function starBtn(lg, t, extraClass = "") {
    const k = favKey(lg, t.abbr), on = state.favs.has(k);

    return `<button class="star ${extraClass} ${on ? "on" : ""}" data-fav="${esc(k)}" data-meta="${meta}" title="${on ? "Unfollow" : "Follow"} ${esc(t.name)}" aria-label="${on ? "Unfollow" : "Follow"} ${esc(t.name)}">${on ? STAR : STAR_O}</button>`;
  }
  const BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>';
  function bellBtn(g) {

  }
  function statusClass(g) { return g.state === "in" ? "live" : g.state === "post" ? "final" : ""; }

  function situation(g) {
    const s = g.sit;

    if (g.lg.sport === "Baseball" && s.outs != null) {
      const bases = `<svg class="diamond" viewBox="0 0 26 22" aria-label="Runners on base">
        <rect x="9.5" y="1.5" width="7" height="7" transform="rotate(45 13 5)" class="${s.onSecond ? "on" : ""}"/>
        <rect x="16.5" y="8.5" width="7" height="7" transform="rotate(45 20 12)" class="${s.onFirst ? "on" : ""}"/>
        <rect x="2.5" y="8.5" width="7" height="7" transform="rotate(45 6 12)" class="${s.onThird ? "on" : ""}"/></svg>`;
      const outs = `<span class="outs" aria-label="${s.outs} outs">${[0, 1, 2].map(i => `<i class="${i < s.outs ? "on" : ""}"></i>`).join("")}</span>`;
      return `${bases}${outs}<span class="txt">${s.balls != null ? `${s.balls}-${s.strikes}` : ""}${s.lastPlay?.text ? " · " + esc(s.lastPlay.text) : ""}</span>`;
    }

      return `<span class="txt">${s.isRedZone ? '<b style="color:var(--live)">Red zone</b> · ' : ""}${esc(s.downDistanceText)}</span>`;

  // By league: card grid
  function teamRow(g, t, i) {
    const other = g.teams[1 - i];

  // By time: Sofascore-style list
  function tlRow(g) {
    const [a, h] = g.teams;
    if (!a || !h) return "";
    const lose = (t, o) => g.state === "post" && o.winner && !t.winner;

    const team = (t, o, at) => `<div class="tt ${lose(t, o) ? "lose" : ""}">

      `<div class="t-sc ${g.state === "in" ? "live" : ""}"><span class="${lose(a, h) ? "lose" : ""}">${esc(a.score)}</span><span class="${lose(h, a) ? "lose" : ""}">${esc(h.score)}</span></div>`;

    return `<div class="grid">${sorted.map(g => card(g, true)).join("")}</div>`;

  // Worth Watching: Apple Sports-style rows

    const [a, h] = g.teams;
    if (!a || !h) return "";
    const side = t => `<div class="f-team ${t.homeAway === "home" ? "home" : ""} ${isFavTeam(g.lg, t.abbr) ? "fav" : ""}">${starBtn(g.lg, t)}

      <div class="f-grid">

  // Your teams strip
  // Top strip: mini versions of the game cards
  function miniRow(logo, abbr, rec, score, lose, fav) {
    return `<span class="mc-row ${lose ? "lose" : ""}">${logo ? `<img src="${esc(logo)}" alt="">` : "<i></i>"}<b>${esc(abbr)}</b>${rec ? `<small>${esc(rec)}</small>` : ""}${fav ? '<span class="mc-fav" aria-label="Your team">★</span>' : ""}${score != null ? `<em>${esc(score)}</em>` : ""}</span>`;

  function stripChip(g) {

    const row = (t, o) => miniRow(t.logo, t.abbr, g.state === "pre" ? t.record : "", g.state === "pre" ? null : t.score, lose(t, o), isFavTeam(g.lg, t.abbr));
    const sit = g.state === "in" ? (g.sit?.downDistanceText || (g.lg.sport === "Baseball" && g.sit?.outs != null ? `${g.sit.outs} out${g.sit.outs === 1 ? "" : "s"}` : "")) : "";
    const foot = sit || (g.state !== "post" ? (g.watch?.[0]?.app || g.broadcast || "") : (g.series || g.lg.short || g.lg.name));

  function nextChip(k) {

      ${n.at === "@" ? me + opp : opp + me}${n.place ? `<span class="mc-foot">${esc(n.place)}</span>` : ""}</${tag}>`;

  // Golf leaderboard
  function toPar(v) { return String(v ?? "").startsWith("-") ? "under" : ""; }
  function eventMeta(e) {
    if (e.state === "in") return e.detail || "Live";
    if (e.state === "pre") return "Starts " + whenLabel(e.date);
    return e.detail || "Final";
  }
  function golfBlock(e) {
    const rows = e.rows.slice(0, 10);
    const leadTotal = rows[0]?.total;
    const body = rows.length ? `<div class="lb-wrap"><table class="lb">
      <thead><tr><th>Pos</th><th>Player</th><th class="num">Total</th><th class="num">Today</th><th class="num">Thru</th></tr></thead>
      <tbody>${rows.map(r => {
        const hot = /^-\d/.test(r.today) && parseInt(r.today) <= -5;
        return `<tr class="${r.total && r.total === leadTotal ? "lead" : ""}">
          <td class="pos">${esc(r.pos || "–")}</td>
          <td><span class="pl">${r.flag ? `<img src="${esc(r.flag)}" alt="">` : ""}${esc(r.name)}${hot ? ' <span class="why hot">Hot</span>' : ""}</span></td>
          <td class="num ${toPar(r.total)}">${esc(r.total || "–")}</td>

  const BLOCK = { golf: golfBlock };

  function countLabel(n) { return `${n} Game${n === 1 ? "" : "s"}`; }
  function block(id, title, meta, body, icon) {
    const closed = state.closed.has(id);
    return `<section class="block ${closed ? "closed" : ""}" data-block="${esc(id)}">
      <div class="bhead">${icon || ""}<h2>${esc(title)}</h2>${meta ? `<span class="meta">${esc(meta)}</span>` : ""}
        <button class="tog" data-tog="${esc(id)}" aria-expanded="${!closed}" aria-label="${closed ? "Expand" : "Collapse"} ${esc(title)}">${CHEV}</button></div>
      <div class="bbody">${body}</div></section>`;
