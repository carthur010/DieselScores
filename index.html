<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scores</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scores">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: broadcast graphics. Chyron section bars with a gold tab, boxed score numerals,
   team-color stripes. Compact = Sofascore-style list, Expanded = Apple Sports-style rows. */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --line: #d8deea;
  --fg: #0b1222;
  --muted: #59647d;
  --dim: #a1abc0;
  --chyron: #0b1733;
  --chyron-2: #1a2b55;
  --on-chyron: #ffffff;
  --accent: #1747d1;
  --accent-soft: #e2e9fd;
  --gold: #f2b400;
  --on-gold: #1a1300;
  --live: #df1b2f;
  --star: #e0a400;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060a14; --surface: #0d1423; --surface-2: #121b2f; --line: #1e2a43; --fg: #edf1fa;
    --muted: #8a95ae; --dim: #3c4862; --chyron: #18264a; --chyron-2: #22335f; --on-chyron: #ffffff;
    --accent: #86a8ff; --accent-soft: #16224a; --gold: #ffc72c; --on-gold: #1a1300; --live: #ff4a5c; --star: #ffc933;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060a14; --surface: #0d1423; --surface-2: #121b2f; --line: #1e2a43; --fg: #edf1fa;
  --muted: #8a95ae; --dim: #3c4862; --chyron: #18264a; --chyron-2: #22335f; --on-chyron: #ffffff;
  --accent: #86a8ff; --accent-soft: #16224a; --gold: #ffc72c; --on-gold: #1a1300; --live: #ff4a5c; --star: #ffc933;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; }

/* ---------- Header ---------- */
header.top {
  position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 8px; padding-block: 12px 4px; }
.brand {
  font-family: var(--display); font-weight: 800; font-style: italic; font-size: 25px; line-height: 1;
  letter-spacing: .06em; text-transform: uppercase; background: var(--chyron); color: var(--on-chyron);
  padding: 6px 18px 5px 10px; border-left: 5px solid var(--gold);
  clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
}
.livebug {
  display: inline-flex; align-items: center; gap: 5px; font-family: var(--display); font-weight: 700;
  font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--live);
  padding: 3px 8px 2px;
}
.livebug[hidden] { display: none !important; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }
.iconbtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); position: relative; flex: 0 0 auto; }
.iconbtn:hover { background: var(--surface); color: var(--fg); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[aria-pressed="true"] { color: var(--gold); }
.iconbtn .v-e { display: none; }
.iconbtn.expanded .v-c { display: none; }
.iconbtn.expanded .v-e { display: block; }
.iconbtn input[type=date] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.dates { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.dates::-webkit-scrollbar { display: none; }
.dates button.d {
  flex: 0 0 auto; padding: 9px 11px 10px; font-weight: 600; color: var(--muted); white-space: nowrap;
  border-bottom: 3px solid transparent; font-size: 14px;
}
.dates button.d.on { color: var(--fg); border-color: var(--gold); }
.dates button.d:hover { color: var(--fg); }
.dates .iconbtn { width: 34px; height: 34px; }

.controls { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; margin-left: -16px; padding-left: 16px; }
.tabs::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap;
}
.chip.on { background: var(--chyron); color: var(--on-chyron); border-color: var(--chyron); }
.chip .n { opacity: .65; margin-left: 5px; font-weight: 500; }
.chip.hot:not(.on) { border-color: var(--gold); color: var(--fg); background: color-mix(in srgb, var(--gold) 22%, var(--surface)); }
.chip.livechip.hot:not(.on) { border-color: var(--live); background: color-mix(in srgb, var(--live) 12%, var(--surface)); }
.seg { display: inline-flex; flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.seg button { font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.seg button.on { background: var(--gold); color: var(--on-gold); }

main { padding-block: 4px 56px; display: grid; gap: 16px; }
.updated { font-size: 12px; color: var(--muted); text-align: right; margin: 0; }
.quiet { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }

/* ---------- Section chyron ---------- */
section.block { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.bhead { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 0; background: var(--chyron); color: var(--on-chyron); }
.bhead::before { content: ""; width: 7px; align-self: stretch; margin-block: -9px; background: var(--gold); flex: 0 0 auto; }
.bhead h2 { margin: 0; font-family: var(--display); font-style: italic; font-size: 20px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; line-height: 1.1; }
.bhead .meta { color: color-mix(in srgb, var(--on-chyron) 70%, transparent); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bhead .ico { width: 18px; height: 18px; color: var(--gold); flex: 0 0 auto; }
.bhead .tog { margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 4px; background: rgba(255,255,255,.1); color: var(--on-chyron); flex: 0 0 auto; }
.bhead .tog svg { width: 15px; height: 15px; transition: transform .2s; }
section.closed .tog svg { transform: rotate(180deg); }
section.closed .bbody { display: none; }

/* ---------- Shared bits ---------- */
.star { width: 24px; height: 24px; display: grid; place-items: center; color: var(--dim); flex: 0 0 auto; border-radius: 4px; }
.star svg { width: 14px; height: 14px; }
.star.on { color: var(--star); }
.star:hover { color: var(--star); }
.tag {
  display: inline-block; font-family: var(--display); font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--on-gold); background: var(--gold); padding: 2px 7px 1px; white-space: nowrap; line-height: 1.3;
}
.tag.hot { background: var(--live); color: #fff; }
.tag.cool { background: var(--accent-soft); color: var(--accent); }
.watch {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; min-width: 0;
  font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.watch b { font-weight: 700; }
.watch span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.watch i { font-style: normal; font-weight: 700; opacity: .7; }
.watch:hover { background: var(--accent); color: var(--bg); }
.watch:hover span { color: inherit; }
.net { font-size: 12px; color: var(--muted); }
.diamond { width: 26px; height: 22px; flex: 0 0 auto; vertical-align: middle; }
.diamond rect { fill: none; stroke: var(--dim); stroke-width: 1.5; }
.diamond rect.on { fill: var(--gold); stroke: var(--gold); }
.outs { display: inline-flex; gap: 3px; vertical-align: middle; }
.outs i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--dim); }
.outs i.on { background: var(--fg); border-color: var(--fg); }
.stripe { width: 3px; height: 18px; background: var(--tc, var(--line)); flex: 0 0 auto; border-radius: 1px; }

/* ---------- Your teams strip ---------- */
.mystrip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.mystrip::-webkit-scrollbar { display: none; }
.ms { flex: 0 0 auto; display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.ms-teams { display: grid; gap: 3px; padding: 7px 10px; }
.ms-t { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.ms-t img { width: 18px; height: 18px; object-fit: contain; }
.ms-t b { font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: .02em; }
.ms-t em { font-style: normal; font-family: var(--display); font-size: 17px; font-weight: 800; margin-left: auto; padding-left: 10px; }
.ms-t.lose b, .ms-t.lose em { color: var(--muted); }
.ms-s { display: grid; place-items: center; padding: 0 10px; font-family: var(--display); font-size: 14px; font-weight: 700; letter-spacing: .03em; background: var(--chyron); color: var(--on-chyron); white-space: nowrap; text-transform: uppercase; }
.ms.live .ms-s { background: var(--live); }
.ms.next .ms-teams { align-content: center; }
.ms.next .ms-s { background: var(--surface-2); color: var(--fg); text-transform: none; font-family: var(--body); font-size: 12px; font-weight: 600; display: grid; gap: 1px; padding: 6px 10px; text-align: left; place-items: center start; }
.ms.next .ms-s small { font-family: var(--display); font-weight: 800; letter-spacing: .1em; color: var(--gold); font-size: 11px; text-transform: uppercase; }
.ms.add { align-items: center; padding: 0 14px; color: var(--muted); font-weight: 600; font-size: 13px; gap: 6px; border-style: dashed; }
.ms.add:hover { color: var(--fg); }

/* ---------- Compact (Sofascore-style) ---------- */
.tl-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 6px; }
.tl-badge { min-width: 40px; height: 30px; padding-inline: 7px; white-space: nowrap; display: grid; place-items: center; background: var(--chyron); color: var(--on-chyron); font-family: var(--display); font-style: italic; font-weight: 800; font-size: 14px; letter-spacing: .04em; flex: 0 0 auto; max-width: 110px; overflow: hidden; clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); padding-right: 10px; }
.tl-head .crumb { font-weight: 700; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-head .crumb span { color: var(--muted); font-weight: 500; }
.tl-group { border-bottom: 6px solid var(--bg); }
.tl-group:last-child { border-bottom: 0; }
.t { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto 28px; align-items: center; gap: 10px; padding: 9px 14px; }
.t + .t { border-top: 1px solid var(--line); }
.t-time { display: grid; gap: 3px; font-size: 13px; color: var(--muted); justify-items: start; }
.t-time .st { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.t-time .st.live { color: var(--live); }
.t-time .st.final { color: var(--fg); }
.t-teams { display: grid; gap: 5px; min-width: 0; }
.tt { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; font-weight: 500; }
.tt img { width: 22px; height: 22px; object-fit: contain; flex: 0 0 auto; }
.tt .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt .rk { font-size: 12px; color: var(--muted); font-weight: 600; }
.tt.lose { color: var(--muted); }
.tt .poss { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: 0 0 auto; }
.tt .star { width: 18px; height: 18px; }
.tt .star svg { width: 12px; height: 12px; }
.tt .star:not(.on) { opacity: .5; }
.t-extra { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-left: 11px; min-width: 0; font-size: 12px; color: var(--muted); }
.t-sc { display: grid; gap: 5px; justify-items: end; }
.t-sc span { min-width: 32px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 24px; padding-inline: 5px; background: var(--chyron); color: var(--on-chyron); border-radius: 3px; }
.t-sc span.lose { background: var(--surface-2); color: var(--muted); }
.t-sc.live span:not(.lose) { background: var(--live); }
.t-go { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); }
.t-go:hover { color: var(--fg); border-color: var(--fg); }
.t-go svg { width: 14px; height: 14px; }
.t.fav { background: color-mix(in srgb, var(--star) 5%, transparent); }

/* ---------- Expanded (Apple Sports-style rows) ---------- */
.feat { padding: 0 16px; }
.f { padding-block: 16px; border-bottom: 1px solid var(--line); }
.f:last-child { border-bottom: 0; }
.f-lg { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.f-why { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.f-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(48px, auto) minmax(92px, auto) minmax(48px, auto) minmax(0, 1fr); align-items: center; gap: 8px; }
.f-team { display: grid; justify-items: center; gap: 5px; position: relative; text-align: center; min-width: 0; }
.f-team img { width: 50px; height: 50px; object-fit: contain; }
.f-team .bar2 { width: 28px; height: 3px; background: var(--tc, var(--line)); border-radius: 2px; }
.f-team .nm { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.f-team.fav .nm { color: var(--fg); }
.f-team .star { position: absolute; top: -4px; left: 0; }
.f-team.home .star { left: auto; right: 0; }
.f-sc { font-family: var(--display); font-weight: 800; font-size: 50px; line-height: 1; text-align: center; letter-spacing: -.01em; }
.f-sc.lose { color: var(--dim); }
.f-sc.rec { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.f-mid { text-align: center; display: grid; gap: 5px; justify-items: center; }
.f-mid .s { font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; background: var(--chyron); color: var(--on-chyron); padding: 3px 10px 2px; white-space: nowrap; }
.f-mid .s.live { background: var(--live); }
.f-mid .s.pre { background: transparent; color: var(--fg); padding-inline: 0; font-size: 19px; }
.f-mid .sub { font-size: 12px; color: var(--muted); }
.f-act { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.f-link { font-size: 12px; color: var(--accent); font-weight: 600; }
.f-link:hover { text-decoration: underline; }

/* ---------- Leaderboards & events ---------- */
.lb-wrap { overflow-x: auto; }
.lb { width: 100%; border-collapse: collapse; font-size: 14px; }
.lb th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lb td { padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lb td:nth-child(2) { white-space: normal; }
.lb tr:last-child td { border-bottom: 0; }
.lb .num { text-align: right; font-family: var(--display); font-weight: 700; font-size: 17px; }
.lb th.num { font-family: var(--body); font-size: 11px; }
.lb .under { color: var(--live); }
.lb .pos { font-family: var(--display); font-weight: 700; font-size: 16px; width: 44px; color: var(--muted); }
.lb .pl { display: flex; align-items: center; gap: 8px; }
.lb .pl img { width: 18px; height: 12px; object-fit: cover; border-radius: 1px; }
.lb .lead td { background: color-mix(in srgb, var(--gold) 10%, transparent); }
.ev { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev .lbl { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.ev .main { min-width: 0; display: grid; gap: 3px; }
.ev .main .ln { display: flex; gap: 8px; align-items: center; min-width: 0; }
.ev .main .ln span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .main .ln.win { font-weight: 700; }
.ev .main .ln.lose { color: var(--muted); }
.ev .main img { width: 16px; height: 11px; object-fit: cover; }
.ev .right { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.ev .right.live { color: var(--live); font-weight: 700; }
.ev .sets { display: flex; gap: 4px; margin-left: auto; font-family: var(--display); font-weight: 700; }
.ev .sets b { min-width: 16px; text-align: center; }
.ev.is-live { background: color-mix(in srgb, var(--live) 5%, transparent); }

.empty, .err { padding: 22px 16px; color: var(--muted); text-align: center; }
.err { color: var(--live); }
.skel { height: 96px; border-radius: 6px; background: linear-gradient(90deg, var(--surface), var(--line), var(--surface)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }

/* ---------- Team search sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(4, 8, 18, .55); display: grid; place-items: center; padding: 16px; }
.sheet-card { width: min(560px, 100%); max-height: min(80vh, 760px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sheet .bhead h2 { font-size: 19px; }
.sheet-body { padding: 14px; display: grid; gap: 12px; overflow-y: auto; }
.sheet input[type=search] { width: 100%; padding: 11px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.sheet h3 { margin: 4px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.res { display: grid; }
.res-row { display: grid; grid-template-columns: 4px 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.res-row:last-child { border-bottom: 0; }
.res-row img { width: 28px; height: 28px; object-fit: contain; }
.res-row .stripe { height: 28px; }
.res-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-row .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.res-row .follow { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.res-row .follow.on { background: var(--chyron); color: var(--on-chyron); border-color: var(--chyron); }
.sheet .hint { font-size: 13px; color: var(--muted); margin: 0; }

/* ---------- Alerts ---------- */
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; left: 12px; z-index: 60; display: grid; justify-items: end; gap: 8px; pointer-events: none; }
.toast {
  pointer-events: auto; width: min(380px, 100%); background: var(--chyron); color: var(--on-chyron);
  border-left: 6px solid var(--gold); padding: 10px 12px; display: grid; gap: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  animation: slide .25s ease-out;
}

<script>
(() => {
  // =====================================================================

  ];
  const LG = Object.fromEntries(LEAGUES.map(l => [l.id, l]));
  const TEAM_LEAGUES = LEAGUES.filter(l => !l.kind);
  const EVENT_LEAGUES = LEAGUES.filter(l => l.kind);
  const SEARCHABLE = ["nfl", "mlb", "nba", "wnba", "nhl", "epl", "wsl", "laliga", "seriea", "bund", "ligue1", "mls", "nwsl", "ncaaf", "ncaam", "ncaaw"];
  const SOCCER_HOME = ["epl", "wsl", "laliga", "seriea", "bund", "ligue1", "mls", "nwsl"];
  const P4_GROUPS = [1, 4, 5, 8];
  // Leagues that get their own tab. Everything else lives under All.
  const MAIN_TABS = ["nfl", "ncaaf", "mlb", "nba", "nhl", "epl", "pga"]; // ESPN conference ids: ACC, Big 12, Big Ten, SEC

  // "Close game" rules by sport. lastPeriod comes from the league's regulation length.
  const CLOSE = {
    Basketball: { minsLeft: 5, margin: 6 },
    Football:   { minsLeft: 5, margin: 8 },
    Hockey:     { minsLeft: 5, margin: 1 },
    Baseball:   { fromInning: 7, margin: 2 },
    Soccer:     { fromMinute: 85, margin: 1 },
  };

  // Where to watch. Your setup: YouTube TV + every streaming app. First match wins.
  const WATCH = [
    { re: /^(MSG|MSG ?2|MSGSN|MSG Sportsnet|MSG\+|YES|YES Network)$/i, app: "Gotham Sports", url: "https://gothamsports.com/" },
    { re: /^(ABC|CBS|NBC|FOX|CW|The CW|ESPN|ESPN2|ESPNU|ESPNEWS|SECN|SEC Network|SECN\+?|ACCN|ACC Network|BTN|Big Ten Network|FS1|FS2|TNT|TBS|truTV|NFL ?Net(work)?|NFLN|MLB ?Net(work)?|MLBN|NBA ?TV|NHL ?Net(work)?|CBSSN|CBS Sports Network|USA|USA Net(work)?|Golf|Golf Channel|Telemundo|Universo|Univision|UniMás|TUDN|Galavisión|ION|SNY|SportsNet NY)$/i, app: "YouTube TV", url: "https://tv.youtube.com/" },
    { re: /ESPN\+|ESPN Unlimited|ESPN App|ESPN Deportes\+/i, app: "ESPN app", url: "https://www.espn.com/watch/" },
    { re: /Peacock/i, app: "Peacock", url: "https://www.peacocktv.com/sports" },
    { re: /Paramount\+|Paramount Plus|CBS Sports Golazo/i, app: "Paramount+", url: "https://www.paramountplus.com/live-tv/" },
    { re: /Prime Video|Amazon|Prime/i, app: "Prime Video", url: "https://www.primevideo.com/" },
    { re: /Apple TV|MLS Season Pass|MLS Pass/i, app: "Apple TV", url: "https://tv.apple.com/" },
    { re: /Netflix/i, app: "Netflix", url: "https://www.netflix.com/" },
    { re: /^(Max|HBO Max|truTV Max)$/i, app: "HBO Max", url: "https://play.hbomax.com/" },
    { re: /Fox One|FOX One|Fox Nation/i, app: "Fox One", url: "https://www.foxone.com/" },
    { re: /DAZN/i, app: "DAZN", url: "https://www.dazn.com/" },
    { re: /NBA League Pass/i, app: "NBA League Pass", url: "https://www.nba.com/watch/league-pass-stream" },
    { re: /MLB\.?TV/i, app: "MLB.TV", url: "https://www.mlb.com/tv" },
    { re: /Victory\+/i, app: "Victory+", url: "https://www.victoryplus.com/" },
    { re: /YouTube/i, app: "YouTube", url: "https://www.youtube.com/" },
  ];
  // Out-of-market regional games (you're in NYC) go to the league package
  const OUT_OF_MARKET = {
    nba: { app: "NBA League Pass", url: "https://www.nba.com/watch/league-pass-stream" },
    mlb: { app: "MLB.TV", url: "https://www.mlb.com/tv" },
    nhl: { app: "ESPN app", url: "https://www.espn.com/watch/" },
  };
  // Soccer favorites are keyed "soccer:ABBR" so a club follows you across competitions
  const DEFAULT_FAVS = ["nba:NY", "nba:SAC", "nhl:NYR", "nhl:SJ", "mlb:NYM", "nfl:NYG", "soccer:ARS"];
  const DEFAULT_META = { "nba:NY": "nba", "nba:SAC": "nba", "nhl:NYR": "nhl", "nhl:SJ": "nhl", "mlb:NYM": "mlb", "nfl:NYG": "nfl", "soccer:ARS": "epl" };
  const API = "https://site.api.espn.com/apis/site/v2/sports/";

  // =====================================================================
  // Storage (best effort) and state
  // =====================================================================
  const store = {
    get(k, d) { try { const v = localStorage.getItem("scoreline:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("scoreline:" + k, JSON.stringify(v)); } catch {} }
  };

  const state = {
    date: startOfDay(new Date()),
    tab: store.get("tab2", "live"),
    view: store.get("view2", "compact"),
    favs: new Set(store.get("favs", DEFAULT_FAVS)),
    favMeta: store.get("favMeta", {}),   // key -> { lg, id, name, logo, color }
    next: store.get("next", {}),         // key -> { t, date, opp, oppLogo, at, none }
    closed: new Set(store.get("closed", [])),
    alerts: store.get("alerts", false),
    data: {},
    loading: false,
    updatedAt: null,
    timer: null,
  };

  // =====================================================================
  // Helpers
  // =====================================================================
  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ymd(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
  function isoDate(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function sameDay(a, b) { return ymd(a) === ymd(b); }
  function isToday() { return sameDay(state.date, new Date()); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function dayLabel(d) {
    if (sameDay(d, new Date())) return "Today";
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function timeLabel(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
  function whenLabel(iso) {
    const d = new Date(iso), days = (startOfDay(d) - startOfDay(new Date())) / 864e5;
    const day = days === 0 ? "Today" : days === 1 ? "Tomorrow" : days < 7 ? d.toLocaleDateString(undefined, { weekday: "short" }) : d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    return day + " " + timeLabel(iso);
  }
  function favKey(lg, abbr) { return (lg.soccer ? "soccer" : lg.id) + ":" + abbr; }
  function isFavTeam(lg, abbr) { return state.favs.has(favKey(lg, abbr)); }
  function hexColor(c) { return c && /^[0-9a-f]{6}$/i.test(c) ? "#" + c : ""; }
  function clockSecs(c) { const [m, s] = String(c || "").split(":").map(Number); return isNaN(m) ? Infinity : m * 60 + (s || 0); }

  const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  const STAR_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" width="10" height="10"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const BOLT = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>';

  // =====================================================================
  // Normalize team-sport games
  // =====================================================================
  function normalize(ev, lg) {
    const comp = ev.competitions?.[0] || {};
    const st = ev.status || comp.status || {};
    const type = st.type || {};
    const teams = (comp.competitors || []).map(c => ({
      id: c.team?.id,
      abbr: c.team?.abbreviation || c.team?.shortDisplayName || "?",
      name: c.team?.shortDisplayName || c.team?.name || c.team?.displayName || "",
      full: c.team?.displayName || "",
      logo: c.team?.logo || c.team?.logos?.[0]?.href || "",
      color: hexColor(c.team?.color),
      score: c.score ?? "",
      winner: !!c.winner,
      homeAway: c.homeAway,
      record: c.records?.find(r => r.type === "total" || r.name === "overall")?.summary || c.records?.[0]?.summary || "",
      rank: c.curatedRank?.current && c.curatedRank.current <= 25 ? c.curatedRank.current : null,
    }));
    teams.sort((a, b) => (a.homeAway === "away" ? -1 : 1) - (b.homeAway === "away" ? -1 : 1));
    const gstate = type.state || "pre";
    const nets = [];
    (comp.geoBroadcasts || []).forEach(b => {
      const name = b.media?.shortName || b.media?.name;
      if (name) nets.push({ name, market: (b.market?.type || "national").toLowerCase() });
    });
    (comp.broadcasts || []).forEach(b => (b.names || []).forEach(name => {
      if (name && !nets.some(n => n.name === name)) nets.push({ name, market: (b.market || "national").toLowerCase() });
    }));
    const broadcast = nets.map(n => n.name).filter((v, i, a) => a.indexOf(v) === i).slice(0, 2).join(" / ");
    const odds = comp.odds?.[0];
    let status;
    if (gstate === "pre") {
      status = type.name === "STATUS_POSTPONED" ? "Postponed" : (type.completed ? type.shortDetail : timeLabel(ev.date));
    } else {
      status = type.shortDetail || type.detail || "";
      const p = st.period || 0, clk = st.displayClock;
      if (gstate === "in" && lg.label && clk && p && !/half|end|delay|susp|int/i.test(status)) {
        status = (p > lg.reg ? "OT" + (p - lg.reg > 1 ? p - lg.reg : "") : lg.label + p) + " " + clk;
      }
    }
    const g = {
      id: ev.id, lg, date: ev.date, state: gstate, status, teams, broadcast,
      link: ev.links?.find(l => (l.rel || []).includes("summary"))?.href || ev.links?.[0]?.href || "",
      watch: watchOptions(nets, lg),
      rankedClash: teams.length === 2 && teams.every(t => t.rank),
      note: comp.notes?.[0]?.headline || "",
      odds: odds ? { details: odds.details || "", ou: odds.overUnder } : null,
      sit: comp.situation || {}, period: st.period || 0, clock: st.displayClock || "",
    };
    g.close = isClose(g);
    Object.assign(g, interest(g));
    return g;
  }

  function isClose(g) {
    if (g.state !== "in" || g.teams.length !== 2) return false;
    const m = Math.abs((parseInt(g.teams[0].score) || 0) - (parseInt(g.teams[1].score) || 0));
    const p = g.period, r = CLOSE[g.lg.sport];
    if (!r) return false;
    if (g.lg.soccer) return m <= r.margin && (p > 2 || (parseInt(g.clock) || 0) >= r.fromMinute);
    if (g.lg.sport === "Baseball") return p >= r.fromInning && m <= r.margin;
    const last = g.lg.reg;
    if (p > last) return m <= r.margin; // overtime
    return p === last && clockSecs(g.clock) <= r.minsLeft * 60 && m <= r.margin;
  }

  // What makes a game worth flipping to
  function interest(g) {
    const reasons = [];
    let score = 0;
    const [a, h] = g.teams;
    if (!a || !h) return { hype: 0, reasons };
    const as = parseInt(a.score) || 0, hs = parseInt(h.score) || 0;
    const margin = Math.abs(as - hs);
    const reg = g.lg.soccer ? 2 : g.lg.reg;
    const secondHalf = g.lg.soccer ? g.period >= 2 : g.lg.sport === "Baseball" ? g.period >= 5 : g.period > reg / 2;
    const favAbbr = (g.odds?.details || "").match(/^([A-Z0-9&]{2,6})\s+-/)?.[1];
    if (g.state === "in") {
      score += 10;
      if (g.close) { score += 50; reasons.push("Close game"); }
      if (reg && g.period > reg) { score += 30; reasons.push(g.lg.sport === "Baseball" ? "Extra innings" : "Overtime"); }
      const leader = as > hs ? a : hs > as ? h : null;
      const favTeam = favAbbr ? g.teams.find(t => t.abbr === favAbbr) : null;
      const rankedFav = a.rank && !h.rank ? a : h.rank && !a.rank ? h : (a.rank && h.rank ? (a.rank < h.rank ? a : h) : null);
      const victim = favTeam || rankedFav;
      if (secondHalf && leader && victim && leader !== victim && margin > 0) {
        score += 40; reasons.push(victim.rank ? `Upset alert: No. ${victim.rank} trails` : "Upset alert");
      }
      if (g.rankedClash) { score += 20; reasons.push("Top 25 clash"); }
      if (!g.close && !reasons.length) score += Math.max(0, 15 - margin);
    } else if (g.state === "pre") {
      const mins = (new Date(g.date) - Date.now()) / 60000;
      if (mins <= 45 && mins > -15) { score += 8; reasons.push("Starting soon"); }
      if (g.rankedClash) { score += 6; reasons.push("Top 25 clash"); }
    }
    return { hype: score, reasons };
  }

  function watchOptions(nets, lg) {
    const out = [];
    const add = (o, net) => {
      const x = out.find(x => x.app === o.app);
      if (x) { if (!x.nets.includes(net)) x.nets.push(net); }
      else out.push({ app: o.app, url: o.url, nets: [net] });
    };
    nets.forEach(n => {
      const name = n.name.trim();
      const hit = WATCH.find(w => w.re.test(name));
      if (hit) return add(hit, name);
      if ((n.market === "home" || n.market === "away") && OUT_OF_MARKET[lg.id]) add(OUT_OF_MARKET[lg.id], name);
    });
    out.sort((a, b) => (b.app === "YouTube TV") - (a.app === "YouTube TV"));
    return out;
  }

  function watchPill(g) {
    if (g.state === "post" || !g.watch?.length) return g.broadcast && g.state !== "post" ? `<span class="net">${esc(g.broadcast)}</span>` : "";
    const [w, ...rest] = g.watch;
    const title = `${w.app}: ${w.nets.join(", ")}` + (rest.length ? ` · Also on ${rest.map(x => `${x.app} (${x.nets.join(", ")})`).join(", ")}` : "");
    return `<a class="watch" href="${esc(w.url)}" target="_blank" rel="noopener" title="${esc(title)}">${PLAY}<b>${esc(w.app)}</b>${w.nets[0].toLowerCase() === w.app.toLowerCase() ? "" : `<span>${esc(w.nets[0])}</span>`}${rest.length ? `<i>+${rest.length}</i>` : ""}</a>`;
  }

  // =====================================================================
  // Normalize leaderboards and events
  // =====================================================================
  function evState(ev) { return (ev.status || ev.competitions?.[0]?.status || {}).type || {}; }
  function str(v) { return v == null ? "" : typeof v === "object" ? (v.displayValue ?? v.value ?? "") : String(v); }

  function parseGolf(ev, lg) {
    const comp = ev.competitions?.[0] || {};
    const type = evState(ev);
    const rows = (comp.competitors || []).map((c, i) => {
      const ls = (c.linescores || []).filter(l => l && (l.value != null || l.displayValue));
      const today = ls.length ? ls[ls.length - 1] : null;
      const thruRaw = c.status?.thru ?? c.status?.hole;
      return {
        name: c.athlete?.displayName || c.athlete?.fullName || "",
        flag: c.athlete?.flag?.href || "",
        pos: c.status?.position?.displayName || c.position?.displayName || "",
        order: c.sortOrder ?? c.order ?? i + 1,
        total: str(c.score),
        today: today ? str(today.displayValue ?? today.value) : "",
        thru: thruRaw != null && thruRaw !== "" ? (+thruRaw >= 18 ? "F" : String(thruRaw)) : (c.status?.displayValue || ""),
      };
    }).filter(r => r.name).sort((a, b) => a.order - b.order);
    return { kind: "golf", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate,
      state: type.state || "pre", detail: type.detail || type.shortDetail || "", link: ev.links?.[0]?.href || "", rows };
  }

  function parseRace(ev, lg) {
    const sessions = (ev.competitions || []).map(c => ({
      abbr: c.type?.abbreviation || c.type?.text || "Session",
      date: c.date || ev.date,
      state: c.status?.type?.state || "pre",
      detail: c.status?.type?.shortDetail || "",
      top: (c.competitors || []).slice().sort((a, b) => (a.order || 99) - (b.order || 99)).slice(0, 3)
        .map(x => ({ name: x.athlete?.displayName || x.athlete?.shortName || "", flag: x.athlete?.flag?.href || "" })).filter(x => x.name),
    }));
    const type = evState(ev);
    const st = sessions.some(s => s.state === "in") ? "in" : (type.state || "pre");
    return { kind: "race", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", sessions };
  }

  function athleteRow(x) {
    return { name: x?.athlete?.displayName || x?.athlete?.shortName || x?.roster?.shortDisplayName || x?.team?.displayName || "",
      flag: x?.athlete?.flag?.href || "", winner: !!x?.winner,
      sets: (x?.linescores || []).map(l => l?.value).filter(v => v != null) };
  }

  function parseMma(ev, lg) {
    const fights = (ev.competitions || []).map(c => ({
      a: athleteRow(c.competitors?.[0]), b: athleteRow(c.competitors?.[1]),
      state: c.status?.type?.state || "pre", detail: c.status?.type?.shortDetail || c.status?.type?.detail || "",
      note: c.type?.abbreviation || c.note || "",
    })).filter(f => f.a.name && f.b.name);
    const type = evState(ev);
    const st = fights.some(f => f.state === "in") ? "in" : (type.state || "pre");
    return { kind: "mma", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", fights };
  }

  function parseTennis(ev, lg) {
    const comps = (ev.groupings || []).flatMap(gr => (gr.competitions || []).map(c => ({ c, group: gr.grouping?.displayName || "" })))
      .concat((ev.competitions || []).map(c => ({ c, group: "" })));
    const matches = comps.map(({ c, group }) => ({
      a: athleteRow(c.competitors?.[0]), b: athleteRow(c.competitors?.[1]),
      state: c.status?.type?.state || "pre", detail: c.status?.type?.shortDetail || "",
      round: c.round?.displayName || c.type?.text || group, date: c.date,
    })).filter(m => m.a.name && m.b.name);
    const ord = { in: 0, post: 1, pre: 2 };
    matches.sort((x, y) => (ord[x.state] - ord[y.state]) || (x.state === "post" ? new Date(y.date) - new Date(x.date) : new Date(x.date) - new Date(y.date)));
    const type = evState(ev);
    const st = matches.some(m => m.state === "in") ? "in" : (type.state || "pre");
    return { kind: "tennis", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", matches };
  }

  const PARSE = { golf: parseGolf, race: parseRace, mma: parseMma, tennis: parseTennis };

  // When viewing today, only keep events that are on now, starting soon, or just finished
  function relevant(e) {
    if (!isToday()) return true;
    const now = Date.now(), start = new Date(e.date).getTime();
    const end = e.end ? new Date(e.end).getTime() : start + 4 * 864e5;
    if (e.state === "in") return true;
    if (e.state === "pre") return start - now < 3 * 864e5;
    return now - end < 1.5 * 864e5;
  }

  // =====================================================================
  // Fetching
  // =====================================================================
  const topFlight = {};
  async function loadTopFlight(slug) {
    if (topFlight[slug]) return topFlight[slug];
    try {
      const j = await (await fetch(API + "soccer/" + slug + "/teams")).json();
      const ids = (j.sports?.[0]?.leagues?.[0]?.teams || []).map(t => t.team?.id).filter(Boolean);
      if (ids.length) topFlight[slug] = new Set(ids);
    } catch {}
    return topFlight[slug] || null;
  }

  async function loadLeague(lg) {
    if (lg.kind) {
      const url = API + lg.path + "/scoreboard" + (isToday() ? "" : "?dates=" + ymd(state.date));
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const special = (j.events || []).map(ev => { try { return PARSE[lg.kind](ev, lg); } catch { return null; } }).filter(Boolean).filter(relevant);
      return { events: [], special };
    }
    const r = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(state.date) + (lg.extra || ""), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    let games = (j.events || []).map(ev => normalize(ev, lg));
    if (lg.topFlight && games.length) {
      const set = await loadTopFlight(lg.topFlight);
      if (set) games = games.filter(g => g.teams.some(t => set.has(t.id)));
    }
    if (lg.id === "ncaaf" && games.length) {
      const p4 = new Set();
      await Promise.allSettled(P4_GROUPS.map(async gid => {
        const rr = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(state.date) + "&groups=" + gid + "&limit=100", { cache: "no-store" });
        if (rr.ok) ((await rr.json()).events || []).forEach(e => p4.add(e.id));
      }));
      games.forEach(g => g.p4 = p4.has(g.id));
    }
    return { events: games, special: [] };
  }

  async function loadAll() {
    if (state.loading) return;
    state.loading = true;
    document.getElementById("refresh").classList.add("spin");
    const results = await Promise.allSettled(LEAGUES.map(loadLeague));
    results.forEach((r, i) => {
      state.data[LEAGUES[i].id] = r.status === "fulfilled" ? r.value : { events: [], special: [], error: r.reason?.message || "failed" };
    });
    state.loading = false;
    state.updatedAt = new Date();
    document.getElementById("refresh").classList.remove("spin");
    if (isToday()) checkAlerts();
    render();
    schedule();
    refreshNext();
  }

  function schedule() {
    clearTimeout(state.timer);
    if (!isToday()) return;
    const anyLive = allGames().some(g => g.state === "in") || allSpecial().some(e => e.state === "in");
    state.timer = setTimeout(() => { if (!document.hidden) loadAll(); else schedule(); }, anyLive ? 30000 : 120000);
  }

  function allGames() { return TEAM_LEAGUES.flatMap(lg => state.data[lg.id]?.events || []).map(g => ({ ...g, fav: g.teams.some(t => isFavTeam(g.lg, t.abbr)) })); }
  function allSpecial() { return EVENT_LEAGUES.flatMap(lg => state.data[lg.id]?.special || []); }

  // =====================================================================
  // Team index, follow list, next game
  // =====================================================================
  const teamCache = {};
  async function loadTeams(lgId) {
    if (teamCache[lgId]) return teamCache[lgId];
    const cached = store.get("teams:" + lgId, null);
    if (cached && Date.now() - cached.t < 7 * 864e5) return (teamCache[lgId] = cached.list);
    const lg = LG[lgId];
    try {
      const j = await (await fetch(API + lg.path + "/teams?limit=1000")).json();
      const list = (j.sports?.[0]?.leagues?.[0]?.teams || []).map(x => x.team).filter(Boolean).map(t => ({
        lg: lgId, id: t.id, abbr: t.abbreviation || "", name: t.displayName || t.name || "", short: t.shortDisplayName || "",
        logo: t.logos?.[0]?.href || "", color: hexColor(t.color),
      })).filter(t => t.abbr && t.name);
      store.set("teams:" + lgId, { t: Date.now(), list });
      return (teamCache[lgId] = list);
    } catch { return []; }
  }

  function keyFor(t) { return favKey(LG[t.lg], t.abbr); }

  async function ensureMeta(keys) {
    for (const k of keys) {
      if (state.favMeta[k]) continue;
      const [prefix, abbr] = [k.slice(0, k.indexOf(":")), k.slice(k.indexOf(":") + 1)];
      const candidates = prefix === "soccer" ? [DEFAULT_META[k] || "epl", ...SOCCER_HOME] : [prefix];
      for (const lgId of [...new Set(candidates)]) {
        if (!LG[lgId]) continue;
        const hit = (await loadTeams(lgId)).find(t => t.abbr === abbr);
        if (hit) { state.favMeta[k] = { lg: lgId, id: hit.id, name: hit.name, logo: hit.logo, color: hit.color, abbr }; break; }
      }
    }
    store.set("favMeta", state.favMeta);
  }

  async function fetchNext(k) {
    const m = state.favMeta[k];
    if (!m) return;
    const lg = LG[m.lg];
    const parse = j => {
      const now = Date.now();
      const ev = (j.events || []).filter(e => new Date(e.date).getTime() > now - 4 * 3600e3)
        .filter(e => (e.competitions?.[0]?.status?.type?.state || "pre") !== "post")
        .sort((a, b) => new Date(a.date) - new Date(b.date))[0];
      if (!ev) return null;
      const cs = ev.competitions?.[0]?.competitors || [];
      const me = cs.find(c => String(c.team?.id || c.id) === String(m.id));
      const opp = cs.find(c => c !== me);
      return { date: ev.date, opp: opp?.team?.abbreviation || opp?.team?.shortDisplayName || "TBD",
        oppLogo: opp?.team?.logos?.[0]?.href || opp?.team?.logo || "", at: me?.homeAway === "away" ? "@" : "vs" };
    };
    let found = null;
    try {
      found = parse(await (await fetch(API + lg.path + "/teams/" + m.id + "/schedule")).json());
      if (!found && !lg.soccer) found = parse(await (await fetch(API + lg.path + "/teams/" + m.id + "/schedule?seasontype=3")).json());
    } catch {}
    state.next[k] = found ? { t: Date.now(), ...found } : { t: Date.now(), none: true };
  }

  async function refreshNext() {
    if (!isToday()) return;
    const playing = new Set(allGames().flatMap(g => g.teams.map(t => favKey(g.lg, t.abbr))));
    const todo = [...state.favs].filter(k => !playing.has(k))
      .filter(k => { const c = state.next[k]; return !c || Date.now() - c.t > 3 * 3600e3 || (c.date && new Date(c.date) < Date.now() - 4 * 3600e3); });
    if (!todo.length) return;
    await ensureMeta(todo);
    await Promise.allSettled(todo.map(fetchNext));
    store.set("next", state.next);
    render();
  }

  function toggleFav(k, meta) {
    if (state.favs.has(k)) { state.favs.delete(k); }
    else {
      state.favs.add(k);
      if (meta) { state.favMeta[k] = meta; store.set("favMeta", state.favMeta); }
      delete state.next[k];
    }
    store.set("favs", [...state.favs]);
    render();
    renderSheet();
    refreshNext();
  }

  // =====================================================================
  // Alerts
  // =====================================================================
  const seen = new Set();
  let primed = false;
  function triggers(g) {
    const out = [];
    if (g.close) out.push("close");
    g.reasons.forEach(r => { if (/Overtime|Extra/.test(r)) out.push("ot"); if (/Upset/.test(r)) out.push("upset"); });
    return out;
  }
  function checkAlerts() {
    allGames().filter(g => g.state === "in").forEach(g => {
      triggers(g).forEach(tr => {
        const k = g.id + ":" + tr;
        if (seen.has(k)) return;
        seen.add(k);
        if (primed && state.alerts) fireAlert(g, tr, k);
      });
    });
    primed = true;
  }
  function fireAlert(g, tr, tagKey) {
    const [a, h] = g.teams;
    const title = tr === "close" ? "Close game" : tr === "ot" ? (g.lg.sport === "Baseball" ? "Extra innings" : "Overtime") : (g.reasons.find(r => /Upset/.test(r)) || "Upset alert");
    const line = `${a.abbr} ${a.score}, ${h.abbr} ${h.score} · ${g.status}`;
    const where = g.watch?.[0] ? `Watch on ${g.watch[0].app}` : (g.lg.short || g.lg.name);
    toast(title, line, where, g.link, tr === "upset");
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        const opts = { body: `${line}\n${where}`, tag: tagKey, data: { url: g.link || location.href } };
        (navigator.serviceWorker?.getRegistration?.() || Promise.resolve(null))
          .then(reg => reg ? reg.showNotification(title, opts) : new Notification(title, opts))
          .catch(() => {});
      }
    } catch {}
  }
  function toast(title, line, sub, link, hot) {
    const box = document.getElementById("toasts");
    const el = document.createElement(link ? "a" : "div");
    el.className = "toast" + (hot ? " hot" : "");
    if (link) { el.href = link; el.target = "_blank"; el.rel = "noopener"; }
    el.innerHTML = `<b>${esc(title)}</b><span>${esc(line)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}`;
    box.prepend(el);
    setTimeout(() => el.remove(), 9000);
  }

  // =====================================================================
  // Rendering: pieces
  // =====================================================================
  function starBtn(lg, t, extraClass = "") {
    const k = favKey(lg, t.abbr), on = state.favs.has(k);
    const meta = esc(JSON.stringify({ lg: lg.id, id: t.id, name: t.full || t.name, logo: t.logo, color: t.color, abbr: t.abbr }));
    return `<button class="star ${extraClass} ${on ? "on" : ""}" data-fav="${esc(k)}" data-meta="${meta}" title="${on ? "Unfollow" : "Follow"} ${esc(t.name)}" aria-label="${on ? "Unfollow" : "Follow"} ${esc(t.name)}">${on ? STAR : STAR_O}</button>`;
  }
  function statusClass(g) { return g.state === "in" ? "live" : g.state === "post" ? "final" : ""; }

  function situation(g) {
    const s = g.sit;
    if (g.state !== "in" || !s) return "";
    if (g.lg.sport === "Baseball" && s.outs != null) {
      const bases = `<svg class="diamond" viewBox="0 0 26 22" aria-label="Runners on base">
        <rect x="9.5" y="1.5" width="7" height="7" transform="rotate(45 13 5)" class="${s.onSecond ? "on" : ""}"/>
        <rect x="16.5" y="8.5" width="7" height="7" transform="rotate(45 20 12)" class="${s.onFirst ? "on" : ""}"/>
        <rect x="2.5" y="8.5" width="7" height="7" transform="rotate(45 6 12)" class="${s.onThird ? "on" : ""}"/></svg>`;
      const outs = `<span class="outs" aria-label="${s.outs} outs">${[0, 1, 2].map(i => `<i class="${i < s.outs ? "on" : ""}"></i>`).join("")}</span>`;
      return `${bases}${outs}${s.balls != null ? `<span>${s.balls}-${s.strikes}</span>` : ""}`;
    }
    if (g.lg.sport === "Football" && s.downDistanceText) {
      return `${s.isRedZone ? '<span class="tag hot">Red zone</span>' : ""}<span>${esc(s.downDistanceText)}</span>`;
    }
    return "";
  }

  function tagsFor(g, { includeClose = true } = {}) {
    return (g.reasons || []).filter(r => includeClose || r !== "Close game")
      .map(r => `<span class="tag ${/Upset/.test(r) ? "hot" : /Starting/.test(r) ? "cool" : ""}">${esc(r)}</span>`).join("");
  }

  // Compact row (Sofascore)
  function compactRow(g) {
    const [a, h] = g.teams;
    if (!a || !h) return "";
    const lose = (t, o) => g.state === "post" && o.winner && !t.winner;
    const trailing = (t, o) => g.state === "in" && (+t.score) < (+o.score);
    const st = g.state === "pre" ? (g.status === timeLabel(g.date) ? "" : g.status) : g.status;
    const team = (t, o, at) => `<div class="tt ${lose(t, o) ? "lose" : ""}">
        <i class="stripe" style="--tc:${esc(t.color || "")}"></i>
        ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ""}
        <span class="nm" title="${esc(t.full)}">${at ? "@ " : ""}${t.rank ? `<span class="rk">${t.rank}</span> ` : ""}${esc(t.name)}</span>
        ${g.state === "in" && g.sit?.possession && g.sit.possession === t.id ? '<i class="poss" title="Possession"></i>' : ""}
        ${starBtn(g.lg, t)}
      </div>`;
    const scores = g.state === "pre" ? "<span></span>" :
      `<div class="t-sc ${g.state === "in" ? "live" : ""}"><span class="${lose(a, h) || trailing(a, h) ? "lose" : ""}">${esc(a.score)}</span><span class="${lose(h, a) || trailing(h, a) ? "lose" : ""}">${esc(h.score)}</span></div>`;
    const extras = [situation(g), g.state !== "post" ? watchPill(g) : ""].filter(Boolean).join("");
    return `<div class="t ${g.fav ? "fav" : ""}">
      <div class="t-time"><span>${esc(timeLabel(g.date))}</span><span class="st ${statusClass(g)}">${esc(st || "–")}</span></div>
      <div class="t-teams">${team(a, h, false)}${team(h, a, true)}${extras ? `<div class="t-extra">${extras}</div>` : ""}</div>
      ${scores}
      ${g.link ? `<a class="t-go" href="${esc(g.link)}" target="_blank" rel="noopener" aria-label="Open Gamecast">${ARROW}</a>` : "<span></span>"}
    </div>`;
  }

  // Expanded row (Apple Sports)
  function expandedRow(g, showTags = false) {
    const [a, h] = g.teams;
    if (!a || !h) return "";
    const side = t => `<div class="f-team ${t.homeAway === "home" ? "home" : ""} ${isFavTeam(g.lg, t.abbr) ? "fav" : ""}">${starBtn(g.lg, t)}
        ${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ""}<i class="bar2" style="--tc:${esc(t.color || "")}"></i><span class="nm">${t.rank ? t.rank + " " : ""}${esc(t.name)}</span></div>`;
    const score = (t, o) => {
      if (g.state === "pre") return `<div class="f-sc rec">${esc(t.record)}</div>`;
      const lose = (g.state === "post" && o.winner && !t.winner) || (g.state === "in" && (+t.score) < (+o.score));
      return `<div class="f-sc ${lose ? "lose" : ""}">${esc(t.score)}</div>`;
    };
    let sub = situation(g);
    if (!sub && g.state === "pre" && g.odds?.details) sub = esc(g.odds.details);
    const lgLabel = (g.lg.short || g.lg.name) + (g.note ? " · " + g.note : "");
    const tags = showTags === true ? tagsFor(g) : "";
    const sClass = g.state === "in" ? "live" : g.state === "pre" ? "pre" : "";
    return `<div class="f">
      <div class="f-lg">${esc(lgLabel)}</div>${tags ? `<div class="f-why">${tags}</div>` : ""}
      <div class="f-grid">
        ${side(a)}${score(a, h)}
        <div class="f-mid"><span class="s ${sClass}">${esc(g.status)}</span>${sub ? `<span class="sub">${sub}</span>` : ""}</div>
        ${score(h, a)}${side(h)}
      </div>
      <div class="f-act">${g.state !== "post" ? watchPill(g) : ""}${g.link ? `<a class="f-link" href="${esc(g.link)}" target="_blank" rel="noopener">Gamecast</a>` : ""}</div>
    </div>`;
  }

  function groupedList(list, rowFn) {
    const sorted = list.slice().sort((x, y) => (new Date(x.date) - new Date(y.date)) || x.lg.id.localeCompare(y.lg.id));
    const groups = [];
    sorted.forEach(g => {
      const last = groups[groups.length - 1];
      if (last && last.lg.id === g.lg.id) last.games.push(g); else groups.push({ lg: g.lg, games: [g] });
    });
    return groups.map(gr => {
      const note = gr.games[0].note && gr.games.every(x => x.note === gr.games[0].note) ? " · " + gr.games[0].note : "";
      return `<div class="tl-group">
        <div class="tl-head"><span class="tl-badge">${esc(gr.lg.short || gr.lg.name)}</span>
          <span class="crumb">${esc(gr.lg.sport)} <span>› ${esc(gr.lg.name)}${esc(note)}</span></span></div>
        ${rowFn === expandedRow ? `<div class="feat">${gr.games.map(g => expandedRow(g)).join("")}</div>` : gr.games.map(g => rowFn(g)).join("")}
      </div>`;
    }).join("");
  }

  function stripChip(g) {
    const [a, h] = g.teams;
    if (!a || !h) return "";
    const side = (t, o) => {
      const lose = g.state !== "pre" && ((g.state === "post" && o.winner && !t.winner) || (g.state === "in" && (+t.score) < (+o.score)));
      return `<span class="ms-t ${lose ? "lose" : ""}"><i class="stripe" style="--tc:${esc(t.color || "")};height:14px"></i>${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ""}<b>${esc(t.abbr)}</b>${g.state === "pre" ? "" : `<em>${esc(t.score)}</em>`}</span>`;
    };
    return `<a class="ms ${g.state === "in" ? "live" : ""}" href="${esc(g.link || "#")}" target="_blank" rel="noopener" title="${esc(a.full + " at " + h.full)}">
      <span class="ms-teams">${side(a, h)}${side(h, a)}</span><span class="ms-s">${esc(g.status)}</span></a>`;
  }

  function nextChip(k) {
    const m = state.favMeta[k], n = state.next[k];
    if (!m || !n || n.none || !n.date) return "";
    return `<div class="ms next" title="${esc(m.name)}: next game">
      <span class="ms-teams"><span class="ms-t"><i class="stripe" style="--tc:${esc(m.color || "")};height:14px"></i>${m.logo ? `<img src="${esc(m.logo)}" alt="">` : ""}<b>${esc(m.abbr || k.split(":")[1])}</b></span></span>
      <span class="ms-s"><small>Next</small>${esc(whenLabel(n.date))}<span style="color:var(--muted)">${esc(n.at)} ${esc(n.opp)}</span></span></div>`;
  }

  // Leaderboards & events
  function toPar(v) { const s = String(v ?? ""); return s.startsWith("-") ? "under" : ""; }
  function golfBlock(e) {
    const rows = e.rows.slice(0, 10);
    const leadTotal = rows[0]?.total;
    const body = rows.length ? `<div class="lb-wrap"><table class="lb">
      <thead><tr><th>Pos</th><th>Player</th><th class="num">Total</th><th class="num">Today</th><th class="num">Thru</th></tr></thead>
      <tbody>${rows.map(r => {
        const hot = /^-\d/.test(r.today) && parseInt(r.today) <= -5;
        return `<tr class="${r.total && r.total === leadTotal ? "lead" : ""}">
          <td class="pos">${esc(r.pos || "–")}</td>
          <td><span class="pl">${r.flag ? `<img src="${esc(r.flag)}" alt="">` : ""}${esc(r.name)}${hot ? ' <span class="tag hot">Hot</span>' : ""}</span></td>
          <td class="num ${toPar(r.total)}">${esc(r.total || "–")}</td>
          <td class="num ${toPar(r.today)}">${esc(r.today || "–")}</td>
          <td class="num">${esc(r.thru || "–")}</td></tr>`;
      }).join("")}</tbody></table></div>` : `<div class="empty">Tee times aren't posted yet.</div>`;
    const more = e.link ? `<div class="f-act" style="padding-bottom:12px"><a class="f-link" href="${esc(e.link)}" target="_blank" rel="noopener">Full leaderboard</a></div>` : "";
    return block("ev-" + e.lg.id + e.id, `${e.lg.short || e.lg.name} · ${e.name}`, eventMeta(e), body + more, `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 18V3l7 3-7 3"/><ellipse cx="12" cy="19" rx="6" ry="2"/></svg>`);
  }
  function eventMeta(e) {
    if (e.state === "in") return e.detail || "Live";
    if (e.state === "pre") return "Starts " + whenLabel(e.date);
    return e.detail || "Final";
  }
  function raceBlock(e) {
    const body = e.sessions.map(s => `<div class="ev ${s.state === "in" ? "is-live" : ""}">
      <span class="lbl">${esc(s.abbr)}</span>
      <span class="main">${s.top.length ? s.top.map((p, i) => `<span class="ln ${i === 0 && s.state === "post" ? "win" : ""}"><span>${i + 1}. ${p.flag ? `<img src="${esc(p.flag)}" alt=""> ` : ""}${esc(p.name)}</span></span>`).join("") : `<span class="ln"><span style="color:var(--muted)">${esc(whenLabel(s.date))}</span></span>`}</span>
      <span class="right ${s.state === "in" ? "live" : ""}">${esc(s.state === "pre" ? "" : (s.detail || (s.state === "post" ? "Final" : "Live")))}</span></div>`).join("");
    return block("ev-" + e.lg.id + e.id, `${e.lg.short || e.lg.name} · ${e.name}`, eventMeta(e), body || `<div class="empty">Schedule coming soon.</div>`);
  }
  function duelRows(list, showSets) {
    return list.map(m => {
      const line = (p) => `<span class="ln ${m.state === "post" ? (p.winner ? "win" : "lose") : ""}">${p.flag ? `<img src="${esc(p.flag)}" alt="">` : ""}<span>${esc(p.name)}</span>${showSets && p.sets.length ? `<span class="sets">${p.sets.map(v => `<b>${esc(v)}</b>`).join("")}</span>` : ""}</span>`;
      return `<div class="ev ${m.state === "in" ? "is-live" : ""}">
        <span class="lbl">${esc(m.round || m.note || "")}</span>
        <span class="main">${line(m.a)}${line(m.b)}</span>
        <span class="right ${m.state === "in" ? "live" : ""}">${esc(m.state === "pre" && m.date ? whenLabel(m.date) : (m.detail || ""))}</span></div>`;
    }).join("");
  }
  function mmaBlock(e) {
    // ESPN lists prelims first; the main event is last
    const fights = e.fights.slice(-6).reverse();
    return block("ev-" + e.lg.id + e.id, `UFC · ${e.name}`, eventMeta(e), duelRows(fights, false) || `<div class="empty">Fight card coming soon.</div>`);
  }
  function tennisBlock(e) {
    const ms = e.matches.slice(0, 8);
    if (!ms.length) return "";
    return block("ev-" + e.lg.id + e.id, `${e.lg.short || e.lg.name} · ${e.name}`, eventMeta(e), duelRows(ms, true));
  }
  const BLOCK = { golf: golfBlock, race: raceBlock, mma: mmaBlock, tennis: tennisBlock };

  function block(id, title, meta, body, icon) {
    const closed = state.closed.has(id);
    return `<section class="block ${closed ? "closed" : ""}" data-block="${esc(id)}">
      <div class="bhead">${icon || ""}<h2>${esc(title)}</h2>${meta ? `<span class="meta">${esc(meta)}</span>` : ""}
        <button class="tog" data-tog="${esc(id)}" aria-expanded="${!closed}" aria-label="${closed ? "Expand" : "Collapse"} ${esc(title)}">${CHEV}</button></div>
      <div class="bbody">${body}</div></section>`;
  }

  // =====================================================================
  // Rendering: page
  // =====================================================================
  function renderDates() {
    const nav = document.getElementById("dates");
    const days = [];
    for (let i = -3; i <= 3; i++) days.push(addDays(state.date, i));
    nav.innerHTML = days.map(d => `<button class="d ${sameDay(d, state.date) ? "on" : ""}">${esc(dayLabel(d))}</button>`).join("") +
      `<label class="iconbtn" title="Pick a date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><input type="date" id="datepick" aria-label="Pick a date" value="${isoDate(state.date)}"></label>`;
    nav.querySelectorAll("button.d").forEach((b, i) => b.onclick = () => setDate(days[i]));
    nav.querySelector("#datepick").addEventListener("change", e => {
      const [y, m, d] = e.target.value.split("-").map(Number);
      if (y) setDate(new Date(y, m - 1, d));
    });
    const on = nav.querySelector(".on");
    if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function poolFor(tab, games) {
    switch (tab) {
      case "live": return games.filter(g => g.state === "in");
      case "all": return games;
      case "close": return games.filter(g => g.close);
      case "cfb25": return games.filter(g => g.lg.id === "ncaaf" && g.teams.some(t => t.rank));
      case "p4": return games.filter(g => g.lg.id === "ncaaf" && g.p4);
      default: return games.filter(g => g.lg.id === tab);
    }
  }
  function specialsFor(tab) {
    const all = allSpecial();
    if (tab === "all") return all;
    if (tab === "live") return all.filter(e => e.state === "in");
    if (LG[tab]?.kind) return all.filter(e => e.lg.id === tab);
    return [];
  }

  function renderTabs(games) {
    const el = document.getElementById("tabs");
    const counts = {};
    games.forEach(g => counts[g.lg.id] = (counts[g.lg.id] || 0) + 1);
    allSpecial().forEach(e => counts[e.lg.id] = (counts[e.lg.id] || 0) + 1);
    const liveN = games.filter(g => g.state === "in").length + allSpecial().filter(e => e.state === "in").length;
    const closeN = games.filter(g => g.close).length;
    const chips = [
      { id: "live", label: "Live", n: liveN, hot: liveN > 0, cls: "livechip" },
      { id: "all", label: "All" },
      { id: "close", label: "Close games", n: closeN, hot: closeN > 0 },
    ];
    const cfb = games.filter(g => g.lg.id === "ncaaf");
    LEAGUES.filter(lg => (MAIN_TABS.includes(lg.id) && counts[lg.id] > 0) || state.tab === lg.id).forEach(lg => {
      chips.push({ id: lg.id, label: lg.short || lg.name, n: counts[lg.id] || 0 });
      if (lg.id === "ncaaf") {
        chips.push({ id: "cfb25", label: "CFB Top 25", n: cfb.filter(g => g.teams.some(t => t.rank)).length });
        chips.push({ id: "p4", label: "Power 4", n: cfb.filter(g => g.p4).length });
      }
    });
    if (["cfb25", "p4"].includes(state.tab) && !chips.some(c => c.id === state.tab))
      chips.push({ id: state.tab, label: state.tab === "p4" ? "Power 4" : "CFB Top 25", n: 0 });
    el.innerHTML = chips.map(c =>
      `<button class="chip ${c.cls || ""} ${state.tab === c.id ? "on" : ""} ${c.hot ? "hot" : ""}" role="tab" aria-selected="${state.tab === c.id}" data-id="${c.id}">${esc(c.label)}${c.n != null ? `<span class="n">${c.n}</span>` : ""}</button>`).join("");
    el.querySelectorAll("button").forEach(b => b.onclick = () => { state.tab = b.dataset.id; store.set("tab2", state.tab); render(); });
  }

  function render() {
    const vb = document.getElementById("viewbtn");
    vb.classList.toggle("expanded", state.view === "expanded");
    vb.title = state.view === "expanded" ? "Expanded view (tap for compact)" : "Compact view (tap for expanded)";
    const ab = document.getElementById("alertbtn");
    ab.setAttribute("aria-pressed", state.alerts);
    ab.title = state.alerts ? "Close-game alerts are on" : "Close-game alerts are off";
    renderDates();
    const games = allGames();
    renderTabs(games);
    const main = document.getElementById("main");
    const liveN = games.filter(g => g.state === "in").length;
    document.getElementById("livebug").hidden = liveN === 0;
    document.getElementById("liven").textContent = liveN;

    if (LEAGUES.every(lg => state.data[lg.id]?.error)) {
      main.innerHTML = `<div class="block err">Couldn't reach the scores feed. Check your internet connection, then tap refresh.</div>`;
      return;
    }

    const tab = state.tab;
    const pool = poolFor(tab, games);
    const rowFn = state.view === "expanded" ? expandedRow : compactRow;
    let html = "";

    // Your teams strip: today's games plus the next game for everyone else
    if (["live", "all"].includes(tab)) {
      const mine = games.filter(g => g.fav).sort((a, b) => ({ in: 0, pre: 1, post: 2 }[a.state] - { in: 0, pre: 1, post: 2 }[b.state]) || new Date(a.date) - new Date(b.date));
      const playing = new Set(mine.flatMap(g => g.teams.map(t => favKey(g.lg, t.abbr))));
      const nexts = isToday() ? [...state.favs].filter(k => !playing.has(k) && state.next[k]?.date)
        .sort((a, b) => new Date(state.next[a].date) - new Date(state.next[b].date)) : [];
      html += `<div class="mystrip" aria-label="Your teams">${mine.map(stripChip).join("")}${nexts.map(nextChip).join("")}<button class="ms add" data-open-sheet>${state.favs.size ? "+ Teams" : "+ Follow teams"}</button></div>`;
    }

    // Worth watching: games without your teams, ranked by how much they're worth flipping to
    let shown = new Set();
    if (["live", "all"].includes(tab) && (isToday() || games.some(g => g.state === "in"))) {
      let picks = games.filter(g => !g.fav && g.hype > 0 && g.state !== "post").sort((x, y) => y.hype - x.hype);
      const strong = picks.filter(g => g.reasons.length && g.reasons.some(r => r !== "Starting soon") || g.state === "in" && g.reasons.length);
      picks = (strong.length >= 2 ? strong : picks).slice(0, tab === "live" ? 4 : 6);
      if (picks.length >= 1 && (tab === "all" || picks.some(g => g.state === "in"))) {
        if (tab === "live") shown = new Set(picks.map(g => g.id));
        html += block("worth", "Worth Watching", strong.length ? `${strong.length} worth a look` : "best of what's on",
          `<div class="feat">${picks.map(g => expandedRow(g, true)).join("")}</div>`, BOLT);
      }
    }

    // Golf, F1, UFC, tennis
    specialsFor(tab).forEach(e => { html += BLOCK[e.kind](e); });

    // The feed
    const quiet = [];
    TEAM_LEAGUES.forEach(lg => { if (!pool.some(g => g.lg.id === lg.id) && !state.data[lg.id]?.error && !state.data[lg.id]?.events?.length) quiet.push(lg.short || lg.name); });
    const feed = pool.filter(g => !shown.has(g.id));
    if (feed.length) {
      const live = feed.filter(g => g.state === "in").length;
      const title = tab === "live" ? (shown.size ? "Also live" : "Live now") : tab === "close" ? "Close games" : dayLabel(state.date);
      html += block("feed", title, live && tab !== "live" ? `${live} live · ${feed.length} total` : `${feed.length} game${feed.length > 1 ? "s" : ""}`, groupedList(feed, rowFn));
    } else if (tab === "live" && !shown.size) {
      const upcoming = games.filter(g => g.state === "pre").sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 8);
      html += `<div class="block empty">Nothing live right now.${upcoming.length ? " Here's what's up next." : ""}</div>`;
      if (upcoming.length) html += block("upnext", "Up next", `${upcoming.length} games`, groupedList(upcoming, rowFn));
    } else if (tab === "close") {
      html += `<div class="block empty">No close games right now. Games show up here late with a tight score: under 5:00 in the 4th or 3rd, the 7th inning or later in baseball, or the 85th minute in soccer.</div>`;
    } else if (!specialsFor(tab).length) {
      html += `<div class="block empty">No games on ${esc(dayLabel(state.date))}.</div>`;
    }
    if (tab === "all" && quiet.length) html += `<p class="quiet">Off ${isToday() ? "today" : "this day"}: ${esc(quiet.join(", "))}</p>`;
    if (state.updatedAt) html += `<p class="updated">Updated ${state.updatedAt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" })}${isToday() ? " · refreshes automatically" : ""}</p>`;
    main.innerHTML = html;
  }

  // =====================================================================
  // Team search sheet
  // =====================================================================
  let index = null, results = [];
  async function openSheet() {
    document.getElementById("sheet").hidden = false;
    const q = document.getElementById("q");
    setTimeout(() => q.focus(), 50);
    renderSheet();
    ensureMeta([...state.favs]).then(renderSheet);
    if (!index) {
      document.getElementById("results").innerHTML = '<p class="hint">Loading teams…</p>';
      const lists = await Promise.all(SEARCHABLE.map(loadTeams));
      index = lists.flat();
      search();
    }
  }
  function closeSheet() { document.getElementById("sheet").hidden = true; }
  function resRow(t, i, list) {
    const k = keyFor(t), on = state.favs.has(k);
    return `<div class="res-row"><i class="stripe" style="--tc:${esc(t.color || "")}"></i>${t.logo ? `<img src="${esc(t.logo)}" alt="">` : "<span></span>"}
      <span class="nm">${esc(t.name)}<small>${esc(LG[t.lg].short || LG[t.lg].name)}</small></span>
      <button class="follow ${on ? "on" : ""}" data-list="${list}" data-i="${i}">${on ? "Following" : "Follow"}</button></div>`;
  }
  function search() {
    const el = document.getElementById("results");
    const q = document.getElementById("q").value.trim().toLowerCase();
    if (!index) return;
    if (!q) { results = []; el.innerHTML = '<p class="hint">Type a team, city or school. Covers the NFL, MLB, NBA, WNBA, NHL, college football and hoops, and the major soccer leagues.</p>'; return; }
    results = index.map(t => {
      const hay = [t.name, t.short, t.abbr].join(" ").toLowerCase();
      const s = t.abbr.toLowerCase() === q ? 0 : t.name.toLowerCase().startsWith(q) || t.short.toLowerCase().startsWith(q) ? 1 : hay.split(/\s+/).some(w => w.startsWith(q)) ? 2 : hay.includes(q) ? 3 : 9;
      return { t, s };
    }).filter(x => x.s < 9).sort((a, b) => a.s - b.s || (LG[a.t.lg].college ? 1 : 0) - (LG[b.t.lg].college ? 1 : 0)).slice(0, 25).map(x => x.t);
    el.innerHTML = results.length ? results.map((t, i) => resRow(t, i, "r")).join("") : '<p class="hint">No teams match that.</p>';
  }
  let following = [];
  function renderSheet() {
    following = [...state.favs].map(k => {
      const m = state.favMeta[k];
      return m ? { lg: m.lg, id: m.id, abbr: m.abbr || k.split(":")[1], name: m.name, short: "", logo: m.logo, color: m.color }
        : { lg: DEFAULT_META[k] || k.split(":")[0], id: null, abbr: k.split(":")[1], name: k.split(":")[1], short: "", logo: "", color: "" };
    }).filter(t => LG[t.lg]);
    document.getElementById("following").innerHTML = following.length ? following.map((t, i) => resRow(t, i, "f")).join("") : '<p class="hint">Not following anyone yet.</p>';
    if (index) search();
  }

  // =====================================================================
  // Events
  // =====================================================================
  function setDate(d) {
    state.date = startOfDay(d);
    state.data = {};
    primed = false;
    document.getElementById("main").innerHTML = '<div class="skel"></div><div class="skel"></div>';
    renderDates();
    loadAll();
  }

  document.getElementById("main").addEventListener("click", e => {
    const fav = e.target.closest("[data-fav]");
    if (fav) {
      let meta = null;
      try { meta = JSON.parse(fav.dataset.meta || "null"); } catch {}
      toggleFav(fav.dataset.fav, meta);
      return;
    }
    if (e.target.closest("[data-open-sheet]")) { openSheet(); return; }
    const tog = e.target.closest("[data-tog]");
    if (tog) {
      const id = tog.dataset.tog;
      state.closed.has(id) ? state.closed.delete(id) : state.closed.add(id);
      store.set("closed", [...state.closed]);
      render();
    }
  });
  document.getElementById("sheet").addEventListener("click", e => {
    if (e.target.id === "sheet") return closeSheet();
    const b = e.target.closest(".follow");
    if (!b) return;
    const t = (b.dataset.list === "r" ? results : following)[+b.dataset.i];
    if (!t) return;
    toggleFav(keyFor(t), { lg: t.lg, id: t.id, name: t.name, logo: t.logo, color: t.color, abbr: t.abbr });
  });
  document.getElementById("sheet-x").onclick = closeSheet;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  document.getElementById("q").addEventListener("input", search);
  document.getElementById("teamsbtn").onclick = openSheet;
  document.getElementById("refresh").onclick = () => loadAll();
  document.getElementById("viewbtn").onclick = () => {
    state.view = state.view === "expanded" ? "compact" : "expanded"; store.set("view2", state.view); render();
    toast(state.view === "expanded" ? "Expanded view" : "Compact view", state.view === "expanded" ? "Big scoreboard rows" : "Dense list, sorted by start time", "");
  };
  document.getElementById("alertbtn").onclick = async () => {
    state.alerts = !state.alerts;
    store.set("alerts", state.alerts);
    render();
    if (state.alerts) {
      try { if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); } catch {}
      toast("Alerts on", "You'll get a heads-up when a game turns close, goes to overtime, or an upset starts brewing.", "Works while Scores is open");
    } else {
      toast("Alerts off", "No more heads-ups for close games.", "");
    }
  };
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && isToday() && state.updatedAt && Date.now() - state.updatedAt > 25000) loadAll();
  });
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  renderDates();
  loadAll();
})();
</script>
</body>
</html>
