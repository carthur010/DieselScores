  ];
  const LG = Object.fromEntries(LEAGUES.map(l => [l.id, l]));
  const TEAM_LEAGUES = LEAGUES.filter(l => !l.kind);
  const EVENT_LEAGUES = LEAGUES.filter(l => l.kind);
  const SEARCHABLE = ["nfl", "mlb", "nba", "wnba", "nhl", "epl", "wsl", "laliga", "seriea", "bund", "ligue1", "mls", "nwsl", "ncaaf", "ncaam", "ncaaw"];
  const SOCCER_HOME = ["epl", "wsl", "laliga", "seriea", "bund", "ligue1", "mls", "nwsl"];
  const P4_GROUPS = [1, 4, 5, 8];
  // Leagues that get their own tab. Everything else lives under All.
  const MAIN_TABS = ["nfl", "ncaaf", "mlb", "nba", "nhl", "epl", "pga"]; // ESPN conference ids: ACC, Big 12, Big Ten, SEC

  // "Close game" rules by sport. lastPeriod comes from the league's regulation length.
  const CLOSE = {
    Basketball: { minsLeft: 5, margin: 6 },
    Football:   { minsLeft: 5, margin: 8 },
    Hockey:     { minsLeft: 5, margin: 1 },
    Baseball:   { fromInning: 7, margin: 2 },
    Soccer:     { fromMinute: 85, margin: 1 },
  };

  // Where to watch. Your setup: YouTube TV + every streaming app. First match wins.
  const WATCH = [
    { re: /^(MSG|MSG ?2|MSGSN|MSG Sportsnet|MSG\+|YES|YES Network)$/i, app: "Gotham Sports", url: "https://gothamsports.com/" },
    { re: /^(ABC|CBS|NBC|FOX|CW|The CW|ESPN|ESPN2|ESPNU|ESPNEWS|SECN|SEC Network|SECN\+?|ACCN|ACC Network|BTN|Big Ten Network|FS1|FS2|TNT|TBS|truTV|NFL ?Net(work)?|NFLN|MLB ?Net(work)?|MLBN|NBA ?TV|NHL ?Net(work)?|CBSSN|CBS Sports Network|USA|USA Net(work)?|Golf|Golf Channel|Telemundo|Universo|Univision|UniMás|TUDN|Galavisión|ION|SNY|SportsNet NY)$/i, app: "YouTube TV", url: "https://tv.youtube.com/" },
    { re: /ESPN\+|ESPN Unlimited|ESPN App|ESPN Deportes\+/i, app: "ESPN app", url: "https://www.espn.com/watch/" },
    { re: /Peacock/i, app: "Peacock", url: "https://www.peacocktv.com/sports" },
    { re: /Paramount\+|Paramount Plus|CBS Sports Golazo/i, app: "Paramount+", url: "https://www.paramountplus.com/live-tv/" },
    { re: /Prime Video|Amazon|Prime/i, app: "Prime Video", url: "https://www.primevideo.com/" },
    { re: /Apple TV|MLS Season Pass|MLS Pass/i, app: "Apple TV", url: "https://tv.apple.com/" },
    { re: /Netflix/i, app: "Netflix", url: "https://www.netflix.com/" },
    { re: /^(Max|HBO Max|truTV Max)$/i, app: "HBO Max", url: "https://play.hbomax.com/" },
    { re: /Fox One|FOX One|Fox Nation/i, app: "Fox One", url: "https://www.foxone.com/" },
    { re: /DAZN/i, app: "DAZN", url: "https://www.dazn.com/" },
    { re: /NBA League Pass/i, app: "NBA League Pass", url: "https://www.nba.com/watch/league-pass-stream" },
    { re: /MLB\.?TV/i, app: "MLB.TV", url: "https://www.mlb.com/tv" },
    { re: /Victory\+/i, app: "Victory+", url: "https://www.victoryplus.com/" },
    { re: /YouTube/i, app: "YouTube", url: "https://www.youtube.com/" },
  ];
  // Out-of-market regional games (you're in NYC) go to the league package
  const OUT_OF_MARKET = {
    nba: { app: "NBA League Pass", url: "https://www.nba.com/watch/league-pass-stream" },
    mlb: { app: "MLB.TV", url: "https://www.mlb.com/tv" },
    nhl: { app: "ESPN app", url: "https://www.espn.com/watch/" },
  };
  // Soccer favorites are keyed "soccer:ABBR" so a club follows you across competitions
  const DEFAULT_FAVS = ["nba:NY", "nba:SAC", "nhl:NYR", "nhl:SJ", "mlb:NYM", "nfl:NYG", "soccer:ARS"];
  const DEFAULT_FAV_LEAGUES = ["nba", "nhl", "nfl", "ncaaf", "mlb", "epl", "ucl", "pga"];
  const DEFAULT_META = { "nba:NY": "nba", "nba:SAC": "nba", "nhl:NYR": "nhl", "nhl:SJ": "nhl", "mlb:NYM": "mlb", "nfl:NYG": "nfl", "soccer:ARS": "epl" };
  const API = "https://site.api.espn.com/apis/site/v2/sports/";

  // =====================================================================
  // Storage (best effort) and state
  // =====================================================================
  const store = {
    get(k, d) { try { const v = localStorage.getItem("scoreline:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("scoreline:" + k, JSON.stringify(v)); } catch {} }
  };

  const state = {
    date: startOfDay(new Date()),
    tab: store.get("tab2", "live"),
    view: store.get("view3", "league"),
    favs: new Set(store.get("favs", DEFAULT_FAVS)),
    favMeta: store.get("favMeta", {}),   // key -> { lg, id, name, logo, color }
    next: store.get("next", {}),         // key -> { t, date, opp, oppLogo, at, none }
    closed: new Set(),
    alerts: store.get("alerts", false),
    favLeagues: store.get("favLeagues", DEFAULT_FAV_LEAGUES),
    data: {},
    loading: false,
    updatedAt: null,
    timer: null,
  };

  // =====================================================================
  // Helpers
  // =====================================================================
  function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function ymd(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
  function isoDate(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function sameDay(a, b) { return ymd(a) === ymd(b); }
  function isToday() { return sameDay(state.date, new Date()); }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function dayLabel(d) {
    if (sameDay(d, new Date())) return "Today";
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function timeLabel(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
  function whenLabel(iso) {
    const d = new Date(iso), days = (startOfDay(d) - startOfDay(new Date())) / 864e5;
    const day = days === 0 ? "Today" : days === 1 ? "Tomorrow" : days < 7 ? d.toLocaleDateString(undefined, { weekday: "short" }) : d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    return day + " " + timeLabel(iso);
  }
  function favKey(lg, abbr) { return (lg.soccer ? "soccer" : lg.id) + ":" + abbr; }
  function isFavTeam(lg, abbr) { return state.favs.has(favKey(lg, abbr)); }
  function hexColor(c) { return c && /^[0-9a-f]{6}$/i.test(c) ? "#" + c : ""; }
  function clockSecs(c) { const [m, s] = String(c || "").split(":").map(Number); return isNaN(m) ? Infinity : m * 60 + (s || 0); }

  const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  const STAR_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg>';
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>';
  const PLAY_BIG = '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" width="10" height="10"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const BOLT = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>';

  // =====================================================================
  // Normalize team-sport games
  // =====================================================================
  function normalize(ev, lg) {
    const comp = ev.competitions?.[0] || {};
    const st = ev.status || comp.status || {};
    const type = st.type || {};
    const teams = (comp.competitors || []).map(c => ({
      id: c.team?.id,
      abbr: c.team?.abbreviation || c.team?.shortDisplayName || "?",
      name: c.team?.shortDisplayName || c.team?.name || c.team?.displayName || "",
      full: c.team?.displayName || "",
      logo: c.team?.logo || c.team?.logos?.[0]?.href || "",
      color: hexColor(c.team?.color),
      score: c.score ?? "",
      winner: !!c.winner,
      homeAway: c.homeAway,
      record: c.records?.find(r => r.type === "total" || r.name === "overall")?.summary || c.records?.[0]?.summary || "",
      rank: c.curatedRank?.current && c.curatedRank.current <= 25 ? c.curatedRank.current : null,
    }));
    teams.sort((a, b) => (a.homeAway === "away" ? -1 : 1) - (b.homeAway === "away" ? -1 : 1));
    const gstate = type.state || "pre";
    const nets = [];
    (comp.geoBroadcasts || []).forEach(b => {
      const name = b.media?.shortName || b.media?.name;
      if (name) nets.push({ name, market: (b.market?.type || "national").toLowerCase() });
    });
    (comp.broadcasts || []).forEach(b => (b.names || []).forEach(name => {
      if (name && !nets.some(n => n.name === name)) nets.push({ name, market: (b.market || "national").toLowerCase() });
    }));
    const broadcast = nets.map(n => n.name).filter((v, i, a) => a.indexOf(v) === i).slice(0, 2).join(" / ");
    const odds = comp.odds?.[0];
    let status;
    if (gstate === "pre") {
      status = type.name === "STATUS_POSTPONED" ? "Postponed" : (type.completed ? type.shortDetail : timeLabel(ev.date));
    } else {
      status = type.shortDetail || type.detail || "";
      const p = st.period || 0, clk = st.displayClock;
      if (gstate === "in" && lg.label && clk && p && !/half|end|delay|susp|int/i.test(status)) {
        status = (p > lg.reg ? "OT" + (p - lg.reg > 1 ? p - lg.reg : "") : lg.label + p) + " " + clk;
      }
    }
    const g = {
      id: ev.id, lg, date: ev.date, state: gstate, status, teams, broadcast,
      link: ev.links?.find(l => (l.rel || []).includes("summary"))?.href || ev.links?.[0]?.href || "",
      watch: watchOptions(nets, lg),
      rankedClash: teams.length === 2 && teams.every(t => t.rank),
      note: comp.notes?.[0]?.headline || "",
      odds: odds ? { details: odds.details || "", ou: odds.overUnder } : null,
      sit: comp.situation || {}, period: st.period || 0, clock: st.displayClock || "",
      series: comp.series?.summary || "",
    };
    // Playoff game: postseason per ESPN, a series attached, or a playoff round in the game note
    g.playoff = ev.season?.type === 3 || !!comp.series ||
      /playoff|postseason|wild card|division series|championship series|world series|\bALCS\b|\bNLCS\b|\bALDS\b|\bNLDS\b|conference (semi)?finals?|stanley cup|nba finals|super bowl|cfp|bowl\b/i.test(g.note);
    g.close = isClose(g);
    Object.assign(g, interest(g));
    return g;
  }

  function isClose(g) {
    if (g.state !== "in" || g.teams.length !== 2) return false;
    const m = Math.abs((parseInt(g.teams[0].score) || 0) - (parseInt(g.teams[1].score) || 0));
    const p = g.period, r = CLOSE[g.lg.sport];
    if (!r) return false;
    if (g.lg.soccer) return m <= r.margin && (p > 2 || (parseInt(g.clock) || 0) >= r.fromMinute);
    if (g.lg.sport === "Baseball") return p >= r.fromInning && m <= r.margin;
    const last = g.lg.reg;
    if (p > last) return m <= r.margin; // overtime
    return p === last && clockSecs(g.clock) <= r.minsLeft * 60 && m <= r.margin;
  }

  // What makes a game worth flipping to
  function interest(g) {
    const reasons = [];
    let score = 0;
    const [a, h] = g.teams;
    if (!a || !h) return { hype: 0, reasons };
    const as = parseInt(a.score) || 0, hs = parseInt(h.score) || 0;
    const margin = Math.abs(as - hs);
    const reg = g.lg.soccer ? 2 : g.lg.reg;
    const secondHalf = g.lg.soccer ? g.period >= 2 : g.lg.sport === "Baseball" ? g.period >= 5 : g.period > reg / 2;
    const favAbbr = (g.odds?.details || "").match(/^([A-Z0-9&]{2,6})\s+-/)?.[1];
    if (g.state === "in") {
      score += 10;
      if (g.close) { score += 50; reasons.push("Close game"); }
      if (reg && g.period > reg) { score += 30; reasons.push(g.lg.sport === "Baseball" ? "Extra innings" : "Overtime"); }
      const leader = as > hs ? a : hs > as ? h : null;
      const favTeam = favAbbr ? g.teams.find(t => t.abbr === favAbbr) : null;
      const rankedFav = a.rank && !h.rank ? a : h.rank && !a.rank ? h : (a.rank && h.rank ? (a.rank < h.rank ? a : h) : null);
      const victim = favTeam || rankedFav;
      if (secondHalf && leader && victim && leader !== victim && margin > 0) {
        score += 40; reasons.push(victim.rank ? `Upset alert: No. ${victim.rank} trails` : "Upset alert");
      }
      if (g.rankedClash) { score += 20; reasons.push("Top 25 clash"); }
      if (g.playoff) { score += 25; reasons.push("Playoffs"); }
      if (!g.close && !reasons.length) score += Math.max(0, 15 - margin);
    } else if (g.state === "pre") {
      const mins = (new Date(g.date) - Date.now()) / 60000;
      if (mins <= 45 && mins > -15) { score += 8; reasons.push("Starting soon"); }
      if (g.rankedClash) { score += 6; reasons.push("Top 25 clash"); }
    }
    return { hype: score, reasons };
  }

  function watchOptions(nets, lg) {
    const out = [];
    const add = (o, net) => {
      const x = out.find(x => x.app === o.app);
      if (x) { if (!x.nets.includes(net)) x.nets.push(net); }
      else out.push({ app: o.app, url: o.url, nets: [net] });
    };
    nets.forEach(n => {
      const name = n.name.trim();
      const hit = WATCH.find(w => w.re.test(name));
      if (hit) return add(hit, name);
      if ((n.market === "home" || n.market === "away") && OUT_OF_MARKET[lg.id]) add(OUT_OF_MARKET[lg.id], name);
    });
    out.sort((a, b) => (b.app === "YouTube TV") - (a.app === "YouTube TV"));
    return out;
  }

  function watchPill(g) {
    if (g.state === "post" || !g.watch?.length) return g.broadcast && g.state !== "post" ? `<span class="net">${esc(g.broadcast)}</span>` : "";
    const [w, ...rest] = g.watch;
    const title = `${w.app}: ${w.nets.join(", ")}` + (rest.length ? ` · Also on ${rest.map(x => `${x.app} (${x.nets.join(", ")})`).join(", ")}` : "");
    return `<a class="watch" href="${esc(w.url)}" target="_blank" rel="noopener" title="${esc(title)}">${PLAY}<b>${esc(w.app)}</b>${w.nets[0].toLowerCase() === w.app.toLowerCase() ? "" : `<span>${esc(w.nets[0])}</span>`}${rest.length ? `<i>+${rest.length}</i>` : ""}</a>`;
  }

  // =====================================================================
  // Normalize leaderboards and events
  // =====================================================================
  function evState(ev) { return (ev.status || ev.competitions?.[0]?.status || {}).type || {}; }
  function str(v) { return v == null ? "" : typeof v === "object" ? (v.displayValue ?? v.value ?? "") : String(v); }

  function parseGolf(ev, lg) {
    const comp = ev.competitions?.[0] || {};
    const type = evState(ev);
    const rows = (comp.competitors || []).map((c, i) => {
      const ls = (c.linescores || []).filter(l => l && (l.value != null || l.displayValue));
      const today = ls.length ? ls[ls.length - 1] : null;
      const thruRaw = c.status?.thru ?? c.status?.hole;
      return {
        name: c.athlete?.displayName || c.athlete?.fullName || "",
        flag: c.athlete?.flag?.href || "",
        pos: c.status?.position?.displayName || c.position?.displayName || "",
        order: c.sortOrder ?? c.order ?? i + 1,
        total: str(c.score),
        today: today ? str(today.displayValue ?? today.value) : "",
        thru: thruRaw != null && thruRaw !== "" ? (+thruRaw >= 18 ? "F" : String(thruRaw)) : (c.status?.displayValue || ""),
      };
    }).filter(r => r.name).sort((a, b) => a.order - b.order);
    return { kind: "golf", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate,
      state: type.state || "pre", detail: type.detail || type.shortDetail || "", link: ev.links?.[0]?.href || "", rows };
  }

  function parseRace(ev, lg) {
    const sessions = (ev.competitions || []).map(c => ({
      abbr: c.type?.abbreviation || c.type?.text || "Session",
      date: c.date || ev.date,
      state: c.status?.type?.state || "pre",
      detail: c.status?.type?.shortDetail || "",
      top: (c.competitors || []).slice().sort((a, b) => (a.order || 99) - (b.order || 99)).slice(0, 3)
        .map(x => ({ name: x.athlete?.displayName || x.athlete?.shortName || "", flag: x.athlete?.flag?.href || "" })).filter(x => x.name),
    }));
    const type = evState(ev);
    const st = sessions.some(s => s.state === "in") ? "in" : (type.state || "pre");
    return { kind: "race", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", sessions };
  }

  function athleteRow(x) {
    return { name: x?.athlete?.displayName || x?.athlete?.shortName || x?.roster?.shortDisplayName || x?.team?.displayName || "",
      flag: x?.athlete?.flag?.href || "", winner: !!x?.winner,
      sets: (x?.linescores || []).map(l => l?.value).filter(v => v != null) };
  }

  function parseMma(ev, lg) {
    const fights = (ev.competitions || []).map(c => ({
      a: athleteRow(c.competitors?.[0]), b: athleteRow(c.competitors?.[1]),
      state: c.status?.type?.state || "pre", detail: c.status?.type?.shortDetail || c.status?.type?.detail || "",
      note: c.type?.abbreviation || c.note || "",
    })).filter(f => f.a.name && f.b.name);
    const type = evState(ev);
    const st = fights.some(f => f.state === "in") ? "in" : (type.state || "pre");
    return { kind: "mma", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", fights };
  }

  function parseTennis(ev, lg) {
    const comps = (ev.groupings || []).flatMap(gr => (gr.competitions || []).map(c => ({ c, group: gr.grouping?.displayName || "" })))
      .concat((ev.competitions || []).map(c => ({ c, group: "" })));
    const matches = comps.map(({ c, group }) => ({
      a: athleteRow(c.competitors?.[0]), b: athleteRow(c.competitors?.[1]),
      state: c.status?.type?.state || "pre", detail: c.status?.type?.shortDetail || "",
      round: c.round?.displayName || c.type?.text || group, date: c.date,
    })).filter(m => m.a.name && m.b.name);
    const ord = { in: 0, post: 1, pre: 2 };
    matches.sort((x, y) => (ord[x.state] - ord[y.state]) || (x.state === "post" ? new Date(y.date) - new Date(x.date) : new Date(x.date) - new Date(y.date)));
    const type = evState(ev);
    const st = matches.some(m => m.state === "in") ? "in" : (type.state || "pre");
    return { kind: "tennis", lg, id: ev.id, name: ev.shortName || ev.name || lg.name, date: ev.date, end: ev.endDate, state: st,
      detail: type.detail || "", link: ev.links?.[0]?.href || "", matches };
  }

  const PARSE = { golf: parseGolf, race: parseRace, mma: parseMma, tennis: parseTennis };

  // When viewing today, only keep events that are on now, starting soon, or just finished
  function relevant(e) {
    if (!isToday()) return true;
    const now = Date.now(), start = new Date(e.date).getTime();
    const end = e.end ? new Date(e.end).getTime() : start + 4 * 864e5;
    if (e.state === "in") return true;
    if (e.state === "pre") return start - now < 3 * 864e5;
    return now - end < 1.5 * 864e5;
  }

  // =====================================================================
  // Fetching
  // =====================================================================
  const topFlight = {};
  async function loadTopFlight(slug) {
    if (topFlight[slug]) return topFlight[slug];
    try {
      const j = await (await fetch(API + "soccer/" + slug + "/teams")).json();
      const ids = (j.sports?.[0]?.leagues?.[0]?.teams || []).map(t => t.team?.id).filter(Boolean);
      if (ids.length) topFlight[slug] = new Set(ids);
    } catch {}
    return topFlight[slug] || null;
  }

  async function loadLeague(lg) {
    if (lg.kind) {
      const url = API + lg.path + "/scoreboard" + (isToday() ? "" : "?dates=" + ymd(state.date));
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const special = (j.events || []).map(ev => { try { return PARSE[lg.kind](ev, lg); } catch { return null; } }).filter(Boolean).filter(relevant);
      return { events: [], special };
    }
    const r = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(state.date) + (lg.extra || ""), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    let games = (j.events || []).map(ev => normalize(ev, lg));
    // After midnight, last night's games are still on the previous day's scoreboard. Pull in the ones still being played.
    if (isToday() && new Date().getHours() < 8) {
      try {
        const ry = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(addDays(state.date, -1)) + (lg.extra || ""), { cache: "no-store" });
        if (ry.ok) {
          const have = new Set(games.map(g => g.id));
          ((await ry.json()).events || []).map(ev => normalize(ev, lg)).filter(g => !have.has(g.id) && g.state === "in").forEach(g => games.push(g));
        }
      } catch {}
    }
    if (lg.topFlight && games.length) {
      const set = await loadTopFlight(lg.topFlight);
      if (set) games = games.filter(g => g.teams.some(t => set.has(t.id)));
    }
    if (lg.id === "ncaaf" && games.length) {
      const p4 = new Set();
      await Promise.allSettled(P4_GROUPS.map(async gid => {
        const rr = await fetch(API + lg.path + "/scoreboard?dates=" + ymd(state.date) + "&groups=" + gid + "&limit=100", { cache: "no-store" });
        if (rr.ok) ((await rr.json()).events || []).forEach(e => p4.add(e.id));
      }));
      games.forEach(g => g.p4 = p4.has(g.id));
    }
    return { events: games, special: [] };
  }

  async function loadAll() {
    if (state.loading) return;
    state.loading = true;
    document.getElementById("refresh").classList.add("spin");
    const results = await Promise.allSettled(LEAGUES.map(loadLeague));
    results.forEach((r, i) => {
      state.data[LEAGUES[i].id] = r.status === "fulfilled" ? r.value : { events: [], special: [], error: r.reason?.message || "failed" };
    });
    state.loading = false;
    state.updatedAt = new Date();
    document.getElementById("refresh").classList.remove("spin");
    if (isToday()) checkAlerts();
    render();
    schedule();
    refreshNext();
  }

  function schedule() {
    clearTimeout(state.timer);
    if (!isToday()) return;
    const anyLive = allGames().some(g => g.state === "in") || allSpecial().some(e => e.state === "in");
    state.timer = setTimeout(() => { if (!document.hidden) loadAll(); else schedule(); }, anyLive ? 30000 : 120000);
  }

  function allGames() { return TEAM_LEAGUES.flatMap(lg => state.data[lg.id]?.events || []).map(g => ({ ...g, fav: g.teams.some(t => isFavTeam(g.lg, t.abbr)) })); }
  function allSpecial() { return EVENT_LEAGUES.flatMap(lg => state.data[lg.id]?.special || []); }

  // =====================================================================
  // Team index, follow list, next game
  // =====================================================================
  const teamCache = {};
  // Team lists come from the standings feed (ESPN's /teams feed blocks other websites)
  async function loadTeams(lgId) {
    if (teamCache[lgId]) return teamCache[lgId];
    const cached = store.get("teams2:" + lgId, null);
    if (cached && Date.now() - cached.t < 7 * 864e5) return (teamCache[lgId] = cached.list);
    const lg = LG[lgId];
    try {
      const j = await (await fetch("https://site.api.espn.com/apis/v2/sports/" + lg.path + "/standings")).json();
      const list = [], seen = new Set();
      const walk = n => {
        (n.standings?.entries || []).forEach(e => {
          const t = e.team;
          if (!t || seen.has(t.id)) return;
          seen.add(t.id);
          list.push({ lg: lgId, id: t.id, abbr: t.abbreviation || "", name: t.displayName || t.name || "", short: t.shortDisplayName || "",
            logo: t.logos?.[0]?.href || "", color: hexColor(t.color) });
        });
        (n.children || []).forEach(walk);
      };
      walk(j);
      if (list.length && !lg.college) store.set("teams2:" + lgId, { t: Date.now(), list });
      return (teamCache[lgId] = list);
    } catch { return []; }
  }

  function keyFor(t) { return favKey(LG[t.lg], t.abbr); }

  async function ensureMeta(keys) {
    for (const k of keys) {
      if (state.favMeta[k]) continue;
      const [prefix, abbr] = [k.slice(0, k.indexOf(":")), k.slice(k.indexOf(":") + 1)];
      const candidates = prefix === "soccer" ? [DEFAULT_META[k] || "epl", ...SOCCER_HOME] : [prefix];
      for (const lgId of [...new Set(candidates)]) {
        if (!LG[lgId]) continue;
        const hit = (await loadTeams(lgId)).find(t => t.abbr === abbr);
        if (hit) { state.favMeta[k] = { lg: lgId, id: hit.id, name: hit.name, logo: hit.logo, color: hit.color, abbr }; break; }
      }
    }
    store.set("favMeta", state.favMeta);
  }

  async function fetchNext(k) {
    const m = state.favMeta[k];
    if (!m) return;
    const lg = LG[m.lg];
    const parse = j => {
      const now = Date.now();
      const ev = (j.events || []).filter(e => new Date(e.date).getTime() > now - 4 * 3600e3)
        .filter(e => (e.competitions?.[0]?.status?.type?.state || "pre") !== "post")
        .sort((a, b) => new Date(a.date) - new Date(b.date))[0];
      if (!ev) return null;
      const cs = ev.competitions?.[0]?.competitors || [];
      const me = cs.find(c => String(c.team?.id || c.id) === String(m.id));
      const opp = cs.find(c => c !== me);
      return { date: ev.date, opp: opp?.team?.abbreviation || opp?.team?.shortDisplayName || "TBD",
        oppLogo: opp?.team?.logos?.[0]?.href || opp?.team?.logo || "", at: me?.homeAway === "away" ? "@" : "vs" };
    };
    let found = null;
    try {
      found = parse(await (await fetch(API + lg.path + "/teams/" + m.id + "/schedule")).json());
      if (!found && !lg.soccer) found = parse(await (await fetch(API + lg.path + "/teams/" + m.id + "/schedule?seasontype=3")).json());
    } catch {}
    state.next[k] = found ? { t: Date.now(), ...found } : { t: Date.now(), none: true };
  }

  async function refreshNext() {
    if (!isToday()) return;
    const playing = new Set(allGames().flatMap(g => g.teams.map(t => favKey(g.lg, t.abbr))));
    const todo = [...state.favs].filter(k => !playing.has(k))
      .filter(k => { const c = state.next[k]; return !c || Date.now() - c.t > 3 * 3600e3 || (c.date && new Date(c.date) < Date.now() - 4 * 3600e3); });
    if (!todo.length) return;
    await ensureMeta(todo);
    await Promise.allSettled(todo.map(fetchNext));
    store.set("next", state.next);
    render();
  }

  function toggleFav(k, meta) {
    if (state.favs.has(k)) { state.favs.delete(k); }
    else {
      state.favs.add(k);
      if (meta) { state.favMeta[k] = meta; store.set("favMeta", state.favMeta); }
      delete state.next[k];
    }
    store.set("favs", [...state.favs]);
    render();
    renderSheet();
    refreshNext();
  }

  // =====================================================================
  // Alerts
  // =====================================================================
  const seen = new Set();
  let primed = false;
  function triggers(g) {
    const out = [];
    if (g.close) out.push("close");
    g.reasons.forEach(r => { if (/Overtime|Extra/.test(r)) out.push("ot"); if (/Upset/.test(r)) out.push("upset"); });
    return out;
  }
  function checkAlerts() {
    allGames().filter(g => g.state === "in").forEach(g => {
      triggers(g).forEach(tr => {
        const k = g.id + ":" + tr;
        if (seen.has(k)) return;
        seen.add(k);
        if (primed && state.alerts) fireAlert(g, tr, k);
      });
    });
    primed = true;
  }
  function fireAlert(g, tr, tagKey) {
    const [a, h] = g.teams;
    const title = tr === "close" ? "Close game" : tr === "ot" ? (g.lg.sport === "Baseball" ? "Extra innings" : "Overtime") : (g.reasons.find(r => /Upset/.test(r)) || "Upset alert");
    const line = `${a.abbr} ${a.score}, ${h.abbr} ${h.score} · ${g.status}`;
    const where = g.watch?.[0] ? `Watch on ${g.watch[0].app}` : (g.lg.short || g.lg.name);
    toast(title, line, where, g.link, tr === "upset");
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        const opts = { body: `${line}\n${where}`, tag: tagKey, data: { url: g.link || location.href } };
        (navigator.serviceWorker?.getRegistration?.() || Promise.resolve(null))
          .then(reg => reg ? reg.showNotification(title, opts) : new Notification(title, opts))
          .catch(() => {});
      }
    } catch {}
  }
  function toast(title, line, sub, link, hot) {
    const box = document.getElementById("toasts");
    const el = document.createElement(link ? "a" : "div");
    el.className = "toast" + (hot ? " hot" : "");
    if (link) { el.href = link; el.target = "_blank"; el.rel = "noopener"; }
    el.innerHTML = `<b>${esc(title)}</b><span>${esc(line)}</span>${sub ? `<small>${esc(sub)}</small>` : ""}`;
    box.prepend(el);
    setTimeout(() => el.remove(), 9000);
  }

  // =====================================================================
  // Rendering: pieces (V1 look)
  // =====================================================================
  function starBtn(lg, t, extraClass = "") {
    const k = favKey(lg, t.abbr), on = state.favs.has(k);
    const meta = esc(JSON.stringify({ lg: lg.id, id: t.id, name: t.full || t.name, logo: t.logo, color: t.color, abbr: t.abbr }));
    return `<button class="star ${extraClass} ${on ? "on" : ""}" data-fav="${esc(k)}" data-meta="${meta}" title="${on ? "Unfollow" : "Follow"} ${esc(t.name)}" aria-label="${on ? "Unfollow" : "Follow"} ${esc(t.name)}">${on ? STAR : STAR_O}</button>`;
  }
  function statusClass(g) { return g.state === "in" ? "live" : g.state === "post" ? "final" : ""; }

  function situation(g) {
    const s = g.sit;
    if (g.state !== "in" || !s) return "";
    if (g.lg.sport === "Baseball" && s.outs != null) {
      const bases = `<svg class="diamond" viewBox="0 0 26 22" aria-label="Runners on base">
        <rect x="9.5" y="1.5" width="7" height="7" transform="rotate(45 13 5)" class="${s.onSecond ? "on" : ""}"/>
        <rect x="16.5" y="8.5" width="7" height="7" transform="rotate(45 20 12)" class="${s.onFirst ? "on" : ""}"/>
        <rect x="2.5" y="8.5" width="7" height="7" transform="rotate(45 6 12)" class="${s.onThird ? "on" : ""}"/></svg>`;
      const outs = `<span class="outs" aria-label="${s.outs} outs">${[0, 1, 2].map(i => `<i class="${i < s.outs ? "on" : ""}"></i>`).join("")}</span>`;
      return `${bases}${outs}<span class="txt">${s.balls != null ? `${s.balls}-${s.strikes}` : ""}${s.lastPlay?.text ? " · " + esc(s.lastPlay.text) : ""}</span>`;
    }
    if (g.lg.sport === "Football" && s.downDistanceText) {
      return `<span class="txt">${s.isRedZone ? '<b style="color:var(--live)">Red zone</b> · ' : ""}${esc(s.downDistanceText)}</span>`;
    }
    return "";
  }
  function footText(g) {
    const sit = situation(g);
    if (sit) return sit;
    if (g.state === "pre" && g.odds?.details) return `<span class="txt">${esc(g.odds.details)}${g.odds.ou ? " · O/U " + esc(g.odds.ou) : ""}${g.note ? " · " + esc(g.note) : ""}</span>`;
    return `<span class="txt">${esc(g.note)}</span>`;
  }

  // By league: card grid
  function teamRow(g, t, i) {
    const other = g.teams[1 - i];
    const lose = g.state === "post" && other && !t.winner && other.winner;
    const poss = g.state === "in" && g.sit?.possession && g.sit.possession === t.id;
    return `<div class="row ${lose ? "lose" : ""}">
      ${starBtn(g.lg, t)}
      ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : "<span></span>"}
      <span class="who">${t.rank ? `<span class="rk">${t.rank}</span>` : ""}<span class="ab" title="${esc(t.full)}">${esc(t.abbr)}</span><span class="rc">${esc(t.record)}</span>${poss ? '<span class="poss" title="Possession"></span>' : ""}</span>
      ${g.state === "pre" ? "" : `<span class="sc">${esc(t.score)}</span>`}
    </div>`;
  }
  function card(g) {
    return `<article class="g">
      <div class="g-top"><span class="st ${statusClass(g)}">${esc(g.status)}</span><span class="wslot">${watchPill(g)}</span></div>
      ${g.teams.map((t, i) => teamRow(g, t, i)).join("")}
      <div class="g-foot">${footText(g)}${g.link ? `<a href="${esc(g.link)}" target="_blank" rel="noopener">Gamecast</a>` : ""}</div>
    </article>`;
  }

  // By time: Sofascore-style list
  function tlRow(g) {
    const [a, h] = g.teams;
    if (!a || !h) return "";
    const lose = (t, o) => g.state === "post" && o.winner && !t.winner;
    const st = g.state === "pre" ? (g.status === timeLabel(g.date) ? "" : g.status) : g.status;
    const team = (t, o, at) => `<div class="tt ${lose(t, o) ? "lose" : ""}">
        ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ""}
        <span class="nm" title="${esc(t.full)}">${at ? "@ " : ""}${t.rank ? t.rank + " " : ""}${esc(t.name)}</span>
        ${starBtn(g.lg, t, "mini")}
      </div>`;
    const scores = g.state === "pre" ? "<span></span>" :
      `<div class="t-sc ${g.state === "in" ? "live" : ""}"><span class="${lose(a, h) ? "lose" : ""}">${esc(a.score)}</span><span class="${lose(h, a) ? "lose" : ""}">${esc(h.score)}</span></div>`;
    const pill = g.state !== "post" ? watchPill(g) : "";
    return `<div class="t ${g.fav ? "fav" : ""}">
      <div class="t-time"><span>${esc(timeLabel(g.date))}</span><span class="st ${statusClass(g)}">${esc(st || "–")}</span></div>
      <div class="t-teams">${team(a, h, false)}${team(h, a, true)}${pill ? `<div class="t-watch">${pill}</div>` : ""}</div>
      ${scores}
      ${g.link ? `<a class="t-go" href="${esc(g.link)}" target="_blank" rel="noopener" aria-label="Open Gamecast">${ARROW}</a>` : "<span></span>"}
    </div>`;
  }
  function timeline(list) {
    const sorted = list.slice().sort((x, y) => (new Date(x.date) - new Date(y.date)) || x.lg.id.localeCompare(y.lg.id));
    const groups = [];
    sorted.forEach(g => {
      const last = groups[groups.length - 1];
      if (last && last.lg.id === g.lg.id) last.games.push(g); else groups.push({ lg: g.lg, games: [g] });
    });
    return groups.map(gr => `<div class="tl-group">
      <div class="tl-head"><span class="tl-badge">${esc(gr.lg.short || gr.lg.name)}</span>
        <span class="crumb">${esc(gr.lg.sport)} <span>› ${esc(gr.lg.name)}${gr.games[0].note && gr.games.every(x => x.note === gr.games[0].note) ? " · " + esc(gr.games[0].note) : ""}</span></span></div>
      ${gr.games.map(tlRow).join("")}
    </div>`).join("");
  }

  // Worth Watching: Apple Sports-style rows
  function featured(g) {
    const [a, h] = g.teams;
    if (!a || !h) return "";
    const side = t => `<div class="f-team ${t.homeAway === "home" ? "home" : ""} ${isFavTeam(g.lg, t.abbr) ? "fav" : ""}">${starBtn(g.lg, t)}
        ${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ""}<span class="nm">${esc(t.name)}</span></div>`;
    const score = (t, o) => {
      if (g.state === "pre") return `<div class="f-sc rec">${esc(t.record)}</div>`;
      const lose = (g.state === "post" && o.winner && !t.winner) || (g.state === "in" && (+t.score) < (+o.score));
      return `<div class="f-sc ${lose ? "lose" : ""}">${esc(t.score)}</div>`;
    };
    let sub = "";
    if (g.state === "pre" && g.odds?.details) sub = esc(g.odds.details);
    else if (g.state === "in" && g.sit?.downDistanceText) sub = esc(g.sit.downDistanceText);
    if (g.series) sub = sub ? sub + "<br>" + esc(g.series) : esc(g.series);
    const pill = g.state !== "post" && g.watch?.length ? `<span>${watchPill(g)}</span>` : "";
    const lgLabel = (g.lg.short || g.lg.name) + (g.note ? " · " + g.note : "");
    const why = g.reasons || [];
    return `<div class="f">
      <div class="f-lg">${esc(lgLabel)}</div>${why.length ? `<div class="f-why">${why.map(r => `<span class="${/Upset/.test(r) ? "why hot" : "why"}">${esc(r)}</span>`).join("")}</div>` : ""}
      <div class="f-grid">
        ${side(a)}${score(a, h)}
        <div class="f-mid"><span class="s ${g.state === "in" ? "live" : ""}">${esc(g.status)}</span>${sub ? `<span class="sub">${sub}</span>` : ""}</div>
        ${score(h, a)}${side(h)}
      </div>
      <div class="f-act">${pill}${g.link ? `<a class="f-link" href="${esc(g.link)}" target="_blank" rel="noopener">Gamecast</a>` : ""}</div>
    </div>`;
  }

  // Your teams strip
  function stripChip(g) {
    const [a, h] = g.teams;
    if (!a || !h) return "";
    const side = (t, o) => {
      const lose = g.state !== "pre" && ((g.state === "post" && o.winner && !t.winner) || (g.state === "in" && (+t.score) < (+o.score)));
      return `<span class="ms-t ${lose ? "lose" : ""}">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ""}<b>${esc(t.abbr)}</b>${g.state === "pre" ? "" : `<em>${esc(t.score)}</em>`}</span>`;
    };
    return `<a class="ms ${g.state === "in" ? "live" : ""}" href="${esc(g.link || "#")}" target="_blank" rel="noopener" title="${esc(a.full + " at " + h.full)}">
      ${side(a, h)}${side(h, a)}<span class="ms-s">${esc(g.status)}</span></a>`;
  }
  function nextChip(k) {
    const m = state.favMeta[k], n = state.next[k];
    if (!m || !n || n.none || !n.date) return "";
    return `<div class="ms next" title="${esc(m.name)}: next game">
      <span class="ms-t">${m.logo ? `<img src="${esc(m.logo)}" alt="">` : ""}<b>${esc(m.abbr || k.split(":")[1])}</b></span>
      <span class="ms-t nx">${n.oppLogo ? `<img src="${esc(n.oppLogo)}" alt="">` : ""}<b>${esc(n.at)} ${esc(n.opp)}</b></span>
      <span class="ms-s"><small>Next</small>${esc(whenLabel(n.date))}</span></div>`;
  }

  // Golf leaderboard
  function toPar(v) { return String(v ?? "").startsWith("-") ? "under" : ""; }
  function eventMeta(e) {
    if (e.state === "in") return e.detail || "Live";
    if (e.state === "pre") return "Starts " + whenLabel(e.date);
    return e.detail || "Final";
  }
  function golfBlock(e) {
    const rows = e.rows.slice(0, 10);
    const leadTotal = rows[0]?.total;
    const body = rows.length ? `<div class="lb-wrap"><table class="lb">
      <thead><tr><th>Pos</th><th>Player</th><th class="num">Total</th><th class="num">Today</th><th class="num">Thru</th></tr></thead>
      <tbody>${rows.map(r => {
        const hot = /^-\d/.test(r.today) && parseInt(r.today) <= -5;
        return `<tr class="${r.total && r.total === leadTotal ? "lead" : ""}">
          <td class="pos">${esc(r.pos || "–")}</td>
          <td><span class="pl">${r.flag ? `<img src="${esc(r.flag)}" alt="">` : ""}${esc(r.name)}${hot ? ' <span class="why hot">Hot</span>' : ""}</span></td>
          <td class="num ${toPar(r.total)}">${esc(r.total || "–")}</td>
          <td class="num ${toPar(r.today)}">${esc(r.today || "–")}</td>
          <td class="num">${esc(r.thru || "–")}</td></tr>`;
      }).join("")}</tbody></table></div>` : `<div class="empty">Tee times aren't posted yet.</div>`;
    const more = e.link ? `<div class="f-act" style="padding-bottom:12px"><a class="f-link" href="${esc(e.link)}" target="_blank" rel="noopener">Full leaderboard</a></div>` : "";
    return block("ev-" + e.lg.id + e.id, `${e.lg.short || e.lg.name} · ${e.name}`, eventMeta(e), body + more);
  }
  const BLOCK = { golf: golfBlock };

  function block(id, title, meta, body, icon) {
    const closed = state.closed.has(id);
    return `<section class="block ${closed ? "closed" : ""}" data-block="${esc(id)}">
      <div class="bhead">${icon || ""}<h2>${esc(title)}</h2>${meta ? `<span class="meta">${esc(meta)}</span>` : ""}
        <button class="tog" data-tog="${esc(id)}" aria-expanded="${!closed}" aria-label="${closed ? "Expand" : "Collapse"} ${esc(title)}">${CHEV}</button></div>
      <div class="bbody">${body}</div></section>`;
  }

  // =====================================================================
  // Rendering: page
  // =====================================================================
  function renderDates() {
    const nav = document.getElementById("dates");
    const days = [];
    for (let i = -3; i <= 3; i++) days.push(addDays(state.date, i));
    nav.innerHTML = days.map(d => `<button class="d ${sameDay(d, state.date) ? "on" : ""}">${esc(dayLabel(d))}</button>`).join("") +
      `<label class="iconbtn" title="Pick a date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><input type="date" id="datepick" aria-label="Pick a date" value="${isoDate(state.date)}"></label>`;
    nav.querySelectorAll("button.d").forEach((b, i) => b.onclick = () => setDate(days[i]));
    nav.querySelector("#datepick").addEventListener("change", e => {
      const [y, m, d] = e.target.value.split("-").map(Number);
      if (y) setDate(new Date(y, m - 1, d));
    });
    const on = nav.querySelector(".on");
    if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function poolFor(tab, games) {
    switch (tab) {
      case "live": return games.filter(g => g.state === "in");
      case "all": case "mine": return games;
      case "close": return games.filter(g => g.close);
      case "cfb25": return games.filter(g => g.lg.id === "ncaaf" && g.teams.some(t => t.rank));
      case "p4": return games.filter(g => g.lg.id === "ncaaf" && g.p4);
      default: return games.filter(g => g.lg.id === tab);
    }
  }
  function specialsFor(tab) {
    const all = allSpecial();
    if (tab === "all") return all;
    if (tab === "live") return all.filter(e => e.state === "in");
    if (LG[tab]?.kind) return all.filter(e => e.lg.id === tab);
    return [];
  }

  function renderTabs(games) {
    const el = document.getElementById("tabs");
    const counts = {};
    games.forEach(g => counts[g.lg.id] = (counts[g.lg.id] || 0) + 1);
    allSpecial().forEach(e => counts[e.lg.id] = (counts[e.lg.id] || 0) + 1);
    const liveN = games.filter(g => g.state === "in").length + allSpecial().filter(e => e.state === "in").length;
    const closeN = games.filter(g => g.close).length;
    const chips = [
      { id: "live", label: "Live", n: liveN, hot: liveN > 0, cls: "livechip" },
      { id: "all", label: "All" },
      { id: "mine", label: "My Leagues" },
      { id: "close", label: "Close games", n: closeN, hot: closeN > 0 },
    ];
    const cfb = games.filter(g => g.lg.id === "ncaaf");
    LEAGUES.filter(lg => (MAIN_TABS.includes(lg.id) && counts[lg.id] > 0) || state.tab === lg.id).forEach(lg => {
      chips.push({ id: lg.id, label: lg.short || lg.name, n: counts[lg.id] || 0 });
      if (lg.id === "ncaaf") {
        chips.push({ id: "cfb25", label: "CFB Top 25", n: cfb.filter(g => g.teams.some(t => t.rank)).length });
        chips.push({ id: "p4", label: "Power 4", n: cfb.filter(g => g.p4).length });
      }
    });
    if (["cfb25", "p4"].includes(state.tab) && !chips.some(c => c.id === state.tab))
      chips.push({ id: state.tab, label: state.tab === "p4" ? "Power 4" : "CFB Top 25", n: 0 });
    el.innerHTML = chips.map(c =>
      `<button class="chip ${c.cls || ""} ${state.tab === c.id ? "on" : ""} ${c.hot ? "hot" : ""}" role="tab" aria-selected="${state.tab === c.id}" data-id="${c.id}">${esc(c.label)}${c.n != null ? `<span class="n">${c.n}</span>` : ""}</button>`).join("");
    el.querySelectorAll("button").forEach(b => b.onclick = () => { state.tab = b.dataset.id; store.set("tab2", state.tab); render(); });
  }

  function render() {
    document.querySelectorAll("[data-view]").forEach(b => { const on = b.dataset.view === state.view; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    const ab = document.getElementById("alertbtn");
    ab.setAttribute("aria-pressed", state.alerts);
    ab.title = state.alerts ? "Close-game alerts are on" : "Close-game alerts are off";
    renderDates();
    const games = allGames();
    renderTabs(games);
    const main = document.getElementById("main");
    const liveN = games.filter(g => g.state === "in").length;
    document.getElementById("livebug").hidden = liveN === 0;
    document.getElementById("liven").textContent = liveN;

    if (LEAGUES.every(lg => state.data[lg.id]?.error)) {
      main.innerHTML = `<div class="block err">Couldn't reach the scores feed. Check your internet connection, then tap refresh.</div>`;
      return;
    }

    const tab = state.tab;
    const pool = poolFor(tab, games);
    let html = "";

    // Your teams strip: today's games plus the next game for everyone else
    if (["live", "all", "mine"].includes(tab)) {
      const mine = games.filter(g => g.fav).sort((a, b) => ({ in: 0, pre: 1, post: 2 }[a.state] - { in: 0, pre: 1, post: 2 }[b.state]) || new Date(a.date) - new Date(b.date));
      const playing = new Set(mine.flatMap(g => g.teams.map(t => favKey(g.lg, t.abbr))));
      const nexts = isToday() ? [...state.favs].filter(k => !playing.has(k) && state.next[k]?.date)
        .sort((a, b) => new Date(state.next[a].date) - new Date(state.next[b].date)) : [];
      html += `<div class="mystrip" aria-label="Your teams">${mine.map(stripChip).join("")}${nexts.map(nextChip).join("")}<button class="ms add" data-open-sheet>${state.favs.size ? "+ Teams" : "+ Follow teams"}</button></div>`;
    }

    // Worth A Watch: always at the top of Live and All. Only games that earned it:
    // playoffs, close and late, overtime/extra innings, an upset brewing, or a Top 25 clash in progress.
    // Every close game and every playoff game makes it, your teams included. No filler.
    let shown = new Set();
    if (["live", "all"].includes(tab)) {
      const earned = g => g.state === "in" && (g.close || g.playoff || g.reasons.some(r => /Overtime|Extra|Upset|Top 25/.test(r)));
      const must = games.filter(g => earned(g) && (g.close || g.playoff)).sort((x, y) => y.hype - x.hype);
      const other = games.filter(g => earned(g) && !g.close && !g.playoff).sort((x, y) => y.hype - x.hype);
      const picks = must.concat(other.slice(0, Math.max(0, 6 - must.length)));
      if (picks.length) {
        if (tab === "live") shown = new Set(picks.map(g => g.id));
        html += block("worth", "Worth A Watch", `${picks.length} game${picks.length > 1 ? "s" : ""}`,
          `<div class="feat">${picks.map(featured).join("")}</div>`);
      }
    }

    // My Leagues: your leagues first, in your order, then everything else
    if (tab === "mine") {
      const order = state.favLeagues.filter(id => LG[id]).concat(LEAGUES.map(l => l.id).filter(id => !state.favLeagues.includes(id)));
      const off = [];
      html += `<div class="mine-bar"><span>Your leagues first, in your order</span><button class="chip" data-edit-leagues>Edit order</button></div>`;
      let dividerDone = false;
      order.forEach(id => {
        const lg = LG[id], isFav = state.favLeagues.includes(id);
        let section = "";
        if (lg.kind) {
          section = allSpecial().filter(e => e.lg.id === id).map(e => BLOCK[e.kind] ? BLOCK[e.kind](e) : "").join("");
        } else {
          const list = games.filter(g => g.lg.id === id).sort((x, y) => ({ in: 0, pre: 1, post: 2 }[x.state] - { in: 0, pre: 1, post: 2 }[y.state]) || new Date(x.date) - new Date(y.date));
          if (list.length) {
            const liveN = list.filter(g => g.state === "in").length;
            section = block("m-" + id, lg.name, liveN ? `${liveN} live · ${list.length} total` : `${list.length} game${list.length > 1 ? "s" : ""}`,
              state.view === "league" ? `<div class="grid">${list.map(card).join("")}</div>` : timeline(list));
          }
        }
        if (!section) { if (isFav) off.push(lg.short || lg.name); return; }
        if (!isFav && !dividerDone) { html += `<h3 class="mine-div">Other leagues</h3>`; dividerDone = true; }
        html += section;
      });
      if (off.length) html += `<p class="quiet">No games ${isToday() ? "today" : "this day"}: ${esc(off.join(", "))}</p>`;
      if (state.updatedAt) html += `<p class="updated">Updated ${state.updatedAt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" })}${isToday() ? " · refreshes automatically" : ""}</p>`;
      main.innerHTML = html;
      return;
    }

    // Golf
    specialsFor(tab).forEach(e => { html += BLOCK[e.kind](e); });

    // The feed
    const quiet = [];
    TEAM_LEAGUES.forEach(lg => { if (!pool.some(g => g.lg.id === lg.id) && !state.data[lg.id]?.error && !state.data[lg.id]?.events?.length) quiet.push(lg.short || lg.name); });
    const feed = pool.filter(g => !shown.has(g.id));
    if (feed.length && state.view === "league") {
      TEAM_LEAGUES.forEach(lg => {
        const list = feed.filter(g => g.lg.id === lg.id).sort((x, y) => ({ in: 0, pre: 1, post: 2 }[x.state] - { in: 0, pre: 1, post: 2 }[y.state]) || new Date(x.date) - new Date(y.date));
        if (!list.length) return;
        const liveN = list.filter(g => g.state === "in").length;
        html += block(lg.id, lg.name, liveN ? `${liveN} live · ${list.length} total` : `${list.length} game${list.length > 1 ? "s" : ""}`, `<div class="grid">${list.map(card).join("")}</div>`);
      });
    } else if (feed.length) {
      const live = feed.filter(g => g.state === "in").length;
      const title = tab === "live" ? "You Are Looking Live" : tab === "close" ? "Close Games" : dayLabel(state.date);
      html += block("feed", title, live && tab !== "live" ? `${live} live · ${feed.length} total` : `${feed.length} game${feed.length > 1 ? "s" : ""}`, timeline(feed));
    } else if (tab === "live" && !shown.size) {
      const upcoming = games.filter(g => g.state === "pre").sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 8);
      html += `<div class="block empty">Nothing live right now.${upcoming.length ? " Here's what's up next." : ""}</div>`;
      if (upcoming.length) html += block("upnext", "Up Next", `${upcoming.length} games`, state.view === "league" ? `<div class="grid">${upcoming.map(card).join("")}</div>` : timeline(upcoming));
    } else if (tab === "close") {
      html += `<div class="block empty">No close games right now. Games show up here late with a tight score: under 5:00 in the 4th or 3rd, the 7th inning or later in baseball, or the 85th minute in soccer.</div>`;
    } else if (!specialsFor(tab).length) {
      html += `<div class="block empty">No games on ${esc(dayLabel(state.date))}.</div>`;
    }
    if (tab === "all" && quiet.length) html += `<p class="quiet">Off ${isToday() ? "today" : "this day"}: ${esc(quiet.join(", "))}</p>`;
    if (state.updatedAt) html += `<p class="updated">Updated ${state.updatedAt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" })}${isToday() ? " · refreshes automatically" : ""}</p>`;
    main.innerHTML = html;
  }

  // =====================================================================
  // Team search sheet
  // =====================================================================
  let results = [], searchTimer = null, searchSeq = 0;
  const LG_BY_SLUG = Object.fromEntries(TEAM_LEAGUES.map(l => [l.path, l.id]));
  function openSheet() {
    document.getElementById("sheet").hidden = false;
    setTimeout(() => document.getElementById("q").focus(), 50);
    renderSheet();
    ensureMeta([...state.favs]).then(renderSheet);
  }
  function closeSheet() { document.getElementById("sheet").hidden = true; }
  function resRow(t, i, list) {
    const k = keyFor(t), on = state.favs.has(k);
    return `<div class="res-row">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : "<span></span>"}
      <span class="nm">${esc(t.name)}<small>${esc(LG[t.lg].short || LG[t.lg].name)}</small></span>
      <button class="follow ${on ? "on" : ""}" data-list="${list}" data-i="${i}">${on ? "Following" : "Follow"}</button></div>`;
  }
  function drawResults() {
    const el = document.getElementById("results");
    const q = document.getElementById("q").value.trim();
    if (!q) { el.innerHTML = '<p class="hint">Type a team, city or school. Covers the NFL, MLB, NBA, WNBA, NHL, college football and hoops, and the major soccer leagues.</p>'; return; }
    el.innerHTML = results.length ? results.map((t, i) => resRow(t, i, "r")).join("") : '<p class="hint">No teams match that.</p>';
  }
  function search() {
    clearTimeout(searchTimer);
    const q = document.getElementById("q").value.trim();
    if (!q) { results = []; drawResults(); return; }
    searchTimer = setTimeout(async () => {
      const seq = ++searchSeq;
      document.getElementById("results").innerHTML = '<p class="hint">Searching…</p>';
      try {
        const j = await (await fetch("https://site.api.espn.com/apis/common/v3/search?type=team&limit=40&query=" + encodeURIComponent(q))).json();
        if (seq !== searchSeq) return;
        const seen = new Set();
        results = (j.items || []).map(i => {
          const lgId = LG_BY_SLUG[(i.sport || "") + "/" + (i.league || i.defaultLeagueSlug || "")];
          if (!lgId || !i.abbreviation) return null;
          return { lg: lgId, id: i.id, abbr: i.abbreviation, name: i.displayName || i.name || "", short: i.name || "",
            logo: i.logos?.[0]?.href || "", color: hexColor(i.color) };
        }).filter(t => t && !seen.has(t.lg + t.id) && seen.add(t.lg + t.id)).slice(0, 25);
      } catch { results = []; }
      drawResults();
    }, 250);
  }
  let following = [];
  function renderSheet() {
    following = [...state.favs].map(k => {
      const m = state.favMeta[k];
      return m ? { lg: m.lg, id: m.id, abbr: m.abbr || k.split(":")[1], name: m.name, short: "", logo: m.logo, color: m.color }
        : { lg: DEFAULT_META[k] || k.split(":")[0], id: null, abbr: k.split(":")[1], name: k.split(":")[1], short: "", logo: "", color: "" };
    }).filter(t => LG[t.lg]);
    document.getElementById("following").innerHTML = following.length ? following.map((t, i) => resRow(t, i, "f")).join("") : '<p class="hint">Not following anyone yet.</p>';
    drawResults();
  }

  // =====================================================================
  // Events
  // =====================================================================
  function setDate(d) {
    state.date = startOfDay(d);
    state.data = {};
    primed = false;
    document.getElementById("main").innerHTML = '<div class="skel"></div><div class="skel"></div>';
    renderDates();
    loadAll();
  }

  document.getElementById("main").addEventListener("click", e => {
    const row = e.target.closest(".t[data-href]");
    if (row && !e.target.closest("a, button")) { window.open(row.dataset.href, "_blank", "noopener"); return; }
    const fav = e.target.closest("[data-fav]");
    if (fav) {
      let meta = null;
      try { meta = JSON.parse(fav.dataset.meta || "null"); } catch {}
      toggleFav(fav.dataset.fav, meta);
      return;
    }
    if (e.target.closest("[data-open-sheet]")) { openSheet(); return; }
    const tog = e.target.closest("[data-tog]");
    if (tog) {
      const id = tog.dataset.tog;
      state.closed.has(id) ? state.closed.delete(id) : state.closed.add(id);
      render();
    }
  });
  document.getElementById("sheet").addEventListener("click", e => {
    if (e.target.id === "sheet") return closeSheet();
    const b = e.target.closest(".follow");
    if (!b) return;
    const t = (b.dataset.list === "r" ? results : following)[+b.dataset.i];
    if (!t) return;
    toggleFav(keyFor(t), { lg: t.lg, id: t.id, name: t.name, logo: t.logo, color: t.color, abbr: t.abbr });
  });
  document.getElementById("sheet-x").onclick = closeSheet;
  // ---- League order editor
  function renderLeagueSheet() {
    const favs = state.favLeagues.filter(id => LG[id]);
    const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="${d ? "M6 9l6 6 6-6" : "M6 15l6-6 6 6"}"/></svg>`;
    document.getElementById("lfav").innerHTML = favs.length ? favs.map((id, i) => `<div class="lrow">
        <span class="lnum">${i + 1}</span><span class="nm">${esc(LG[id].name)}</span>
        <button class="lbtn" data-lmove="${id}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="Move ${esc(LG[id].name)} up">${arrow(false)}</button>
        <button class="lbtn" data-lmove="${id}" data-dir="1" ${i === favs.length - 1 ? "disabled" : ""} aria-label="Move ${esc(LG[id].name)} down">${arrow(true)}</button>
        <button class="follow on" data-ltoggle="${id}">Remove</button></div>`).join("") : '<p class="hint">No leagues picked yet.</p>';
    document.getElementById("lrest").innerHTML = LEAGUES.filter(l => !favs.includes(l.id)).map(l => `<div class="lrow">
        <span class="lnum"></span><span class="nm">${esc(l.name)}</span><span></span><span></span>
        <button class="follow" data-ltoggle="${l.id}">Add</button></div>`).join("");
  }
  function saveLeagues() { store.set("favLeagues", state.favLeagues); renderLeagueSheet(); render(); }
  document.getElementById("lsheet").addEventListener("click", e => {
    if (e.target.id === "lsheet") { document.getElementById("lsheet").hidden = true; return; }
    const mv = e.target.closest("[data-lmove]");
    if (mv) {
      const id = mv.dataset.lmove, dir = +mv.dataset.dir, arr = state.favLeagues.filter(x => LG[x]);
      const i = arr.indexOf(id), j = i + dir;
      if (i < 0 || j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      state.favLeagues = arr; saveLeagues(); return;
    }
    const tg = e.target.closest("[data-ltoggle]");
    if (tg) {
      const id = tg.dataset.ltoggle;
      state.favLeagues = state.favLeagues.includes(id) ? state.favLeagues.filter(x => x !== id) : [...state.favLeagues, id];
      saveLeagues();
    }
  });
  document.getElementById("lsheet-x").onclick = () => { document.getElementById("lsheet").hidden = true; };
  document.getElementById("main").addEventListener("click", e => {
    if (e.target.closest("[data-edit-leagues]")) { renderLeagueSheet(); document.getElementById("lsheet").hidden = false; }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); document.getElementById("lsheet").hidden = true; } });
  document.getElementById("q").addEventListener("input", search);
  document.getElementById("teamsbtn").onclick = openSheet;
  function goHome() {
    closeSheet();
    state.tab = "live"; store.set("tab2", "live");
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (!isToday()) setDate(new Date()); else render();
  }
  document.getElementById("homebtn").onclick = goHome;
  document.getElementById("brandbtn").onclick = goHome;
  document.getElementById("refresh").onclick = () => loadAll();
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { state.view = b.dataset.view; store.set("view3", state.view); render(); });
  document.getElementById("alertbtn").onclick = async () => {
    state.alerts = !state.alerts;
    store.set("alerts", state.alerts);
    render();
    if (state.alerts) {
      try { if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); } catch {}
      toast("Alerts on", "You'll get a heads-up when a game turns close, goes to overtime, or an upset starts brewing.", "Works while Scores is open");
    } else {
      toast("Alerts off", "No more heads-ups for close games.", "");
    }
  };
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && isToday() && state.updatedAt && Date.now() - state.updatedAt > 25000) loadAll();
  });
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  renderDates();
  loadAll();
})();
</script>
</body>
</html>
