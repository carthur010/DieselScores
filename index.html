<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scores</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scores">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b110f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: date strip on top, Apple-style "My Teams" scoreboard rows, then CBS-style collapsible two-column league grids */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --line: #dfe5e2;
  --fg: #111816;
  --muted: #66736e;
  --dim: #a3aeaa;
  --accent: #0b7a52;
  --accent-soft: #e2f2ea;
  --live: #d6263b;
  --star: #e0a400;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b110f; --surface: #121a17; --line: #22302b; --fg: #eef3f1;
    --muted: #8d9b96; --dim: #4c5a55; --accent: #3fcf8e; --accent-soft: #15302a;
    --live: #ff5468; --star: #ffc933; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b110f; --surface: #121a17; --line: #22302b; --fg: #eef3f1;
  --muted: #8d9b96; --dim: #4c5a55; --accent: #3fcf8e; --accent-soft: #15302a;
  --live: #ff5468; --star: #ffc933; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; }

/* Header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-block: 14px 6px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: .01em; line-height: 1; }
.brand span { color: var(--accent); }
.livecount {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--live);
  border: 1px solid color-mix(in srgb, var(--live) 40%, transparent); border-radius: 99px; padding: 3px 9px;
}
.livecount[hidden] { display: none !important; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); position: relative; }
.iconbtn:hover { background: var(--surface); color: var(--fg); }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn input[type=date] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.dates { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.dates::-webkit-scrollbar { display: none; }
.dates button {
  flex: 0 0 auto; padding: 10px 12px 12px; font-weight: 600; color: var(--muted); white-space: nowrap;
  border-bottom: 3px solid transparent;
}
.dates button.on { color: var(--fg); border-color: var(--accent); }
.dates button:hover { color: var(--fg); }

.leagues { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 10px; margin-inline: -16px; padding-inline: 16px; }
.leagues::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { opacity: .6; margin-left: 4px; font-weight: 500; }
.chip.hot:not(.on) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.hot .n { opacity: 1; font-weight: 700; }

main { padding-block: 16px 48px; display: grid; gap: 18px; }
.updated { font-size: 12px; color: var(--muted); text-align: right; }

/* Sections */
section.block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.bhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.bhead h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: .01em; }
.bhead .meta { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bhead h2 { white-space: nowrap; }
.bhead .tog { margin-left: auto; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: var(--bg); color: var(--muted); }
.bhead .tog svg { width: 16px; height: 16px; transition: transform .2s; }
section.closed .tog svg { transform: rotate(180deg); }
section.closed .bbody { display: none; }
section.closed .bhead { border-bottom: 0; }
.star-ico { color: var(--star); width: 20px; height: 20px; }

/* Apple-style featured rows */
.feat { padding: 4px 16px; }
.f { padding-block: 16px; border-bottom: 1px solid var(--line); }
.f:last-child { border-bottom: 0; }
.f-lg { text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; min-height: 15px; }
.f-grid { display: grid; grid-template-columns: minmax(70px, 1fr) minmax(52px, auto) minmax(96px, 1.2fr) minmax(52px, auto) minmax(70px, 1fr); align-items: center; gap: 6px; }
.f-team { display: grid; justify-items: center; gap: 4px; position: relative; text-align: center; min-width: 0; }
.f-team img { width: 52px; height: 52px; object-fit: contain; }
.f-team .nm { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.f-team.fav .nm { color: var(--fg); }
.f-sc { font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 1; text-align: center; }
.f-sc.lose { color: var(--dim); }
.f-sc.rec { font-family: var(--body); font-size: 14px; font-weight: 500; color: var(--muted); }
.f-mid { text-align: center; display: grid; gap: 4px; }
.f-mid .s { font-size: 17px; font-weight: 700; }
.f-mid .s.live { color: var(--live); }
.f-mid .sub { font-size: 12px; color: var(--muted); }
.f-act { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.f-link { font-size: 12px; color: var(--accent); font-weight: 600; }
.f-link:hover { text-decoration: underline; }

/* Star buttons */
.star { width: 24px; height: 24px; display: grid; place-items: center; color: var(--dim); flex: 0 0 auto; border-radius: 6px; }
.star svg { width: 15px; height: 15px; }
.star.on { color: var(--star); }
.star:hover { color: var(--star); }
.f-team .star { position: absolute; top: -4px; left: 0; }
.f-team.home .star { left: auto; right: 0; }

/* CBS-style compact grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.g { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
.g-top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.g-top .st { color: var(--muted); }
.g-top .st.live { color: var(--live); }
.g-top .st.final { color: var(--fg); }
.g-top .net { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
.close {
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px;
}
.row { display: grid; grid-template-columns: 24px 30px 1fr auto; align-items: center; gap: 8px; min-height: 34px; }
.row img { width: 28px; height: 28px; object-fit: contain; }
.row .who { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.row .ab { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .01em; }
.row .rk { font-size: 12px; color: var(--muted); }
.row .rc { font-size: 13px; color: var(--muted); white-space: nowrap; }
.row .poss { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); align-self: center; }
.row .sc { font-family: var(--display); font-weight: 700; font-size: 24px; min-width: 2ch; text-align: right; }
.row.lose .ab, .row.lose .sc { color: var(--muted); }
.row .odds { font-size: 13px; color: var(--muted); }
.g-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-height: 18px; }
.g-foot .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-foot a { color: var(--accent); font-weight: 600; white-space: nowrap; }
.g-foot a:hover { text-decoration: underline; }
.diamond { width: 26px; height: 22px; flex: 0 0 auto; }
.diamond rect { fill: none; stroke: var(--dim); stroke-width: 1.5; }
.diamond rect.on { fill: var(--accent); stroke: var(--accent); }
.outs { display: inline-flex; gap: 3px; }
.outs i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--dim); }
.outs i.on { background: var(--fg); border-color: var(--fg); }

/* Your teams strip */
.mystrip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.mystrip::-webkit-scrollbar { display: none; }
.ms { flex: 0 0 auto; display: grid; grid-template-columns: auto auto; column-gap: 10px; row-gap: 2px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.ms.live { border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
.ms-t { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.ms-t img { width: 18px; height: 18px; object-fit: contain; }
.ms-t b { font-family: var(--display); font-size: 17px; font-weight: 700; }
.ms-t em { font-style: normal; font-family: var(--display); font-size: 17px; font-weight: 700; margin-left: auto; padding-left: 6px; }
.ms-t.lose b, .ms-t.lose em { color: var(--muted); }
.ms-s { grid-column: 2; grid-row: 1 / span 2; font-size: 12px; font-weight: 600; color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line); align-self: stretch; display: grid; align-items: center; white-space: nowrap; }
.ms.live .ms-s { color: var(--live); }
.ms .ms-t:nth-child(2) { grid-row: 2; }
.ms .ms-t:nth-child(1) { grid-row: 1; }
.f-why { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.why { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 5px; }
.why.hot { color: var(--live); background: color-mix(in srgb, var(--live) 12%, transparent); }

/* Where to watch */
.wslot { margin-left: auto; min-width: 0; display: flex; justify-content: flex-end; }
.watch {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; min-width: 0;
  font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap; text-transform: none; letter-spacing: 0;
}
.watch b { font-weight: 700; }
.watch span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.watch i { font-style: normal; font-weight: 700; opacity: .7; }
.watch:hover { background: var(--accent); color: var(--bg); }
.watch:hover span { color: inherit; }
.g-top .net { margin-left: 0; max-width: 100%; }
.t-watch { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-left: 32px; min-width: 0; }
.f-mid .watch { justify-self: center; }

/* View toggle */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 7px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--bg); }

/* Sofascore-style timeline */
.tl-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px; }
.tl-badge { min-width: 38px; height: 38px; padding-inline: 6px; white-space: nowrap; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .02em; flex: 0 0 auto; max-width: 92px; overflow: hidden; }
.tl-head .crumb { font-weight: 700; font-size: 15px; }
.tl-head .crumb span { color: var(--muted); font-weight: 500; }
.tl-group { border-bottom: 6px solid var(--bg); }
.tl-group:last-child { border-bottom: 0; }
.t { display: grid; grid-template-columns: 76px 1fr auto 28px; align-items: center; gap: 10px; padding: 10px 16px; }
.t + .t { border-top: 1px solid var(--line); }
.t-time { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.t-time .st { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-time .st.live { color: var(--live); }
.t-time .st.final { color: var(--fg); }
.t-teams { display: grid; gap: 6px; min-width: 0; }
.tt { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 16px; font-weight: 500; }
.tt img { width: 22px; height: 22px; object-fit: contain; flex: 0 0 auto; }
.tt .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt.lose { color: var(--muted); }
.tt .mini { width: 18px; height: 18px; }
.tt .mini svg { width: 13px; height: 13px; }
.tt .mini:not(.on) { opacity: .45; }
.t-sc { display: grid; gap: 6px; text-align: right; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 22px; }
.t-sc.live { color: var(--live); }
.t-sc .lose { color: var(--muted); }
.t-go { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); }
.t-go:hover { color: var(--accent); border-color: var(--accent); }
.t-go svg { width: 14px; height: 14px; }
.t.fav { background: color-mix(in srgb, var(--star) 4%, transparent); }

.empty, .err { padding: 22px 16px; color: var(--muted); text-align: center; }
.err { color: var(--live); }
.quiet { font-size: 13px; color: var(--muted); text-align: center; }
.skel { height: 96px; border-radius: 14px; background: linear-gradient(90deg, var(--surface), var(--line), var(--surface)); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }

@media (max-width: 480px) {
  .f-team img { width: 42px; height: 42px; }
  .f-sc { font-size: 42px; }
  .f-grid { grid-template-columns: minmax(60px, 1fr) auto minmax(80px, 1.1fr) auto minmax(60px, 1fr); }
  .grid { grid-template-columns: 1fr; }
  .seg { order: 5; width: 100%; }
  .seg button { flex: 1; }
  .t { grid-template-columns: 64px 1fr auto 28px; gap: 8px; }
  .tt { font-size: 15px; }
  .g { border-right: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

[hidden] { display: none !important; }
:root { --surface-2: #f7f9f8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface-2: #17211d; } }
:root[data-theme="dark"] { --surface-2: #17211d; }
.iconbtn[aria-pressed="true"] { color: var(--accent); }
.bar .iconbtn { flex: 0 0 auto; }
.chip.livechip.hot:not(.on) { border-color: color-mix(in srgb, var(--live) 50%, var(--line)); color: var(--live); background: color-mix(in srgb, var(--live) 8%, var(--surface)); }
.ms.next { grid-template-columns: auto auto; }
.ms.next .ms-t.nx b { font-size: 14px; color: var(--muted); }
.ms.next .ms-s { display: grid; gap: 1px; align-content: center; font-size: 12px; color: var(--fg); }
.ms.next .ms-s small { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.ms.add { display: flex; align-items: center; padding: 0 14px; color: var(--muted); font-weight: 600; font-size: 13px; border-style: dashed; }
.ms.add:hover { color: var(--fg); }
.lb-wrap { overflow-x: auto; }
.lb { width: 100%; border-collapse: collapse; font-size: 14px; }
.lb th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lb td { padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lb td:nth-child(2) { white-space: normal; }
.lb tr:last-child td { border-bottom: 0; }
.lb .num { text-align: right; font-family: var(--display); font-weight: 700; font-size: 18px; }
.lb th.num { font-family: var(--body); font-size: 11px; }
.lb .under { color: var(--live); }
.lb .pos { font-family: var(--display); font-weight: 700; font-size: 17px; width: 44px; color: var(--muted); }
.lb .pl { display: flex; align-items: center; gap: 8px; }
.lb .pl img { width: 18px; height: 12px; object-fit: cover; }
.lb .lead td { background: var(--accent-soft); }
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .45); display: grid; place-items: center; padding: 16px; }
.sheet-card { width: min(560px, 100%); max-height: min(80vh, 760px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sheet-body { padding: 14px 16px; display: grid; gap: 12px; overflow-y: auto; }
.sheet input[type=search] { width: 100%; padding: 11px 12px; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
.sheet h3 { margin: 4px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.res { display: grid; }
.res-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); }
.res-row .stripe { display: none; }
.res-row:last-child { border-bottom: 0; }
.res-row img { width: 28px; height: 28px; object-fit: contain; }
.res-row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-row .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.res-row .follow { font: inherit; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); white-space: nowrap; cursor: pointer; }
.res-row .follow.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.sheet .hint { font-size: 13px; color: var(--muted); margin: 0; }
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; left: 12px; z-index: 60; display: grid; justify-items: end; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; width: min(380px, 100%); background: var(--fg); color: var(--bg); border-left: 5px solid var(--accent); border-radius: 10px; padding: 10px 14px; display: grid; gap: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: slide .25s ease-out; }
.toast.hot { border-left-color: var(--live); }
.toast b { font-family: var(--display); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 16px; }
.toast span { font-size: 14px; }
.toast small { font-size: 12px; opacity: .75; }
.mine-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; }
.mine-div { margin: 6px 2px -6px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

<script>
(() => {
  // =====================================================================
  // Config

  // reg = periods in regulation, label = period prefix for live clocks
  const LEAGUES = [
    { id: "nfl",    name: "NFL", sport: "Football", path: "football/nfl", reg: 4, label: "Q" },
